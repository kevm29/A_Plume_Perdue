<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Diorama de papier découpé : un seul univers sombre, couleurs explicites */
:root{
  --nuit:#110e14;
  --papier:#e9dfc7;
  --paille:#d9a441;
  --f-titre:"IM Fell English SC", Georgia, serif;
  --f-texte:"IM Fell English", Georgia, serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--nuit);color:var(--papier);overflow:hidden}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;display:block;outline:none;cursor:default}
.tc{position:fixed;display:none;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(233,223,199,.12);border:2px solid rgba(233,223,199,.32);
  color:var(--papier);font:24px/1 var(--f-titre);touch-action:none}
.tc.on{display:flex}
.tc:active,.tc.down{background:rgba(217,164,65,.35)}
#tl{left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:68px;height:68px}
#tr{left:calc(100px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:68px;height:68px}
#tj{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:86px;height:86px;font-size:15px}
#te{right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:58px;height:58px;font-size:18px}
#tp{right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));width:44px;height:44px;font-size:16px}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
  background:var(--nuit);font:22px/1.4 var(--f-texte);font-style:italic;padding-inline:max(16px,env(safe-area-inset-left,0px))}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>

<script>
'use strict';
/* =========================================================
   À PLUME PERDUE — noyau : constantes, utilitaires, sauvegarde
   ========================================================= */
const W=960,H=540,T=40,DX=10,DY=-8,PAD=24;
let ROWS=15; // hauteur du niveau en cases (15 par défaut, plus pour les niveaux d'escalade)
const PF_FAR=0.3,PF_MID=0.6;
const F_DISP='"IM Fell English SC", "Iowan Old Style", Georgia, serif';
const F_BODY='"IM Fell English", "Iowan Old Style", Georgia, serif';
const F_HAND='"La Belle Aurore", "Segoe Script", "Bradley Hand", cursive';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let dpr=1,scale=1,offX=0,offY=0,RS=1;

function resize(){
  const w=innerWidth,h=innerHeight;
  // résolution interne plafonnée (≈ 2× la taille logique) : au-delà, le jeu rame sans gain visible
  {const sc=Math.min(w/W,h/H);dpr=Math.min(window.devicePixelRatio||1,2,Math.max(1,1920/(W*sc)))}
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cv.style.width=w+'px';cv.style.height=h+'px';
  scale=Math.min(w/W,h/H);offX=(w-W*scale)/2;offY=(h-H*scale)/2;
}
addEventListener('resize',resize);resize();

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=Math.random;
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function shade(h,a){let[r,g,b]=hexRgb(h);if(a<0){r*=1+a;g*=1+a;b*=1+a}else{r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a}return`rgb(${r|0},${g|0},${b|0})`}
function rgba(h,a){const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`}
function mix(a,b,t){const A=hexRgb(a),B=hexRgb(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
/* grands calques (décor, tuiles) découpés en bandes de 2048 px : au-delà, la carte graphique
   ne sait plus les garder en mémoire et le navigateur repasse en dessin lent.
   Le dessin est envoyé à toutes les bandes à la fois, chacune décalée de sa position. */
const LAYER_CHUNK=2048;
function multiCtx(cs){const one=new Set(['createLinearGradient','createRadialGradient','createPattern','measureText','getImageData','isPointInPath']);
  return new Proxy({},{get(_,k){const v=cs[0][k];if(typeof v!=='function')return v;if(one.has(k))return(...a)=>cs[0][k](...a);return(...a)=>{let r;for(const c of cs)r=c[k](...a);return r}},set(_,k,v){for(const c of cs)c[k]=v;return true}})}
function mkLayer(w,h){w=Math.ceil(w);h=Math.ceil(h);const chunks=[];for(let x=0;x<w;x+=LAYER_CHUNK){const c=mk(Math.min(LAYER_CHUNK+2,w-x),h),g=c.getContext('2d');g.translate(-x,0);chunks.push({x,c,g})}
  return{layer:{width:w,height:h,chunks},g:multiCtx(chunks.map(k=>k.g))}}
/* copie d'une portion d'un calque découpé (coordonnées source en pixels du calque) */
function blitLayer(ctx,L2,sx,sy,sw,sh,dx,dy,dw,dh){const kx=dw/sw,ky=dh/sh;
  for(const ch of L2.chunks){const a=Math.max(sx,ch.x),b=Math.min(sx+sw,ch.x+ch.c.width);if(b<=a)continue;
    ctx.drawImage(ch.c,a-ch.x,sy,b-a,sh,dx+(a-sx)*kx,dy,(b-a)*kx,dh)}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function poly(g,pts){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath()}
function wrap(g,text,maxW){const out=[];for(const para of text.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line)}return out}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function makeNoise(size,alpha,seed,fibers){
  const c=mk(size,size),g=c.getContext('2d'),id=g.createImageData(size,size),R=mulberry(seed);
  for(let i=0;i<id.data.length;i+=4){const v=R()*255|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=R()*alpha|0}
  g.putImageData(id,0,0);
  if(fibers){g.lineWidth=.6;for(let i=0;i<fibers;i++){g.strokeStyle=R()<.5?'rgba(0,0,0,.10)':'rgba(255,255,255,.10)';g.beginPath();const x=R()*size,y=R()*size;g.moveTo(x,y);g.quadraticCurveTo(x+(R()-.5)*14,y+(R()-.5)*14,x+(R()-.5)*26,y+(R()-.5)*26);g.stroke()}}
  return c;
}

let AC=null,master,mGain,sGain,noiseBuf,tick=0,nextTick=0,loopN=0,CUR=null,curName='';

    mel:'E4:.5 r:.5 G4:.5 r:.5 A4:.5 r:.5 B4:1 r:.5 C5:.5 B4:.5 r:.5 A4:1 r:1 A4:.5 r:.5 C5:.5 r:.5 D5:.5 r:.5 E5:1 D#5:.5 E5:.5 F#5:.5 r:.5 B4:2 E5:.5 r:.5 D5:.5 r:.5 B4:.5 r:.5 G4:1 r:.5 E4:.5 G4:.5 C5:.5 B4:2 A4:.5 C5:.5 r:.5 A4:.5 B4:.5 D#5:.5 r:.5 F#4:.5 E4:2 r:2 E5:.5 r:.5 G5:.5 r:.5 A5:.5 r:.5 B5:1 r:.5 C6:.5 B5:.5 r:.5 A5:1 r:1 F#5:.5 r:.5 A5:.5 r:.5 G5:.5 F#5:.5 E5:1 D#5:.5 r:.5 B4:.5 r:.5 D#5:1 r:1 E5:.5 G5:.5 B5:.5 G5:.5 E5:.5 r:.5 B4:1 C5:.5 r:.5 A4:.5 r:.5 F#4:.5 r:.5 D#4:1 E4:.5 r:.5 B3:.5 r:.5 E4:1 r:1 r:4'},
  galop:{tempo:172,bpb:4,lead:['box','harpsi'],bass:'gallop',gap:0,

  // complainte du front

  // tango des toits de Reims
  tango:{tempo:112,bpb:4,lead:['accord','harpsi'],bass:'tango',gap:2,
    prog:'Am E E Am Dm Dm Am Am Am Dm C E Am Dm E Am',
    mel:'A4:1.5 B4:.5 C5:1 E5:1 D5:1.5 C5:.5 B4:2 G#4:1.5 A4:.5 B4:1 D5:1 C5:3 r:1 A5:1.5 G5:.5 F5:1 E5:1 D5:1.5 E5:.5 F5:2 E5:1 D5:1 C5:1 B4:1 A4:3 r:1 C5:1.5 D5:.5 E5:1 A5:1 G5:1.5 F5:.5 E5:2 F5:1 E5:1 D5:1 C5:1 B4:3 r:1 A4:1.5 B4:.5 C5:1 E5:1 F5:1.5 E5:.5 D5:2 B4:1 G#4:1 B4:1 E5:1 A4:3 r:1'},

/* chaque niveau a sa propre interprétation : transposition, tempo, instruments */
const LEVEL_SONGS={
  's1-1':{base:'valse'},'s1-2':{base:'menuet'},'s1-3':{base:'marche'},'s1-4':{base:'pizz'},
  's2-1':{base:'complainte'},'s2-2':{base:'complainte',tr:3,tempo:96,lead:['box','harpsi'],bass:'soft'},
  's2-3':{base:'complainte',tempo:138,lead:['harpsi','box'],bass:'gallop',gap:0},'s2-4':{base:'complainte',tr:-2,tempo:70,lead:['box'],bass:'soft'},
  's3-1':{base:'tango'},'s3-2':{base:'tango',tr:2,lead:['harpsi','accord']},'s3-3':{base:'tango',tempo:134,lead:['box','accord']},'s3-4':{base:'valse',tr:5,lead:['accord','box']},
  's4-1':{base:'orage',tempo:100,lead:['box','pizz']},'s4-2':{base:'orage',tempo:136,bass:'gallop'},'s4-3':{base:'orage',tr:-2,lead:['clar','pizz']},'s4-4':{base:'orage',tr:3,lead:['harpsi','box']},
  's5-1':{base:'polka'},'s5-2':{base:'polka',tr:-5,tempo:100,lead:['box','harpsi'],bass:'soft'},'s5-3':{base:'galop',tr:2},'s5-4':{base:'title',tempo:64},
  'chase':{base:'galop'},'title':{base:'title'}
};
const COMPILED={};
function compileSong(key){
  if(COMPILED[key])return COMPILED[key];
  const v=LEVEL_SONGS[key]||{base:key};const s=Object.assign({},SONGS[v.base],v);
  const prog=s.prog.split(' '),melT={};let tk=0;
  for(const tok of s.mel.trim().split(/\s+/)){const[n,b]=tok.split(':');if(n!=='r')melT[tk]={m:midi(n),d:+b};tk+=Math.round(+b*2)}
  return COMPILED[key]=Object.assign(s,{prog,melT,melLen:tk,tr:s.tr||0,len:(prog.length+s.gap)*s.bpb*2});
}
function voice(ch){return ch.map(m=>{while(m<55)m+=12;while(m>67)m-=12;return m}).sort((a,b)=>a-b)}
function setSong(name){if(curName===name)return;curName=name;CUR=compileSong(name);tick=0;loopN=0;if(AC)nextTick=AC.currentTime+.08}
function ensureAudio(){
  try{
    if(!AC){
      AC=new(window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=S.muted?0:.9;master.connect(AC.destination);
      mGain=AC.createGain();mGain.gain.value=.1;mGain.connect(master);
      sGain=AC.createGain();sGain.gain.value=.5;sGain.connect(master);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      nextTick=AC.currentTime+.1;setInterval(sched,50);
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
function env(g,t,v,a,hold,rel){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);if(hold)g.gain.setValueAtTime(v,t+a+hold);g.gain.exponentialRampToValueAtTime(.0008,t+a+(hold||0)+rel)}
function osc(type,f,t,stop,dest,gain){const o=AC.createOscillator();o.type=type;o.frequency.value=f;if(gain!=null){const g=AC.createGain();g.gain.value=gain;o.connect(g);g.connect(dest)}else o.connect(dest);o.start(t);o.stop(stop);return o}
function accordion(t,ms,dur,vol){

    case'alberti':{const p=[v[0],v[2],v[1],v[2]];INST.harpsi(t,p[bt%4]-12,spb*.5,.12);break}

/* =========================================================

   ========================================================= */
function parseLevel(i){
  const def=LEVELS[i],th=THEMES[def.theme];
  ROWS=def.rows||15;
  const rows=Array.from({length:ROWS},()=>'');
  const zones=[];
  for(const sg of def.segs){
    const seg=typeof sg==='string'?sg:sg.s;const c0=rows[0].length;
    const lines=seg.split('\n').map(s=>s.trim()).filter(s=>s.length);
    const w=Math.max(...lines.map(l=>l.length));
    const pad=ROWS-lines.length;
    for(let r=0;r<ROWS;r++){const l=r<pad?'':lines[r-pad];rows[r]+=l.padEnd(w,'.')}
    if(sg.z)zones.push({z:sg.z,c0,c1:c0+w-1});
  }
  // sol plus épais sous le niveau : la caméra peut se centrer sur Raymond même près du sol
  if(def.deep){for(let k=0;k<def.deep;k++)rows.push(def.deepFill?def.deepFill.repeat(rows[0].length):rows[rows.length-1]);ROWS+=def.deep}
  const wT=rows[0].length;
  const g=rows.map(r=>r.split(''));
  for(let r=0;r<ROWS;r++){g[r][0]='W';g[r][wT-1]='W'}
  // trous creusés dans le sol (cachettes) et paille cachée
  for(const[c,r]of def.holes||[])g[r][c]='.';
  for(const[c,r]of def.stashCells||[])g[r][c]='s';
  for(const[c,r]of def.fakes||[])g[r][c]='f';
  const L={def,i,w:wT,wpx:wT*T,g,th,corn:[],medal:null,cps:[],exit:null,rats:[],moths:[],movers:[],hints:[],quips:[],decor:[],lights:[],mark:new Set(),
    chaser:null,triggerX:Infinity,spawn:null,dome:null,avoid:[],updrafts:[],bolts:[],bells:[],zones,decorFront:[],hunters:[]};
  mechInit(L);
  let hi=0,qi=0,si=0,mi=0;
  const movers=[];
  for(let c=0;c<wT;c++)for(let r=0;r<ROWS;r++){
    const ch=g[r][c],x=c*T,y=r*T,cx=x+T/2,cy=y+T/2;
    let clear=true;
    switch(ch){
      case'S':L.spawn={x:cx,y:y+T};L.avoid.push(cx);break;
      case'o':L.corn.push({x:cx,y:cy,taken:false,ph:c*.7+r});break;
      case'*':if(def.medalOn)L.medal={x:cx,y:cy,taken:false};break;
      case'C':L.cps.push({x:cx,y:y+T,on:false});L.avoid.push(cx);break;
      case'E':L.exit={x:x-6,y:y-T,w:T+12,h:2*T};L.avoid.push(cx,cx+60,cx-60);break;
      case'k':if(th.walker!=='none')L.rats.push({kind:th.walker,x:cx-15,y:y+T-16,w:30,h:16,vx:th.walker==='goose'?110:th.walker==='hedgehog'?60:95,vy:0,onGround:false,t:(c*.37)%9,sq:1+(c%3)});break;
      case'r':if(th.walker!=='none'){const pk=th.walker==='boar'?'piglet':th.walker;L.rats.push({kind:pk,x:cx-11,y:y+T-12,w:22,h:12,vx:th.walker==='boar'?95:th.walker==='goose'?110:95,vy:0,onGround:false,t:(c*.53)%9,sq:2.5})}break;
      case'm':L.moths.push({kind:th.flyer,cx,cy,axis:'h',amp:95,sp:2.3+(mi%3)*.25,t:mi*1.3,x:cx,y:cy,fl:0});mi++;break;
      case'n':L.moths.push({kind:th.flyer,cx,cy,axis:'v',amp:72,sp:2.1+(mi%3)*.25,t:mi*1.3,x:cx,y:cy,fl:0});mi++;break;
      case'M':movers.push({c,r,axis:'h',w:2,kind:'dolly'});break;
      case'N':movers.push({c,r,axis:'h',w:5,kind:'truck'});break;
      case'V':movers.push({c,r,axis:'v',w:2,kind:'lift'});break;
      case'U':L.updrafts.push({x:x,w:2*T,top:0,bottom:y+T});break;
      case'!':L.bolts.push({x:cx,ph:L.bolts.length*.95,flash:0});break;
      case'T':L.triggerX=x;break;
      case'K':L.chaser={type:'cat',home:{x:cx-22,y:y+T-26},x:cx-22,y:y+T-26,w:44,h:26,vx:0,vy:0,state:'sleep',wakeT:0,onGround:true,t:0,f:1,meowT:2,rrT:0};L.avoid.push(cx);break;
      case'Q':L.chaser={type:'drone',home:{x:cx-18,y:cy-9},x:cx-18,y:cy-9,w:36,h:18,vx:0,vy:0,state:'sleep',t:0,f:1,meowT:2};break;
      case'Z':L.chaser={type:'buse',home:{x:cx-24,y:cy-14},x:cx-24,y:cy-14,w:48,h:26,vx:0,vy:0,state:'sleep',t:0,f:1,meowT:2,swoop:0,phase:'hover',pt:0};break;
      case'h':L.hints.push({x:cx,y:y+T,i:hi++});L.avoid.push(cx);break;
      case'q':L.quips.push({x:cx,i:qi++,fired:false});break;
      case'l':L.decor.push({t:th.outdoor?'lantern':'lamp',x:cx,y:cy});L.lights.push({x:cx,y:cy+14,r:250,i:.95,warm:1});break;
      case'g':L.decor.push({t:th.outdoor?'board':'sign',x:cx,y:cy,text:def.signs[si++]||''});break;
      case'u':L.dome={x:cx,floor:y+2*T};L.avoid.push(cx,cx-60,cx+60,cx-120);break;
      case'w':{let fr=r+1;while(fr<ROWS&&g[fr][c]!=='#')fr++;L.decor.push({t:'mammoth',x:cx,y:cy,floor:fr*T})}L.avoid.push(cx,cx-200,cx-100,cx+100,cx+200);break;
      case'c':L.decor.push({t:'clock',x:cx,y:cy});break;
      case'y':L.decor.push({t:'stove',x:cx,y:y+2*T});L.lights.push({x:cx,y:y+2*T-40,r:170,i:.8,warm:2});L.avoid.push(cx);break;
      case'b':L.decor.push({t:'bowl',x:cx,y:y+T});L.avoid.push(cx);break;
      case'j':{const b={t:'bell',x:cx,y:cy,ring:0,ph:0};L.decor.push(b);L.bells.push(b);L.lights.push({x:cx,y:cy+40,r:160,i:.5});break}
      case'i':L.decor.push({t:'statue',x:cx,y:y+T});break;
      case'|':L.mark.add(c+','+r);break;
      default:clear=mechParse(L,ch,c,r,x,y,cx,cy,movers);
    }
    if(clear)g[r][c]='.';
  }
  for(const m of movers){
    const pw=m.w*T;
    if(m.axis==='h'){
      let a=m.c-3,b=m.c+3;
      for(let c=m.c-1;c>=0;c--)if(L.mark.has(c+','+m.r)){a=c+1;break}
      for(let c=m.c+1;c<wT;c++)if(L.mark.has(c+','+m.r)){b=c-m.w;break}
      L.movers.push({axis:'h',kind:m.kind,x:m.c*T,y:m.r*T,w:pw,h:14,a0:a*T,a1:b*T,t:0,dx:0,dy:0,speed:m.kind==='truck'?115:m.kind==='tram'?95:72});
    }else if(m.axis==='s'||m.axis==='p'){
      const mm={axis:m.axis,kind:m.kind,c:m.c,r:m.r,x:m.c*T,y:m.r*T,w:T,h:12,t:0,dx:0,dy:0};mechMoverInit(L,mm);L.movers.push(mm);
    }else{
      let a=m.r-3,b=m.r;
      for(let r=m.r-1;r>=0;r--)if(L.mark.has(m.c+','+r)){a=r+1;break}
      for(let r=m.r+1;r<ROWS;r++)if(L.mark.has(m.c+','+r)){b=r-1;break}
      L.movers.push({axis:'v',kind:m.kind,x:m.c*T,y:m.r*T,w:pw,h:14,a0:b*T,a1:a*T,t:0,dx:0,dy:0,speed:60});
    }
  }
  mechPostParse(L);
  for(const m of L.movers){if(m.axis==='s'||m.axis==='p')continue;const span=Math.abs(m.a1-m.a0);const u=(m.axis==='h'?m.x-m.a0:m.a0-m.y)/Math.max(1,span);m.t=clamp(u,0,1)*span/m.speed}
  if(def.garlands)for(let x=200;x<L.wpx-200;x+=520){L.decor.push({t:'garland',x,y:130,w:400});for(let k=1;k<8;k+=2)L.lights.push({x:x+k*50,y:150+Math.sin(k/8*Math.PI)*40,r:110,i:.55,warm:1})}
  if(def.flyers)def.flyers.forEach((o,i)=>{const m=L.moths[i];if(!m||!o)return;if(o.kind)m.kind=o.kind;if(o.dy){m.cy+=o.dy;m.y=m.cy}if(o.amp)m.amp=o.amp;if(o.sp)m.sp=o.sp});
  for(const c of L.rats)c.base=Math.abs(c.vx);
  verdunPost(L);meusePost(L);zrPost(L);museePost(L);trainPost(L);garePost(L);langletPost(L);
  return L;
}

/* ---------- grille et collisions ---------- */
let L=null;
const SOLID='#XWD%R',SOLID_ART='#XWD';
function tile(c,r){if(c<0||c>=L.w)return'W';if(r<0||r>=ROWS)return'.';return L.g[r][c]}
function isSolid(c,r){return SOLID.includes(tile(c,r))}
function owTop(ch,c,r){if(ch==='f')return r!=null&&tile(c,r-1)!=='f'&&!(L.def.openTop&&L.def.openTop.some(([a,b])=>a===c&&b===r))?0:-1;return(ch==='='||ch==='B'||ch==='A'||ch==='t')?0:(ch==='p'||ch==='~')?14:ch==='J'?(shutterOpen(c)?0:-1):-1}
function groundAt(c,r){const ch=tile(c,r);return SOLID.includes(ch)||owTop(ch,c,r)>=0}
function moveX(e,dx){
  if(!dx)return false;e.x+=dx;
  const r0=Math.floor(e.y/T),r1=Math.floor((e.y+e.h-.01)/T);
  if(dx>0){const c=Math.floor((e.x+e.w-.001)/T);for(let r=r0;r<=r1;r++)if(isSolid(c,r)){e.x=c*T-e.w;e.vx=0;return true}}
  else{const c=Math.floor(e.x/T);for(let r=r0;r<=r1;r++)if(isSolid(c,r)){e.x=(c+1)*T;e.vx=0;return true}}
  return false;
}
function moveY(e,dy){
  const prevB=e.y+e.h;e.y+=dy;
  const c0=Math.floor(e.x/T),c1=Math.floor((e.x+e.w-.01)/T);
  if(dy>0){
    const b=e.y+e.h,r=Math.floor(b/T);
    for(let c=c0;c<=c1;c++){
      const ch=tile(c,r);
      if(SOLID.includes(ch)){e.y=r*T-e.h;e.vy=0;e.onGround=true;return true}
      const o=owTop(ch,c,r);
      if(o>=0){const top=r*T+o;if(prevB<=top+.5&&b>=top){e.y=top-e.h;e.vy=0;e.onGround=true;return true}}
    }
  }else if(dy<0){
    const r=Math.floor(e.y/T);
    for(let c=c0;c<=c1;c++)if(isSolid(c,r)){e.y=(r+1)*T;e.vy=0;return true}
  }
  return false;
}

function cobweb(g,x,y,s){
  g.strokeStyle='rgba(220,215,200,.2)';g.lineWidth=.8;
  const ang=k=>Math.PI*.05+k*Math.PI*.18;
  for(let k=0;k<6;k++){const a=ang(k);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s);g.stroke()}
  for(let r=s*.25;r<s;r+=s*.22){g.beginPath();for(let k=0;k<5;k++){const a=ang(k),a2=ang(k+1);const x1=x+Math.cos(a)*r,y1=y+Math.sin(a)*r,x2=x+Math.cos(a2)*r,y2=y+Math.sin(a2)*r;if(k===0)g.moveTo(x1,y1);g.quadraticCurveTo((x1+x2)/2-Math.cos((a+a2)/2)*r*.12,(y1+y2)/2-Math.sin((a+a2)/2)*r*.12,x2,y2)}g.stroke()}
}

function faceTop(g,x,y,col){g.fillStyle=col;poly(g,[x,y,x+T,y,x+T+DX,y+DY,x+DX,y+DY]);g.fill()}
function faceSide(g,x,y,h,col){g.fillStyle=col;poly(g,[x+T,y,x+T+DX,y+DY,x+T+DX,y+h+DY,x+T,y+h]);g.fill()}
function matCols(ch,th){
  switch(ch){
    case'#':return[th.floor,th.floorTop,shade(th.floor,-.3)];
    case'W':return th.outdoor?[shade(th.floor,-.35),shade(th.floorTop,-.2),shade(th.floor,-.5)]:['#241a14','#33251c','#1a120d'];
    case'X':return MAT.X[th.x];
    case'D':return MAT.D[th.d];
    case'=':return MAT['='][th.shelf];
    case'B':return['#d6caae','#ece2cb','#a99c80'];
  }
  return null;
}
function buildTiles(L){
  if(L.def.theme==='train')return trainBuildTiles(L);
  const th=L.th,R=mulberry(L.def.seed+9);
  const wpx=L.wpx+DX+8,hpx=ROWS*T+PAD;
  const TR=Math.min(RS,1.5),{layer:c,g}=mkLayer(wpx*TR,hpx*TR);g.scale(TR,TR);c.rs=TR;g.translate(0,PAD);
  if(!th.outdoor){
    for(let x=60;x<L.wpx;x+=180+R()*260){if(R()<.6)cobweb(g,x,-4,40+R()*40);else{g.strokeStyle='rgba(120,100,80,.5)';g.lineWidth=1.5;g.beginPath();g.moveTo(x,-10);g.quadraticCurveTo(x+30,60+R()*40,x+70,-10);g.stroke()}}
    for(let r=11;r<ROWS;r++)for(let cc=0;cc<L.w;cc++)if(L.g[r][cc]==='#'&&!isSolid(cc,r-1)){g.fillStyle=shade(th.wains,-.1);g.fillRect(cc*T+DX,r*T+DY-9,T,9);g.fillStyle=shade(th.wains,.25);g.fillRect(cc*T+DX,r*T+DY-9,T,1.5)}
  }
  const list=th.props;let x=80+R()*120,pi=Math.floor(R()*list.length);
  while(list.length&&x<L.wpx-120){
    const zp=L.def.zoneProps,zn=zp?zoneOfL(L,Math.floor(x/T)):null,zl=zp&&zn&&zp[zn];
    if(zl&&!zl.length){x+=40;continue}
    const p=PROPS[(zl||list)[pi%(zl||list).length]],w=p.w;
    const c0=Math.floor(x/T),c1=Math.floor((x+w)/T);let ok=true;
    const gr=cc=>{for(let r=1;r<ROWS;r++){const ch=L.g[r][cc];if(ch==='#')return r;if(ch!=='.')return -1}return -1};const g0=gr(c0);
    for(let cc=c0;cc<=c1;cc++)if(g0<0||gr(cc)!==g0)ok=false;
    for(const a of L.avoid)if(a>x-50&&a<x+w+50)ok=false;
    if(ok){g.save();p.d(g,x+DX,g0*T+DY,R);g.restore();pi++;x+=w+70+R()*200}else x+=40;
  }
  g.save();g.globalCompositeOperation='source-atop';g.fillStyle=rgba(th.fog,th.outdoor?.22:.28);g.fillRect(0,-PAD,wpx,hpx);g.restore();
  const sh=mk(wpx,hpx),sg=sh.getContext('2d');sg.translate(0,PAD);sg.fillStyle='#000';
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<L.w;cc++){const ch=L.g[r][cc];if(SOLID_ART.includes(ch)&&!(ch==='X'&&(th.x==='log'||thAtCol(L,cc).x==='none')))sg.fillRect(cc*T+10,r*T+12,T,T);else if(ch==='='||ch==='B')sg.fillRect(cc*T+10,r*T+12,T,12)}
  g.save();g.globalAlpha=th.outdoor?.38:.5;g.filter='blur(7px)';g.drawImage(sh,0,-PAD);g.restore();
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<L.w;cc++){
    const ch=L.g[r][cc],x=cc*T,y=r*T,thc=thAtCol(L,cc),mc=matCols(ch,thc);if(!mc)continue;
    if(ch==='='&&th.shelf==='branch')continue;

function drawTileFront(g,ch,x,y,cc,r,th){

    g.lineWidth=1.2;
    for(let k=0;k<26;k++){const a=-Math.PI*((k*37%26)/26),l=6+(k*13%9);const sx=x+4+(k*17%32),sy=y+16+(k*11%20);g.strokeStyle=k%3?'#e6b955':'#a77826';g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+Math.cos(a)*l,sy+Math.sin(a)*l);g.stroke()}

  g.save();g.translate(-1,-18);
  let wa=0;if(o.flap>0)wa=-.4-Math.sin(o.flap*40)*.9;else if(o.glide)wa=-.55;
  g.rotate(wa);
  g.fillStyle='#727b8f';g.beginPath();g.moveTo(6,0);g.quadraticCurveTo(2,-6,-10,-3);g.quadraticCurveTo(-15,1,-14,4);g.quadraticCurveTo(-4,7,6,3);g.closePath();g.fill();
  g.strokeStyle='#23262e';g.lineWidth=1.8;g.beginPath();g.moveTo(-3,-1);g.quadraticCurveTo(-5,2,-4,5);g.moveTo(-7,-1.5);g.quadraticCurveTo(-9,2,-8,5);g.stroke();
  g.strokeStyle='rgba(233,223,199,.7)';g.lineWidth=.8;g.setLineDash([1.6,1.8]);g.beginPath();g.moveTo(5,2.5);g.quadraticCurveTo(-4,6.5,-13,3.5);g.stroke();g.setLineDash([]);
  g.restore();

  g.save();g.translate(hb,0);
  const ng=g.createLinearGradient(4,-28,10,-16);ng.addColorStop(0,'#7a5d9e');ng.addColorStop(.55,'#4f9a7a');ng.addColorStop(1,'#8d96a8');

function drawThief(g,x,y,t,o){
  // cambrioleur : bonnet, loup, pull rayé, sac sur l'épaule, lampe torche
  o=o||{};const pose=o.pose||'stand';
  g.save();g.translate(x,y);g.globalAlpha*=o.alpha==null?1:o.alpha;g.scale(o.f||1,1);
  let crouch=0,lean=0,ph=0,stride=0,lift=0;
  if(pose==='walk'){ph=t*9;stride=1;lean=.05}
  else if(pose==='sneak'){ph=t*5;stride=1.15;crouch=13;lean=.26;lift=1}
  else if(pose==='oops'){crouch=-3;lean=-.12}
  else if(pose==='look'){crouch=5;lean=.08}
  else if(pose==='reach'){lean=-.06}
  const hipY=-46+crouch;
  const pant='#1d2029',shoe='#0e0f13';

  const leg=(p,back)=>{
    const sn=Math.sin(p),cs=Math.cos(p);

  };
  leg(ph+Math.PI,true);leg(ph,false);
  g.save();g.translate(0,hipY);g.rotate(lean);
  // sac de butin dans le dos
  g.save();g.translate(-17,-34);g.rotate(-.25+Math.sin(ph)*.05);

  g.fillStyle='#7a6448';g.fillRect(-4,-12,8,5);g.fillStyle='#8c7656';rr(g,-5,2,9,7,2);g.fill();
  g.restore();
  // torse : pull rayé
  g.save();rr(g,-13,-44,26,46,9);g.clip();
  g.fillStyle='#1f2433';g.fillRect(-14,-46,28,50);
  g.fillStyle='#d9d0bb';for(let yy=-40;yy<2;yy+=8)g.fillRect(-14,yy,28,3.5);
  g.fillStyle='rgba(0,0,0,.18)';g.fillRect(4,-46,10,50);
  g.restore();
  g.fillStyle='#14161d';rr(g,-13,-4,26,7,3);g.fill();
  // bras

    g.strokeStyle='#1f2433';g.lineWidth=7;g.beginPath();g.moveTo(sx,sy);g.lineTo(ex,ey);g.lineTo(hx,hy);g.stroke();
    g.strokeStyle='#d9d0bb';g.lineWidth=2;g.beginPath();g.moveTo((sx+ex)/2-2,(sy+ey)/2);g.lineTo((sx+ex)/2+2,(sy+ey)/2+2);g.stroke();
    g.fillStyle='#2a2a2e';g.beginPath();g.arc(hx,hy,4.2,0,7);g.fill();
    if(lamp){g.save();g.translate(hx,hy);g.rotate(lamp);g.fillStyle='#4a4d55';rr(g,-2,-3,13,6,2);g.fill();g.fillStyle='#f3e6b0';g.fillRect(10,-3,2,6);
      const gr=g.createLinearGradient(12,0,130,0);gr.addColorStop(0,'rgba(255,240,190,.35)');gr.addColorStop(1,'rgba(255,240,190,0)');
      g.fillStyle=gr;g.beginPath();g.moveTo(12,-2);g.lineTo(130,-26);g.lineTo(130,26);g.lineTo(12,2);g.closePath();g.fill();g.restore()}
  };
  const sw=Math.sin(ph)*stride;
  if(pose==='reach'){arm(-6,-38,4,-58,8,-76,0);arm(7,-38,16,-58,20,-74,0)}
  else if(pose==='oops'){arm(-8,-38,-20,-50,-18,-66,0);arm(8,-38,22,-50,22,-66,0)}
  else if(pose==='sneak'){arm(-4,-36,10,-30,13,-40,0);arm(8,-36,20,-28,24,-38,o.lamp?.35:0);g.fillStyle='#2a2a2e';for(const hx of[13,24]){g.beginPath();g.moveTo(hx-2,-37);g.lineTo(hx+3,-30);g.lineTo(hx+5,-31);g.closePath();g.fill()}}
  else if(pose==='look'){arm(-6,-38,-2,-22,4,-12,0);arm(7,-38,16,-26,26,-30,o.lamp?(o.head<0?Math.PI*.9:.1):0)}
  else{arm(-6,-38,-6-sw*6,-22,-4-sw*10,-8,0);arm(7,-38,10+sw*6,-22,18+sw*6,-14,o.lamp?.12:0)}
  // tête

  g.fillStyle='rgba(60,40,30,.28)';g.beginPath();g.ellipse(2*hd,6,8,5,0,0,Math.PI);g.fill(); // barbe de trois jours
  g.fillStyle='#c9a080';g.beginPath();g.ellipse(9*hd,2,3.5,4,0,0,7);g.fill(); // nez
  g.fillStyle='#b8705a';g.beginPath();g.ellipse(10.5*hd,2.5,2,2.4,0,0,7);g.fill();
  // loup noir

  g.fillStyle='#efe6d0';const ex=pose==='oops'?2.6:1.9;

  // bonnet
  g.fillStyle='#16181f';g.beginPath();g.moveTo(-12,-5);g.quadraticCurveTo(-11,-19,0,-19);g.quadraticCurveTo(11,-19,12,-5);g.closePath();g.fill();
  g.fillStyle='#22252e';rr(g,-12.5,-8,25,5,2);g.fill();
  g.fillStyle='#16181f';g.beginPath();g.arc(-3,-20,3,0,7);g.fill();
  g.restore();
  g.restore();
  g.restore();
}

/* éléments dessinés derrière les personnages */
function drawMechBack(t){
  const vis=x=>x>cam.x-160&&x<cam.x+W+160;
  // sol qui s'effondre
  for(const k of L.crumbles){if(k.state==='gone'||!vis(k.c*T))continue;const x=k.c*T+(k.state==='shake'?Math.sin(t*70)*2:0),y=k.r*T;
    g0crumble(ctx,x,y,k.state==='shake'?k.t:0)}
  // volets
  for(const s of L.shutters){const x=s.c*T,y=s.r*T;if(!vis(x))continue;const open=shutterOpen(s.c),soon=shutterSoon(s.c);
    ctx.save();if(open){ctx.fillStyle=soon?'#4f6a5a':'#3a6a5a';rr(ctx,x,y,T,10,2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x,y,T,2);ctx.fillStyle='rgba(0,0,0,.3)';for(let k=6;k<T;k+=8)ctx.fillRect(x+k,y+2,1.5,7);
      ctx.fillStyle='#222';ctx.fillRect(x-3,y+2,4,4);if(soon){ctx.translate(x+T/2,y+5);ctx.rotate(Math.sin(t*40)*.03);ctx.translate(-x-T/2,-y-5)}}
    else{ctx.fillStyle='#2e5a4a';rr(ctx,x-2,y-30,8,40,2);ctx.fill();ctx.fillStyle='rgba(0,0,0,.25)';for(let k=0;k<5;k++)ctx.fillRect(x-1,y-26+k*8,6,1.5)}
    ctx.restore()}
  // braséros
  for(const f of L.fires){if(!vis(f.x))continue;drawFire(ctx,f.x,f.y,t)}
  // gardiens
  for(const c of L.covers){if(!vis(c.x))continue;if(c.gone)drawCoverFurniture(ctx,c,t);if(c.gone&&!c.on&&c.sheetX!=null)drawFallenSheet(ctx,c.sheetX,c.y+c.h)}
  for(const gd of L.guards){if(!vis(gd.x))continue;if(gd.tangle>0)drawGuardTangled(ctx,gd,t);else{drawGuard(ctx,gd.x+gd.w/2,gd.y+gd.h,t,{f:gd.dir,walk:gd.pause>0||gd.sweep>0?0:1,look:gd.look,angry:gd.angry});if(gd.angry)drawAngry(ctx,gd,t)}}
  // chats qui guettent (ou qui courent)
  for(const w of L.watchers){if(w.mode==='tangle'&&w.k){drawCatTangled(ctx,w,t)}else if(w.mode!=='sit'&&w.k){if(vis(w.k.x))drawWatchCatRun(ctx,w,t)}else if(vis(w.x))drawWatchCat(ctx,w,t)}
  drawFakeAndStash(t);
  // portillons, poignées, cachettes
  for(const gt of L.gates)if(vis(gt.c*T))drawGate(ctx,gt,t);
  for(const a of L.acts){if(!vis(a.x)||a.style==='backdoor')continue;if(a.kind==='lever')drawLever(ctx,a,t);else if(a.kind==='secret')drawSecretProp(ctx,a,t)}
  // gargouilles
  for(const o of L.gargoyles){if(!vis(o.x))continue;drawGargoyle(ctx,o,t)}
}

/* éléments dessinés devant les personnages */
function drawMechFront(t){

  // cachettes : draps sur les meubles
  for(const c of L.covers){if(!vis(c.x)||c.gone)continue;const hid=!P.dead&&hiddenNow()&&P.x+P.w/2>c.x&&P.x+P.w/2<c.x+c.w;
    ctx.save();ctx.globalAlpha=hid?.82:1;

    for(let k=6;k>=0;k--)ctx.lineTo(c.x+4+k*(c.w-8)/6,c.y+c.h-((k%2)?5:0));ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1.5;for(let k=1;k<4;k++){ctx.beginPath();ctx.moveTo(c.x+k*c.w/4,c.y+12);ctx.quadraticCurveTo(c.x+k*c.w/4+4,c.y+c.h*.6,c.x+k*c.w/4-2,c.y+c.h-4);ctx.stroke()}

  // jets des gargouilles
  for(const o of L.gargoyles){if(o.state!=='jet'||!vis(o.x))continue;const x0=o.x+o.dir*20;ctx.save();ctx.strokeStyle='rgba(160,205,255,.75)';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0,o.y+4);ctx.quadraticCurveTo(x0+o.dir*o.len*.6,o.y+2,x0+o.dir*o.len,o.y+8+o.len*.05);ctx.stroke();ctx.strokeStyle='rgba(235,245,255,.6)';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
  // étourdi
  if(P.stun>0&&!P.dead){for(let k=0;k<3;k++){const a=t*6+k*2.1;ctx.fillStyle='#ffe080';ctx.beginPath();ctx.arc(P.x+P.w/2+Math.cos(a)*14,P.y-6+Math.sin(a)*4,2.4,0,7);ctx.fill()}}
  // brouillard : il cache le terrain au loin ; les coquelicots restent visibles
  if(L.def.fog){const fx=P.x+P.w/2;ctx.save();
    // brouillard par vagues : par moments on n'y voit plus qu'à deux cases
    const fk=L.def.fogWaves?.5+.5*Math.sin(G.lt*Math.PI*2/10):1,na=40+80*fk,nb=na+110+200*fk;
    if(L.def.fogWaves&&fk<.6){ctx.fillStyle='rgba(196,192,186,'+((.6-fk)*.7)+')';ctx.fillRect(cam.x,cam.y,W,H)}
    const gr=ctx.createLinearGradient(fx+na,0,fx+nb,0);gr.addColorStop(0,'rgba(196,192,186,0)');gr.addColorStop(1,'rgba(196,192,186,.97)');ctx.fillStyle=gr;ctx.fillRect(fx+na,cam.y-50,1400,H+100);
    const gl=ctx.createLinearGradient(fx-(na+80),0,fx-(nb+90),0);gl.addColorStop(0,'rgba(196,192,186,0)');gl.addColorStop(1,'rgba(196,192,186,.85)');ctx.fillStyle=gl;ctx.fillRect(fx-(nb+90)-1400+310,cam.y-50,1400,H+100);
    ctx.restore();
    for(const p of L.poppies){if(!vis(p.x))continue;
      if(tile(Math.floor(p.x/T),Math.floor(p.y/T))==='='){const lx=p.x,ly=p.y;ctx.save();ctx.fillStyle='#2a2a2a';ctx.fillRect(lx-5,ly-4,10,3);ctx.fillStyle='rgba(255,200,110,'+(.8+Math.sin(t*7+lx)*.1)+')';rr(ctx,lx-4,ly-14,8,10,2);ctx.fill();ctx.strokeStyle='#2a2a2a';ctx.lineWidth=1.2;ctx.strokeRect(lx-4,ly-14,8,10);ctx.beginPath();ctx.moveTo(lx-4,ly-14);ctx.lineTo(lx,ly-19);ctx.lineTo(lx+4,ly-14);ctx.stroke();const gl=ctx.createRadialGradient(lx,ly-9,1,lx,ly-9,30);gl.addColorStop(0,'rgba(255,200,110,.35)');gl.addColorStop(1,'rgba(255,200,110,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(lx,ly-9,30,0,7);ctx.fill();ctx.restore();continue}
      for(let k=-1;k<=1;k++){const px=p.x+k*11,py=p.y-6-Math.abs(k)*3+Math.sin(t*2+p.x+k)*1;ctx.strokeStyle='#3a5a30';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(px,p.y);ctx.lineTo(px,py);ctx.stroke();ctx.fillStyle='#d8302a';ctx.beginPath();ctx.arc(px,py-2,4,0,7);ctx.fill();ctx.fillStyle='#2a1a1a';ctx.beginPath();ctx.arc(px,py-2,1.2,0,7);ctx.fill()}}}
  // rafales : traînées de vent (rares pendant l'alerte, denses pendant la rafale)
  if(L.def.gust&&L.gust.state!=='calm'){const blow=L.gust.state==='blow',n=blow?34:10,dir=L.def.gust.dir||-1;ctx.save();
    for(let k=0;k<n;k++){const sp=blow?900:420,len=blow?60+(k%5)*14:30;const xx=cam.x+(((dir<0?-1:1)*G.lt*sp+k*137)%(W+200)+W+200)%(W+200)-100,yy=cam.y+20+((k*71)%(H-60));
      ctx.strokeStyle='rgba(235,240,250,'+(blow?.42:.22)+')';ctx.lineWidth=blow?1.6:1;ctx.beginPath();ctx.moveTo(xx,yy);ctx.quadraticCurveTo(xx-dir*len*.5,yy-3,xx-dir*len,yy+1);ctx.stroke()}
    ctx.restore()}
  // front d'orage (défilement forcé)
  if(L.auto&&L.auto.on){const x=L.auto.x;ctx.save();
    const gr=ctx.createLinearGradient(x-40,0,x+150,0);gr.addColorStop(0,'rgba(8,10,18,.97)');gr.addColorStop(1,'rgba(8,10,18,0)');ctx.fillStyle=gr;ctx.fillRect(x-200,cam.y-50,350,H+100);

    ctx.restore()}
}

function cutFlash(v,thunder){G.flash=Math.max(G.flash,v);if(!G.sim)setTimeout(()=>SFX.thunder(thunder),thunder>1?120:600)}
function stepCut(dt){
  const C=G.cut,dg=domeGeom(L.dome),k=L.carton,A=L.armoire,th=C.thief,BD=L.backDoor;C.t+=dt;
  for(let i=0;i<C.flashes.length;i++)if(C.flashes[i]!==null&&C.t>=C.flashes[i]){C.flashes[i]=null;cutFlash(.75,.6)}
  if(C.blink>0)C.blink-=dt;
  const once=(key,cond,fn)=>{if(!C.ev[key]&&cond){C.ev[key]=1;fn()}};
  // le voleur
  th.t+=dt;
  if(th.state==='out'&&C.t>1.4){th.state='walk';th.t=0}
  if(th.state==='walk'){th.x-=200*dt;if(th.x<=A.x+58){th.x=A.x+58;th.state='open';th.t=0}}
  else if(th.state==='open'){A.door=Math.min(1,th.t*2.5);A.shake=Math.sin(th.t*30)*.03*Math.min(1,th.t*2);if(th.t>.9&&k.state==='hold'){k.state='fall';k.vx=-270;k.vy=-60;k.vr=-3;if(!G.sim)SFX.whistle()}if(th.t>1.5){th.state='oops';th.t=0;bubble(th.x,L.dome.floor-140,'!','#2a2420')}}
  else if(th.state==='oops'){A.shake*=.9;if(th.t>1.0){th.state='look';th.t=0}}
  else if(th.state==='look'){
    // il regarde la cloche, puis à droite, puis à gauche
    th.head=th.t<.7?1:th.t<1.3?-1:th.t<1.9?1:-1;th.f=-1;
    once('dots',th.t>.4,()=>bubble(th.x,L.dome.floor-140,'…','#2a2420'));
    if(th.t>2.5){th.state='sneak';th.t=0;th.head=1;bubble(th.x,L.dome.floor-140,'Ni vu, ni connu…','#2a2420')}}
  else if(th.state==='sneak'){
    th.x-=62*dt;th.f=-1;
    // coups d'œil par-dessus l'épaule
    const c=th.t%1.6;th.head=c>1.1&&c<1.45?-1:1;
    if(th.x<=BD.x+40){BD.open=Math.min(1,BD.open+dt*3)}
    if(th.x<=BD.x+4){th.state='exit';th.t=0;if(!G.sim)SFX.squeak()}}
  else if(th.state==='exit'){th.x-=50*dt;th.alpha=Math.max(0,1-th.t*2.2);if(th.t>.6){BD.open=Math.max(0,BD.open-dt*2.5)}if(th.t>1.1&&BD.open<=0){th.state='gone';th.t=0;if(!G.sim)SFX.land()}}
  else if(th.state==='gone'){}
  // le carton
  if(k.state==='fall'){k.vy+=2600*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.rot+=k.vr*dt;
    if(k.y+20>=dg.domeTop&&Math.abs(k.x-L.dome.x)<60){
      k.state='fly';k.vx=-160;k.vy=-300;k.vr=-6;L.dome.broken=true;if(!G.sim)SFX.crash();G.shake=18;
      for(let i=0;i<46;i++){const a=-Math.PI*rnd(),s=120+rnd()*380;parts.push({type:'glass',x:L.dome.x+(rnd()-.5)*50,y:dg.domeTop+30+rnd()*40,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:40,rot:rnd()*6,vr:(rnd()-.5)*20,sz:2+rnd()*5,floor:L.dome.floor-2})}
      C.ray='fly';P.vx=120;P.vy=-430;
    }else if(k.y+20>=L.dome.floor){k.y=L.dome.floor-20;k.state='rest'}}
  if(k.state==='fly'){k.vy+=2600*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.rot+=k.vr*dt;if(k.x<L.dome.x-120){k.x=L.dome.x-120;k.vx=-k.vx*.3}
    if(k.y+20>=L.dome.floor){k.y=L.dome.floor-20;k.state='rest';k.rot=-.1;if(!G.sim)SFX.land();G.shake=6}}
  // Raymond : immobile tant que le voleur est là, se réveille pendant sa fuite
  if(C.ray==='fly'){P.vy+=GRAV*dt;moveX(P,P.vx*dt);P.onGround=false;moveY(P,P.vy*dt);P.spin+=dt*13;
    if(P.onGround){C.ray='lie';C.lieT=0;P.vx=0;P.spin=Math.PI;if(!G.sim)SFX.land();puff(P.x+P.w/2,P.y+P.h,12,true)}}
  else if(C.ray==='lie'){C.lieT+=dt;
    const sneaking=th.state==='sneak'||th.state==='exit'||th.state==='gone';
    once('w1',sneaking&&th.t>1.2&&th.state==='sneak',()=>{cutFlash(.7,.7);C.blink=.15;P.sx=1.06;P.sy=.94});
    once('w2',(th.state==='sneak'&&th.t>3.3)||th.state==='exit'||th.state==='gone',()=>{cutFlash(.8,.85);C.blink=1.1;bubble(P.x+P.w/2,P.y-14,'Rrrou… ?','#6a5a48')});
    if(th.state==='gone'&&th.t>1.0)once('w3',true,()=>{cutFlash(1,1.2);jolt()});
  }
  else if(C.ray==='jolt'){C.jt+=dt;P.spin=Math.PI*(1+Math.min(1,C.jt/.35));if(C.jt>.35)P.spin=0;
    if(C.jt>1.0&&!C.b2){C.b2=1;bubble(P.x+P.w/2,P.y-14,'Tous aux abris !','#a8322d')}
    if(C.jt>2.6&&!C.b3){C.b3=1;P.facing=1;bubble(P.x+P.w/2,P.y-14,'Matricule 7413, au rapport !','#a8322d')}
    if(C.jt>4.4)endCut()}
}
function jolt(){const C=G.cut;if(!C)return;if(C.ray!=='lie'){C.ray='lie';P.spin=Math.PI}C.ray='jolt';C.jt=0;P.vy=-200;bubble(P.x+P.w/2,P.y-14,'Tir de barrage !','#a8322d')}

function stepTomb(dt){

function stepPlay(dt){
  if(G.tombSeq){stepTomb(dt);return}
  G.lt+=dt;
  for(const m of L.movers){
    if(m.axis==='s'||m.axis==='p'){mechMoverStep(m,dt);continue}
    if(m.axis==='g')continue;   // véhicules de la gare : déplacés par gareStep
    const px=m.x,py=m.y;m.t+=dt;const span=Math.abs(m.a1-m.a0)||1;
    let u=(m.t*m.speed/span)%2;u=u>1?2-u:u;u=u*u*(3-2*u);
    if(m.axis==='h')m.x=m.a0+(m.a1-m.a0)*u;else m.y=m.a0+(m.a1-m.a0)*u;
    m.dx=m.x-px;m.dy=m.y-py;
  }

      m.x+=Math.sin(m.t*1.3+m.cx)*26+Math.sin(m.t*2.9+m.cy)*12;m.y+=Math.cos(m.t*1.7+m.cx)*16+Math.sin(m.t*3.7)*6;
      const near=!P.dead&&!G.cut&&Math.hypot(pcx-m.x,pcy-m.y)<240;m.att=clamp((m.att||0)+(near?dt*1.1:-dt*.7),0,1);
      const k=m.att*m.att*.6;m.x+=(pcx-m.x)*k;m.y+=(pcy-8-m.y)*k;
    }
    m.dir=m.x>=px?1:-1;
    m.near=!P.dead&&!G.cut&&Math.hypot(pcx-m.x,pcy-m.y)<200;
  }
  for(const c of L.rats){
    c.t+=dt;c.vy=Math.min(MAXFALL,c.vy+GRAV*dt);

      // le sanglier voit Raymond sur SA plateforme : il charge, et ses marcassins sortent de derrière lui
      const dx=pcx-(c.x+c.w/2),dir=Math.sign(c.vx)||1;
      const same=!P.dead&&!G.cut&&P.onGround&&Math.abs((P.y+P.h)-(c.y+c.h))<8&&samePlatform(c.x+c.w/2,pcx,Math.floor((c.y+c.h-2)/T));
      if(same&&Math.abs(dx)<420&&(Math.sign(dx)===dir||Math.abs(dx)<300)){if(Math.sign(dx)!==dir){c.vx=-c.vx}if(!(c.charge>0)&&!G.sim)SFX.grunt();c.charge=1.6;

}
function mechMoverStep(m,dt){
  const px=m.x,py=m.y;m.t=(m.t||0)+dt;
  if(m.kind==='horse'){m.x=m.bx;m.y=m.by+Math.sin(m.t*Math.PI*2/m.per+m.ph)*m.amp}
  else if(m.kind==='balloon'){m.x=m.bx;m.y=m.by+Math.sin(m.t*Math.PI*2/m.per+m.ph)*m.amp}
  else if(m.kind==='bell'){

    m.x=m.px+Math.sin(m.theta)*m.len-m.w/2;m.y=m.py+Math.cos(m.theta)*m.len-10;

    if(!atEnd)m.rung=0;

}

function mechStep(dt,pcx,pcy){
  const def=L.def;

    if(ph<dt*1.5&&!G.sim){G.flash=Math.max(G.flash,.55);setTimeout(()=>SFX.thunder(.45),220)}
    L.darkNow=def.dark.base*(1-f*.85)}

    L.gust.state=ph>=wstart?'blow':ph>=wstart-.9?'warn':'calm';L.gust.k=L.gust.state==='blow'?Math.min(1,(ph-wstart)*4,(gs.period-ph)*4):0;

      if(g.tangle<=0){g.sweep=1.4;g.sweepAng=g.dir>0?0:Math.PI;g.angry=true;const c=L.covers.find(c=>c.on===g);if(c){c.on=null;c.sheetX=g.x+g.w/2+22*g.dir}if(!G.sim){bubble(g.x+g.w/2,g.y-16,'Où il est, ce pigeon ?!','#a8322d');noise(.25,900,.2,'bandpass')}}

    if(g.pause>0){g.pause-=dt;g.look=Math.sin(g.t*3)*.18;if(g.pause<=0){if(g.noFlip)g.noFlip=false;else g.dir=-g.dir}}

      if(g.dir>0&&g.x+g.w>=g.a1){g.x=g.a1-g.w;g.pause=1.1}
      else if(g.dir<0&&g.x<=g.a0){g.x=g.a0;g.pause=1.1}}

}
function guardBeam(g){const ex=g.x+g.w/2+g.dir*10,ey=g.y+20;if(g.sweep>0)return{ex,ey,ang:g.sweepAng,len:250,half:.32};const base=g.dir>0?0:Math.PI;return{ex,ey,ang:base+g.look+.12*(g.dir>0?1:-1),len:250,half:.32}}

function sheltered(dir){

/* ---------- collisions mortelles ---------- */
function mechHit(hb){

/* ---------- poursuivants au sol (gardien au filet, balayeuse) ---------- */
function stepGroundChaser(K,dt,pcx,pcy){

  if(sweep){K.x+=K.vx*dt;K.y=K.home.y;if(!G.sim&&rnd()<.3)parts.push({type:'dust',x:K.x+(K.f>0?K.w:0),y:K.y+K.h-4,vx:-K.f*40,vy:-20,life:0,max:.5});return}
  K.vy=Math.min(MAXFALL,K.vy+GRAV*dt);
  moveX(K,K.vx*dt);K.onGround=false;moveY(K,K.vy*dt);
  if(K.onGround){
    const fx=dir>0?K.x+K.w+6:K.x-6,cf=Math.floor(fx/T),rf=Math.floor((K.y+K.h-2)/T);
    const la=dir>0?K.x+K.w+34:K.x-34,cl=Math.floor(la/T);
    const blocked=isSolid(cf,rf)||isSolid(cf,rf-1),gap=!groundAt(cl,rf+1)&&!isSolid(cl,rf),pins=tile(cl,rf)==='^'||tile(cf,rf)==='^',above=P.y+P.h<K.y-20&&Math.abs(dist)<110;
    if(blocked||gap||pins||above)chaserLeap(K,dir,rf);
  }
  if(K.y>ROWS*T+60)chaserReenter(K);
}
/* la buse traverse un braséro : elle prend feu */
function buseBurn(K,dt){
  if(K.state==='burn'){K.bt+=dt;K.vy=Math.min(500,(K.vy||0)+900*dt);K.x+=K.vx*dt*.4;K.y+=K.vy*dt;if(K.floor&&K.y+K.h>K.floor){K.y=K.floor-K.h;K.vy=0;K.vx*=.9}
    if(!G.sim&&rnd()<.6)parts.push({type:'dust',x:K.x+K.w/2+(rnd()-.5)*20,y:K.y,vx:(rnd()-.5)*40,vy:-60-rnd()*60,life:0,max:.9});
    if(K.bt>1.8){K.state='dead';G.chase=false;setSong(songKey(G.li));
      if(!G.sim)sayQueue([["RAYMOND","Elle a pris feu comme une botte de foin. Comme… de la paille ?",4.2],["RAYMOND","Les buses, ça ne brûle pas comme ça. Si ?",3.6]])}
    return true}
  if(K.state==='dead')return true;
  // quand Raymond dépasse le braséro, la buse fond sur lui... et plonge dans le feu
  if(!K.fireDive&&(K.state==='hover'||K.state==='warn'))for(const f of L.fires){const pcx=P.x+P.w/2;if(pcx>f.x+30&&pcx<f.x+420&&K.x+K.w/2<pcx){K.fireDive=true;K.state='dive';K.pt=0;const dx=f.x-(K.x+K.w/2),dy=(f.y-34)-(K.y+K.h/2),d=Math.hypot(dx,dy)||1;K.vx=dx/d*560;K.vy=dy/d*560;K.f=K.vx>=0?1:-1;if(!G.sim)SFX.screech();break}}

  return false;
}

/* ce que Raymond a déjà pris dans un niveau, pour toute la partie en cours :

function gotOf(li){if(!S.run.got)S.run.got={};const g=S.run.got[li]||(S.run.got[li]={c:[],m:false,sec:[],d:0});if(!g.sec)g.sec=g.s?[0]:[];return g}
const isSecretAct=a=>a.kind==='secret'||a.kind==='stash'||a.kind==='carton';

const SECRET_STYLE={vitrine:'drawer',insectes:'case',mammouth:'drawer',loge:'mailbox',front:'crate',turbines:'crate',trench:'crate',

function actPost(L){

  for(const a of L.acts)if(a.kind==='lever'){let best=null,bd=1e9;for(const g of L.gates){const d=Math.abs(g.c*T-a.x);if(d<bd){bd=d;best=g}}a.gate=best}
  {let k=0;const sq=L.def.stashQuips||[];for(const a of L.acts)if(a.kind==='stash'){a.q=sq[k]?[sq[k]]:null;k++}}

    q:["La girouette grince, tourne… et du pigeon d'or tombe une touffe de paille. Un collègue en métal précieux. Lui, au moins, on l'a mis sur un piédestal."]})}

/* à l'entrée d'un niveau : ce qui a déjà été pris disparaît */
function applyGot(i){

  for(const k of gt.c)if(L.corn[k]&&!L.corn[k].taken){L.corn[k].taken=true;n++}
  G.corn=n;
  if(gt.m&&L.medal){L.medal.taken=true;G.medal=true}
  let k=0;for(const a of L.acts)if(isSecretAct(a)){a.sid=k++;if(gt.sec.includes(a.sid)){a.used=true;if(a.kind==='carton')a.step=3}}
  L.secretTotal=k;G.key=false;

/* ---------- ce qui est à portée de bec ---------- */
function nearAct(){
  const pcx=P.x+P.w/2,pb=P.y+P.h;
  if(hiddenNow()&&!P.hideIn)for(const g of L.guards)if(!(g.tangle>0)&&Math.abs(g.x+g.w/2-pcx)<70&&Math.abs(g.y+g.h-pb)<34)return{type:'tangle',o:g};
  for(const a of L.acts){if(a.kind==='stash'||(a.kind==='lever'&&a.used))continue;if(a.when&&!a.when())continue;
    if(a.style==='helmet'){if(!a.used&&!P.onGround&&Math.abs(a.x-pcx)<36&&Math.abs(P.y+P.h/2-(a.y-92))<52)return{type:'secret',o:a};continue}
    if(a.style==='lamp'){if(!P.onGround&&Math.abs(a.x-pcx)<34&&Math.abs(P.y+P.h/2-a.ly)<40)return{type:'secret',o:a};continue}if(a.kind==='carton'&&L.carton){a.x=L.carton.x}if(Math.abs(a.x-pcx)<36&&Math.abs(a.y-pb)<40)return{type:a.kind,o:a}}
  return null;
}
function tryAct(){

  if(n.type==='tangle'){
    // le drap sous lequel on se cachait lui tombe dessus : Raymond est à découvert
    const g=n.o,c=coverHere();g.tangle=1.1;g.sweep=0;if(c){c.gone=true;c.on=g}
    unlock('a53');if(!G.sim)achKey();
    if(!G.sim){SFX.flap();noise(.35,700,.25,'bandpass');bubble(g.x+g.w/2,g.y-16,'Hé ! Qui a éteint ?','#2a3a5a');if(!G.tangleSaid){G.tangleSaid=true;say("Le drap sur la tête. Il va être de très mauvaise humeur en sortant de là. Filer.",3.8)}}
    return;
  }
  const a=n.o;

    // le carton FRAGILE qui a libéré Raymond : trois coups de bec pour l'ouvrir
    if(a.step>=3){if(!G.sim)say("Une enclume. Dans un carton FRAGILE. Le règlement ne prévoit pas ce cas.",3);return}
    a.step++;if(L.carton)L.carton.step=a.step;
    if(!G.sim){noise(.25,2600,.18,'highpass');if(a.step===1)say("Du scotch. Du bon scotch d'avant-guerre. Il résiste.",3);else if(a.step===2)say("Les rabats. Du papier journal froissé… de 1931.",3)}
    if(a.step===3){grantSecret(a,a.y-40);if(!G.sim)sayQueue([['RAYMOND',"De la paille de calage. Et au fond… une enclume de cordonnier.",3.6],['RAYMOND',"Étiquetée « FRAGILE ». Voilà donc ce qui m'a libéré.",3.6]])}
    return}

  if(a.kind==='hide'){museeHide(a);return}
  if(a.kind==='lever'){a.used=true;a.t=0;unlock('a3');if(a.gate)a.gate.opening=true;if(!G.sim){SFX.check();if(L.def.leverQuip)say(L.def.leverQuip,3.6)}return}
  if(a.kind==='secret'){
    if(a.style==='vane'){a.av=(a.av>0?a.av:0)+9;if(!G.sim)noise(.3,1800,.08,'bandpass');if(a.used){if(!G.sim)say(pick(["Nord, sud, est, ouest. Il tourne, le pigeon d'or, mais il ne va nulle part. Je connais ça.","Le vent n'y est pour rien. C'est moi qui décide, ici."]),3);return}grantSecret(a,a.y-30);return}
    if(a.used){a.t=0;a.anim=1;if(!G.sim)say(pick(["Vide. J'ai déjà tout pris.","Plus rien là-dedans. Je repasserai à la prochaine guerre."]),2.6);return}
    if(a.locked&&!G.key){if(!G.sim){tone(220,.12,'square',.05);say(a.lockQ||"Fermé à clef. Le gardien a les clefs. Le gardien a toujours les clefs.",3.4)}return}
    a.anim=1;a.t=0;grantSecret(a,a.y-24);
  }
}
function grantSecret(a,py){
  a.used=true;{const gt=gotOf(G.li);if(!gt.sec.includes(a.sid))gt.sec.push(a.sid)}achSecret(G.li,a.sid);if(a.style==='backdoor')unlock('a2');

}
/* le drap sous lequel se trouve Raymond */
function coverHere(){const cx=P.x+P.w/2,cy=P.y+P.h/2;for(const c of L.covers)if(!c.gone&&cx>c.x+4&&cx<c.x+c.w-4&&cy>c.y&&cy<c.y+c.h)return c;return null}
/* dans un faux mur (carton creux) */
function inFake(){const c=Math.floor((P.x+P.w/2)/T),r=Math.floor((P.y+P.h/2)/T);return tile(c,r)==='f'}
/* tuiles creuses : dessinées comme des blocs, mais on peut y entrer */
function buildTilesF(L){const fk=[],fw=[];for(const[c,r]of L.def.fakeWire||[])if(L.g[r][c]==='.'){fw.push([r,c]);L.g[r][c]='^'}for(let r=0;r<ROWS;r++)for(let c=0;c<L.w;c++)if(L.g[r][c]==='f'){fk.push([r,c]);let n='D';for(const[dr,dc]of[[0,-1],[0,1],[1,0],[-1,0],[0,-2],[0,2]]){const v=(L.g[r+dr]||[])[c+dc];if(v==='X'||v==='D'||v==='#'){n=v;break}}L.g[r][c]=n}const t=buildTiles(L);for(const[r,c]of fk)L.g[r][c]='f';for(const[r,c]of fw)L.g[r][c]='.';return t}

/* ---------- mise à jour ---------- */
function actStep(dt){
  for(const a of L.acts){
    a.t+=dt;
    if(a.style==='vane'){a.ang+=a.av*dt+Math.sin(a.t*.7)*.15*dt;a.av*=Math.exp(-dt*.9);continue}
    if(a.kind==='lever')a.open=a.used?Math.min(1,a.t*4):0;
    else if(a.anim){a.open=a.t<.22?a.t/.22:a.t<1.5?1:Math.max(0,1-(a.t-1.5)*4);if(a.t>1.8)a.anim=0}
    else a.open=0;
    if(a.style==='backdoor'&&L.backDoor&&!G.cut)L.backDoor.open=a.open;
    if(a.kind==='carton'&&L.carton)L.carton.step=a.step;
  }
  for(const g of L.gates)if(g.opening&&g.open<1){g.open=Math.min(1,g.open+dt*1.6);if(g.open>.55)for(let r=g.r0;r<=g.r1;r++)if(L.g[r][g.c]==='R')L.g[r][g.c]='.'}
  if(P.peck>0)P.peck-=dt;
  if(!P.dead)for(const a of L.acts)if(a.kind==='stash'&&!a.used&&Math.abs(a.x-(P.x+P.w/2))<22&&Math.abs(a.y-(P.y+P.h/2))<24)grantSecret(a,a.y-10);
}
/* au retour au cartel : les gardiens se démêlent, les chats retournent s'asseoir */
function actRespawn(){

  L.grenades=[];G.grenadeHit=false;if(L.chaser&&L.chaser.type==='drone'){L.chaser.sp='scan';L.chaser.lock=0;L.chaser.gt=0;L.chaser.hitP=false}
  L.rats=L.rats.filter(c=>!c.chase);for(const c of L.rats){c.spawned=false;c.charge=0}
  for(const m of L.mines){m.state='idle';m.t=0;m.boom=false}
  for(const g of L.guards){g.tangle=0;g.sweep=0;g.angry=false}
  for(const c of L.covers){c.gone=false;c.on=null}

/* ---------- le chat aux yeux brillants : il guette, puis bondit ---------- */
function watchReset(w){w.mode='sit';w.k=null;w.seen=false;w.t=0;w.state='closed';w.open=0}
function watchStep(w,dt,pcx,pcy){
  const onScreen=Math.abs(w.x-(cam.x+W/2))<W/2+30;
  if(w.mode==='sit'||!w.mode){
    w.mode='sit';
    // il ne commence à guetter qu'une fois entré dans le champ : yeux toujours fermés à l'arrivée
    if(!w.seen){w.state='closed';w.open=0;if(onScreen){w.seen=true;w.t=0}return}
    w.t+=dt;const cyc=w.t%5.6;w.state=cyc<3.1?'closed':cyc<3.8?'warn':'open';
    w.open=w.state==='open'?Math.min(1,(cyc-3.8)*6):w.state==='warn'?.18:0;
    const moving=Math.abs(P.vx)>35||!P.onGround;
    if(w.state==='open'&&w.open>.6&&!P.dead&&!G.cut&&moving&&Math.abs(w.x-pcx)<520&&Math.abs(w.y-pcy)<220&&!hiddenNow()){
      w.mode='chase';w.ct=0;w.k={x:w.x-22,y:w.y-26,w:44,h:26,vx:0,vy:-380,onGround:false,f:pcx>w.x?1:-1};
      if(!G.sim){SFX.hiss();setTimeout(()=>meow(1),200)}
    }
    return;
  }
  const k=w.k;w.ct+=dt;
  if(w.mode==='tangle'){k.vx=0;k.vy=Math.min(MAXFALL,k.vy+GRAV*dt);k.onGround=false;moveY(k,k.vy*dt);if(w.ct>1.3){w.mode='back';w.ct=0;if(w.cover){w.cover.on=null;w.cover.sheetX=k.x+k.w/2+20}}return}
  // caché sous un drap : le chat sait qu'on est dessous, il fonce dans le drap... et s'y emmêle
  const hid=w.mode==='chase'?coverHere():null;
  let target=w.mode==='chase'?(hid?hid.x+hid.w/2:pcx):w.x;
  const dist=target-(k.x+k.w/2),dir=Math.sign(dist)||1;
  if(hid&&Math.abs(dist)<18&&k.onGround){w.mode='tangle';w.ct=0;w.cover=hid;hid.gone=true;hid.on=w;unlock('a54');if(!G.sim){SFX.hiss();noise(.3,800,.2,'bandpass')}return}
  if(w.mode==='chase'&&!hid&&(w.ct>6.5||Math.abs(dist)>640||P.dead)){w.mode='back';w.ct=0}
  if(w.mode==='back'&&Math.abs(dist)<8&&k.onGround){w.mode='sit';w.k=null;w.t=0;w.state='closed';w.open=0;return}
  const sp=w.mode==='chase'?clamp(220+(Math.abs(dist)-150)*.25,220,300):170;
  k.leapT=(k.leapT||0)-dt;if(!(k.leapT>0&&!k.onGround))k.vx=lerp(k.vx,dir*Math.min(sp,Math.abs(dist)*6+20),Math.min(1,dt*6));k.f=dir;
  k.vy=Math.min(MAXFALL,k.vy+GRAV*dt);
  moveX(k,k.vx*dt);k.onGround=false;moveY(k,k.vy*dt);
  if(k.onGround){
    const fx=dir>0?k.x+k.w+6:k.x-6,cf=Math.floor(fx/T),rf=Math.floor((k.y+k.h-2)/T);
    const la=dir>0?k.x+k.w+34:k.x-34,cl=Math.floor(la/T);
    const blocked=isSolid(cf,rf)||isSolid(cf,rf-1),gap=!groundAt(cl,rf+1)&&!isSolid(cl,rf),pins=tile(cl,rf)==='^'||tile(cf,rf)==='^',above=w.mode==='chase'&&!hid&&P.y+P.h<k.y-20&&Math.abs(dist)<110;
    if(blocked||gap||pins||above)chaserLeap(k,dir,rf);
  }
  if(k.y>ROWS*T+60){k.x=w.x-22;k.y=w.y-26;k.vy=0;w.mode='sit';w.k=null}
}

/* ---------- le gardien au filet : il dort sur sa chaise ---------- */
function guardnetNear(K,pcx){return Math.abs(pcx-(K.home.x+K.w/2))<56}
/* saut d'un poursuivant au sol : s'il y a un trou devant, il vise l'autre bord */
function chaserLeap(K,dir,rf,vy){
  K.vy=-(vy||820);
  const c0=Math.floor((dir>0?K.x+K.w:K.x)/T);let pitEnd=null;
  for(let k=1;k<=7;k++){const c=c0+dir*k;if(!groundAt(c,rf+1)&&!isSolid(c,rf)){let e=c;while(Math.abs(e-c)<8&&!groundAt(e+dir,rf+1)&&!isSolid(e+dir,rf))e+=dir;pitEnd=e+dir;break}if(isSolid(c,rf))break}
  if(pitEnd!=null){const tx=(dir>0?pitEnd*T+T*.6:(pitEnd+1)*T-T*.6)-(K.x+K.w/2);K.vx=clamp(tx/0.72,-340,340);if(Math.abs(K.vx)<180)K.vx=dir*180;K.leapT=.8}

/* un poursuivant tombé dans un trou revient par derrière, au sol, hors champ */
function chaserReenter(K){
  const fromLeft=P.vx>=0;let x=fromLeft?cam.x-K.w-30:cam.x+W+30;x=clamp(x,T,L.wpx-T-K.w);
  const c=Math.floor((x+K.w/2)/T);let r=Math.floor(P.y/T)-2;r=clamp(r,0,ROWS-1);

}

function elevated(){if(!P.onGround)return false;if(P.onMover)return true;const r=Math.floor((P.y+P.h+2)/T),c0=Math.floor((P.x+4)/T),c1=Math.floor((P.x+P.w-4)/T);for(let c=c0;c<=c1;c++){const ch=tile(c,r);if(ch&&ch!=='.'&&ch!=='#'&&ch!=='~')return true}return false}

function marbleStep(dt){

/* les bêtes entendent la bille : elles se tournent vers le bruit, et les chats qui somnolent bondissent */
function marbleHeard(m){

}

/* même plateforme : sol continu (ou boue) entre deux abscisses, sur la rangée r */
function samePlatform(x1,x2,r){let a=Math.floor(Math.min(x1,x2)/T),b=Math.floor(Math.max(x1,x2)/T);for(let c=a;c<=b;c++){if(!groundAt(c,r+1)||isSolid(c,r))return false}return true}

/* ---------- le drone du 2-3 : projecteur, rafale, grenades, toit qu'il ne traverse pas, sprint final ---------- */
function roofAbove(c,yTop){for(let r=Math.floor(yTop/T)-1;r>=0;r--)if(isSolid(c,r))return r;return null}
function droneLOS(x1,y1,x2,y2){for(let k=1;k<12;k++){const x=x1+(x2-x1)*k/12,y=y1+(y2-y1)*k/12;if(isSolid(Math.floor(x/T),Math.floor(y/T)))return false}return true}
function droneStep(K,dt,pcx,pcy){
  if(K.state==='dead')return;
  if(K.state==='lure'){zrDroneLure(K,dt);return}
  K.gt=(K.gt||0)+dt;
  const fin=L.exit&&pcx>L.exit.x-640&&!P.dead;
  // cible : au-dessus de Raymond, mais jamais à travers un toit
  let tx=pcx-K.w/2+P.facing*(fin?0:30),ty=P.y-(fin?14:110);
  const roof=roofAbove(Math.floor(pcx/T),P.y);if(roof!=null&&!fin)ty=Math.min(ty,roof*T-70);
  const dx=tx-K.x,dy=ty-K.y,d=Math.hypot(dx,dy)||1,sp=fin?345:clamp(210+(d-150)*.5,210,320);
  const ox=K.x,oy=K.y;K.x+=dx/d*Math.min(sp*dt,d);K.y+=dy/d*Math.min(sp*dt,d)+Math.sin(K.t*6)*.4;K.f=dx>=0?1:-1;
  if(isSolid(Math.floor((K.x+K.w/2)/T),Math.floor((K.y+K.h)/T))){K.x=ox;K.y=Math.min(oy,K.y)-60*dt}
  if(fin&&!K.finSaid&&!G.sim){K.finSaid=true;say("Il accélère ! L'abri. Vite, l'abri !",2.6);tone(900,.3,'sawtooth',.05,1500)}
  // projecteur : balaie le sol ; si Raymond reste dans le faisceau, le drone vise puis tire une rafale
  const ex=K.x+K.w/2,ey=K.y+K.h;
  K.sp=K.sp||'scan';K.st=(K.st||0)+dt;
  if(K.sp==='aim')K.sa=Math.atan2(pcy-ey,pcx-ex);else K.sa=Math.PI/2+Math.sin(K.t*1.4)*.55;
  let a=Math.atan2(pcy-ey,pcx-ex)-K.sa;a=Math.atan2(Math.sin(a),Math.cos(a));
  const inCone=!P.dead&&!fin&&Math.abs(a)<.3&&Math.hypot(pcx-ex,pcy-ey)<340&&!hiddenNow()&&droneLOS(ex,ey,pcx,pcy);
  if(K.sp==='scan'){K.lock=inCone?(K.lock||0)+dt:Math.max(0,(K.lock||0)-dt*2);if(K.lock>.45){K.sp='aim';K.st=0;K.lock=0;if(!G.sim){tone(1500,.08,'square',.06);setTimeout(()=>tone(1500,.08,'square',.06),140)}}}
  else if(K.sp==='aim'){if(K.st>.75){K.sp='cool';K.st=0;K.fire=.25;if(!G.sim){for(let k=0;k<6;k++)setTimeout(()=>noise(.05,2400,.3,'highpass'),k*45)}if(inCone)K.hitP=true}}
  else if(K.sp==='cool'&&K.st>1.4){K.sp='scan';K.st=0}
  if(K.fire>0)K.fire-=dt;
  // grenades
  if(!fin&&K.sp!=='aim'&&K.gt>3.3&&!P.dead&&Math.abs(pcx-ex)<260&&!hiddenNow()){K.gt=0;(L.grenades=L.grenades||[]).push({x:ex-4,y:ey,w:8,h:8,vx:(pcx-ex)*.6,vy:-60,t:0,b:0});if(!G.sim)tone(600,.15,'sine',.04,300)}
}
function grenadeStep(dt){
  if(!L.grenades)return;
  for(let i=L.grenades.length-1;i>=0;i--){const n=L.grenades[i];n.t+=dt;n.vy=Math.min(MAXFALL,n.vy+GRAV*dt);const vy0=n.vy;n.onGround=false;moveX(n,n.vx*dt);moveY(n,n.vy*dt);
    if(n.onGround&&vy0>150){n.vy=-vy0*.45;n.vx*=.7;if(!G.sim)tone(500,.04,'square',.04)}else if(n.onGround){n.vx*=Math.pow(.02,dt)}
    if(n.t>1.5){L.grenades.splice(i,1);const gx=n.x+4,gy=n.y+4;if(Math.hypot(P.x+P.w/2-gx,P.y+P.h/2-gy)<72)G.grenadeHit=true;
      if(!G.sim){G.shake=10;noise(.6,300,.7,'lowpass');for(let k=0;k<18;k++){const a=rnd()*Math.PI*2,s2=100+rnd()*260;parts.push({type:'dust',x:gx,y:gy,vx:Math.cos(a)*s2,vy:Math.sin(a)*s2-60,life:0,max:.7+rnd()*.5})}parts.push({type:'ring',x:gx,y:gy,life:0,max:.35})}}
    else if(n.y>ROWS*T+40)L.grenades.splice(i,1)}
}
function drawDroneExtras(t){
  const K=L.chaser;
  if(L.grenades)for(const n of L.grenades){const x=n.x+4,y=n.y+4;ctx.save();ctx.fillStyle='#3a4a2a';ctx.beginPath();ctx.ellipse(x,y,5,6,0,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=.8;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(x-5,y+k*2.5);ctx.lineTo(x+5,y+k*2.5);ctx.stroke()}
    ctx.fillStyle='#8a8a7a';ctx.fillRect(x-2,y-9,4,3);if(Math.sin(t*(10+n.t*20))>0){ctx.fillStyle='#ff5030';ctx.beginPath();ctx.arc(x,y-10,1.8,0,7);ctx.fill()}ctx.restore()}
  if(!K||K.type!=='drone'||K.state==='sleep'||K.state==='dead'||K.state==='lure')return;
  if(!isFinite(K.sa)||!isFinite(K.x))return;
  const ex=K.x+K.w/2,ey=K.y+K.h,red=K.sp==='aim';let len=340;for(let q=12;q<340;q+=8){if(isSolid(Math.floor((ex+Math.cos(K.sa)*q)/T),Math.floor((ey+Math.sin(K.sa)*q)/T))){len=q+10;break}}
  ctx.save();const gr=ctx.createRadialGradient(ex,ey,4,ex,ey,len);gr.addColorStop(0,red?'rgba(255,90,70,.45)':'rgba(240,245,255,.32)');gr.addColorStop(1,'rgba(240,245,255,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(ex,ey);ctx.arc(ex,ey,len,K.sa-.3,K.sa+.3);ctx.closePath();ctx.fill();
  if(K.fire>0){ctx.strokeStyle='rgba(255,220,120,'+(K.fire*3)+')';ctx.lineWidth=2;for(let k=0;k<4;k++){const aa=K.sa+(rnd()-.5)*.2;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(aa)*len,ey+Math.sin(aa)*len);ctx.stroke()}}
  ctx.restore();
}

        g.fillStyle='#4a3622';g.fillRect(ex+(orr?0:10),y,4,T)}
      if(r>=G0+1&&Lv.g[r-1][c]==='.'&&Lv.g[r-1][c-1]!==undefined){const x=c*T,y=r*T;g.fillStyle='#7a6046';for(let k=0;k<5;k++)g.fillRect(x+k*8+1,y-3,6,5);g.fillStyle='#5a4430';g.fillRect(x,y+1,T,2)}
      if(r===G0&&(Lv.g[G0][c+1]==='.'||Lv.g[G0][c-1]==='.')&&Lv.g[G0-1][c]==='.'){if(lo==null)lo=c;hi=c}
    }
    // sacs de terre, en arrière-plan, le long des bords
    for(const c of [lo,hi]){if(c==null)continue;const x=c*T,y=G0*T;for(let k=0;k<3;k++){g.fillStyle=k%2?'#8a7a5a':'#9a8a66';rr(g,x+2+k*12+DX*.6,y-9+DY*.6,14,8,3);g.fill()}}
    // échelle contre la paroi de sortie
    if(hi!=null){const x=hi*T-16,y0=G0*T,y1=(G0+2)*T;g.fillStyle='#7a5a3a';g.fillRect(x,y0-10,3,y1-y0+10);g.fillRect(x+12,y0-10,3,y1-y0+10);for(let yy=y0;yy<y1;yy+=12)g.fillRect(x,yy,15,2.5)}
    // paroi du fond en planches : on ne voit pas derrière la tranchée
    for(let c=z.c0;c<=z.c1;c++)for(let r=G0;r<=G0+1;r++){if(Lv.g[r][c]!=='.')continue;let fr=r+1;while(fr<Lv.g.length&&Lv.g[fr][c]==='.')fr++;if(fr>=Lv.g.length)continue;
      const x=c*T,y=r*T;g.fillStyle='#4e3a26';g.fillRect(x,y,T,T);g.fillStyle='#5e4630';for(let k=0;k<4;k++)g.fillRect(x,y+k*10+1,T,8);
      g.fillStyle='rgba(0,0,0,.28)';for(let k=0;k<4;k++)g.fillRect(x,y+k*10+9,T,1.5);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x+((c*13)%28)+4,y+3,1.5,T-6);
      if(c%3===0){g.fillStyle='#3e2c1c';g.fillRect(x+16,y,8,T)}
      if(r===G0&&Lv.g[G0-1][c]==='.'){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x,y,T,4)}}
    // piquets « queue de cochon » et barbelé rouillé, plantés dans le sol derrière le parapet
    const surf=c=>{for(let r=G0-4;r<=G0;r++)if('#f'.includes(Lv.g[r][c]))return r;return null};
    const posts=[];for(let c=z.c0;c<=z.c1;c+=3){const r=surf(c);if(r!=null)posts.push([c,r])}
    g.strokeStyle='rgba(90,60,40,.75)';g.lineWidth=1;
    posts.forEach(([c,r],k)=>{const x=c*T+20+DX,y=r*T+DY;g.fillStyle='#5a4432';g.fillRect(x,y-30,3,30);
      const n=posts[k+1];if(n&&n[1]===r&&n[0]-c===3){let ok=true;for(let cc=c;cc<=n[0];cc++)if(surf(cc)!==r)ok=false;
        if(ok){const x2=n[0]*T+20+DX;g.beginPath();g.moveTo(x,y-24);g.quadraticCurveTo((x+x2)/2,y-16,x2,y-24);g.moveTo(x,y-12);g.quadraticCurveTo((x+x2)/2,y-5,x2,y-12);g.stroke()}}});
  }
}
/* ---------- plans de fond : champs de la Meuse en novembre ---------- */
function autumnTree(g,x,b,h,R,dim){
  const cols=['#4a7a2c','#5a8a34','#3f6a26','#6a9a3c','#557f30','#c9a83a','#d8a83a','#b8782a'];
  const tr=mix('#4a3828','#9ab8c4',dim);g.fillStyle=tr;g.fillRect(x-h*.035,b-h*.5,h*.07,h*.5);
  g.strokeStyle=tr;g.lineWidth=Math.max(1,h*.02);g.beginPath();g.moveTo(x,b-h*.4);g.lineTo(x-h*.14,b-h*.62);g.moveTo(x,b-h*.48);g.lineTo(x+h*.15,b-h*.66);g.stroke();
  const cy=b-h*.66,rw=h*.3,rh=h*.28,n=12+Math.floor(h/20),yellow=R()<.35?.35:.12;
  for(let k=0;k<n;k++){const a=R()*Math.PI*2,d=Math.sqrt(R());const px=x+Math.cos(a)*rw*d,py=cy+Math.sin(a)*rh*d;
    const c=R()<yellow?cols[5+Math.floor(R()*3)]:cols[Math.floor(R()*5)];g.fillStyle=mix(py>cy?mix(c,'#000000',.14):c,'#9ab8c4',dim);g.beginPath();g.arc(px,py,h*(.07+R()*.05),0,7);g.fill()}
  g.fillStyle=mix('#f4f0c8','#9ab8c4',dim);g.globalAlpha=.16;g.beginPath();g.arc(x-rw*.35,cy-rh*.4,rw*.35,0,7);g.fill();g.globalAlpha=1;
}
function fieldsFar(L,g,wpx,R){
  for(let k=0;k<wpx/320;k++){const x=R()*wpx,y=70+R()*120,s=.7+R()*.8;g.fillStyle='rgba(255,255,255,.7)';for(let j=0;j<6;j++){g.beginPath();g.arc(x+j*22*s,y-Math.sin(j/5*Math.PI)*18*s,(18+R()*14)*s,0,7);g.fill()}g.fillStyle='rgba(160,180,200,.25)';g.fillRect(x-14*s,y+6*s,130*s,8*s)}
  const ridge=(base,amp,f,ph)=>x=>base-Math.sin(x*f+ph)*amp-Math.sin(x*f*2.7+ph*1.3)*amp*.35;
  const band=(fn,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,600);for(let x=0;x<=wpx+20;x+=20)g.lineTo(x,fn(x));g.lineTo(wpx+20,600);g.closePath();g.fill()};
  const r1=ridge(392,24,.004,R()*9),r2=ridge(430,16,.006,R()*9),r3=ridge(468,10,.009,R()*9);
  band(r1,'#a3bcbc');
  for(let x=0;x<wpx;x+=14+R()*30)if(R()<.5)autumnTree(g,x,r1(x)+4,22+R()*16,R,.55);
  // éoliennes alignées sur la crête (2-2)
  if(L.def.farTurbines)for(let x=90;x<wpx;x+=150+R()*170){const h=70+R()*40,b0=r1(x)+6;g.fillStyle=mix('#f0f2f0','#a3bcbc',.35);poly(g,[x-2.5,b0,x-1,b0-h,x+1,b0-h,x+2.5,b0]);g.fill();g.beginPath();g.arc(x,b0-h,2.4,0,7);g.fill();L.turbines.push({x,y:b0-h,r:h*.42,sp:.6+R()*.5,ph:R()*6})}
  band(r2,'#a4b874');
  // parcelles : chaume, labour, blé d'hiver
  const pc=['#b9b46a','#8f7454','#93ad5e','#a9b870','#7f6a4c'];
  for(let x=0;x<wpx;){const w=120+R()*220,c=pc[Math.floor(R()*pc.length)];g.fillStyle=mix(c,'#a8c0c4',.32);g.beginPath();g.moveTo(x,r2(x)+3);for(let xx=x;xx<=x+w;xx+=20)g.lineTo(xx,r2(xx)+3);g.lineTo(x+w,600);g.lineTo(x,600);g.closePath();g.fill();
    g.strokeStyle='rgba(60,50,30,.12)';g.lineWidth=1;for(let yy=8;yy<60;yy+=7){g.beginPath();g.moveTo(x,r2(x)+yy);g.lineTo(x+w,r2(x+w)+yy+4);g.stroke()}
    g.fillStyle=mix('#4a7a2c','#a8c0c4',.35);for(let xx=x;xx<x+w;xx+=9)g.fillRect(xx,r2(xx)-4,7,6);x+=w}
  for(let x=0;x<wpx;x+=60+R()*140)autumnTree(g,x,r2(x)+2,34+R()*20,R,.35);
  // un clocher de village au loin
  {const cx=wpx*.7,cb=r2(wpx*.7)+4;g.fillStyle='#9aa8a8';g.fillRect(cx-6,cb-46,12,46);poly(g,[cx-8,cb-46,cx,cb-70,cx+8,cb-46]);g.fill();g.fillStyle='#b8b0a0';for(let k=-3;k<=3;k++)if(k)g.fillRect(cx+k*14-6,cb-14,12,14)}
  band(r3,'#8fa860');
}
function fieldsMid(L,g,wpx,R){
  const toWorld=mx=>(mx-W*.35)/PF_MID+W*.35;
  const zoneAtMid=mx=>zoneOfL(L,Math.floor(toWorld(mx)/T))||'field';
  let x=20;
  while(x<wpx){const z=zoneAtMid(x);
    if(z==='wood'){autumnTree(g,x,526,200+R()*110,R,.12);x+=34+R()*40;continue}
    if(z==='river'){x+=50;continue}
    if(z==='bank'||z==='bank2'){if(R()<.6)autumnTree(g,x,526,190+R()*110,R,.16);else{g.fillStyle=mix('#3f6a26','#a8c0c4',.2);g.beginPath();g.ellipse(x,526-170,22,150,0,0,7);g.fill()}x+=60+R()*60;continue}
    if(z==='mines'){if(R()<.5){g.fillStyle='#e8e4dc';g.fillRect(x,380,4,146);for(let k=0;k<5;k++){g.fillStyle=R()<.6?'#c9a83a':'#8aa04a';g.beginPath();g.arc(x+(R()-.5)*30,380+R()*50,12,0,7);g.fill()}x+=90+R()*80}
      else{g.fillStyle='#6a5442';g.fillRect(x,486,3,40);g.strokeStyle='rgba(90,70,50,.6)';g.lineWidth=1;g.beginPath();g.moveTo(x,494);g.quadraticCurveTo(x+40,502,x+80,494);g.stroke();x+=60+R()*60}continue}
    if(z==='trench'){autumnTree(g,x,526,230+R()*110,R,.18);x+=30+R()*34;continue}
    if(z==='monument'){if(z==='monument'&&R()<.45){const w=70+R()*60,h=70+R()*40;g.fillStyle=mix('#d8cfbc','#a8c0c4',.2);g.fillRect(x,526-h,w,h);g.fillStyle=mix('#5a6470','#a8c0c4',.2);poly(g,[x-6,526-h,x+w/2,526-h-34,x+w+6,526-h]);g.fill();
        g.fillStyle='rgba(60,70,80,.45)';for(let i=0;i<Math.floor(w/22);i++)for(let j=0;j<2;j++)g.fillRect(x+8+i*22,526-h+12+j*30,10,16);x+=w+10}
      else{autumnTree(g,x,526,150+R()*90,R,.15);x+=70+R()*70}continue}
    // champ : haies, grands arbres isolés, piquets de clôture
    const k=R();
    if(k<.45){const w=120+R()*200;for(let xx=x;xx<x+w;xx+=16){g.fillStyle=R()<.85?['#4a7a2c','#5a8a34','#3f6a26'][Math.floor(R()*3)]:'#c9a83a';g.beginPath();g.arc(xx,512-R()*8,16+R()*8,0,7);g.fill()}x+=w+40+R()*80}
    else if(k<.75){autumnTree(g,x,526,170+R()*80,R,.15);x+=120+R()*120}
    else{g.fillStyle='#6a5440';for(let i=0;i<5;i++)g.fillRect(x+i*30,494,4,32);g.strokeStyle='rgba(80,70,60,.5)';g.lineWidth=1;g.beginPath();g.moveTo(x,500);g.lineTo(x+124,500);g.moveTo(x,510);g.lineTo(x+124,510);g.stroke();x+=180+R()*120}
  }
}

/* =========================================================
   2-2 · LES ÉOLIENNES — la Meuse et ses péniches, meules à rats,
   tourbillon de foin entre les pales, tracteur
   ---------------------------------------------------------
   Option de niveau : meuse {river:[c0,c1], lanes:[{c,name,port,cargo,secret}], bales:[col…],
     vortex:col, tractor:col, bgTurbines:[{x,z}]}
   Perspective : ce qui est derrière le plan de jeu (profondeur z > 0, en cases) est projeté
   vers un point de fuite fixe à l'écran, en haut un peu à droite (comme l'extrusion des tuiles) :
   la Meuse, les péniches et les éoliennes du fond suivent donc la caméra en vrai relief.
   Les péniches descendent la Meuse vers nous : seule la tranche qui traverse le plan de jeu
   porte Raymond (pont, cargaison, timonerie : planches invisibles « t » posées à chaque image).
   ========================================================= */
const MZ_D=16,MZ_HZ=300,MZ_VX=.6,MZ_ZF=36;
const MV={x:0,y:0};
function mzSet(){MV.x=cam.x+W*MZ_VX;MV.y=cam.y+MZ_HZ}
function ms(z){return MZ_D/(MZ_D+z)}
function mp(x,y,z){const s=MZ_D/(MZ_D+z);return[MV.x+(x-MV.x)*s,MV.y+(y-MV.y)*s]}
function mq(g,a,b,c,d){g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.closePath()}
function mFog(z){return clamp((z-5)/(MZ_ZF-3),0,.92)}
function mCol(c,z){return mix(c,L.th.fog,mFog(z))}

/* une péniche Freycinet (stylisée) : 30 cases de long, 5 de large ; cargaison à tribord, timonerie à l'arrière */
const BARGE={v:1.8,len:30,C:38,beam:5,cab:{z0:23.5,z1:28.5,c0:2,c1:5,h:2}};
const CARGO={hay:[{z0:3,z1:9,h:2},{z0:9,z1:16,h:1},{z0:16,z1:23,h:2}],
  logs:[{z0:3,z1:13,h:1},{z0:13,z1:23,h:2}],
  beets:[{z0:3,z1:10,h:1},{z0:10,z1:17,h:2},{z0:17,z1:23,h:1}]};

function meusePost(Lv){
  const D=Lv.def.meuse;if(!D)return;
  const gTop=c=>{for(let r=0;r<Lv.g.length;r++)if(Lv.g[r][c]==='#')return r;return Lv.g.length};
  const rG=gTop(D.river[0]-1),yG=rG*T,rD=rG+1,yD=rD*T,yW=yD+24,rP=gTop(D.vortex+3),yP=rP*T;
  const M={sheaves:D.sheaves||[],xL:D.river[0]*T,xR:(D.river[1]+1)*T,yG,yD,yW,rD,yP,lanes:[],bales:[],shelters:[],stat:[],turbines:[],hay:[],trees:[],ducks:[],said:{}};
  Lv.meuse=M;
  /* les péniches : chaque couloir suit le précédent de 7 secondes (on passe de l'une à l'autre à mesure qu'elles arrivent) */
  D.lanes.forEach((d,i)=>{
    const ln=Object.assign({i,x0:d.c*T,x1:(d.c+BARGE.beam)*T,cx:(d.c+BARGE.beam/2)*T,v:BARGE.v,len:BARGE.len,C:BARGE.C,ph:11-i*BARGE.C/3,U:0,n:0,zl:0,in:false,ev:{n:-99,t:0}},d);
    ln.parts=CARGO[d.cargo].map(s=>Object.assign({c0:3,c1:5,kind:d.cargo},s)).concat([Object.assign({kind:'cab'},BARGE.cab)]);
    ln.partsDesc=ln.parts.slice().sort((a,b)=>b.z0-a.z0);
    M.lanes.push(ln);
    if(d.secret){
      const a={kind:'secret',style:'barge',x:(d.c+BARGE.cab.c0)*T+23,y:yD,open:0,t:0,used:false,lane:ln,
        lockQ:"Fermé. Un marinier ne laisse jamais sa porte ouverte aux pigeons. Sauf s'il a une bonne raison de sortir.",
        q:["Une cabine de marinier : un poêle, une couchette… et de la paille sur l'oreiller. Merci, camarade."]};
      a.when=()=>ln.in&&ln.zl>=BARGE.cab.z0&&ln.zl<BARGE.cab.z1;M.door=a;Lv.acts.push(a);
    }
  });
  /* meules rondes (des rats en sortent) : leur dessus porte Raymond, et elles coupent le vent */
  for(const bd of D.bales||[]){const c=bd.c,x=c*T;M.bales.push({x,armed:!!bd.rats,rats:!!bd.rats,shake:0});M.stat.push({x0:x-40,x1:x+40,y:yG-80});Lv.g[rG-2][c-1]='t';Lv.g[rG-2][c]='t';Lv.avoid.push(x-60,x,x+60)}
  /* le tourbillon : une demi-ellipse aplatie, de la meule au pied de la côte jusqu'au plateau */
  const vx0=D.vortex*T+T/2,a=900,b=600;
  M.vt={x0:vx0,y0:yG-40,y1:yP-40,a,b,p:.7,base:yG};
  Lv.avoid.push(vx0-60,vx0,vx0+60);
  [vx0+a-330,vx0+a+30,vx0+a+390].forEach((x,k)=>{const p=vPathOf(M.vt,vThOf(M.vt,x));M.turbines.push({x,hy:p.y+118,R:150,w:.75,ph:[0,1.15,2.3][k]})});
  M.fl0=M.turbines[0].x-250;M.fl1=M.turbines[2].x+240;M.thF0=vThOf(M.vt,M.fl0);M.thF1=vThOf(M.vt,M.fl1);
  for(const x of[M.turbines[0].x-205,M.turbines[0].x+180,M.turbines[1].x+180,M.turbines[2].x+205]){const p=vPathOf(M.vt,vThOf(M.vt,x));Lv.corn.push({x:p.x,y:p.y,taken:false,ph:x*.01})}
  {const R=mulberry(77);for(let k=0;k<120;k++)M.hay.push({th:R()*Math.PI,sp:.16+R()*.2,off:6+R()*36,ph:R()*6.28,len:4+R()*6,rot:R()*6,vr:(R()-.5)*8,c:['#e0b04e','#c9962e','#f0d27a'][k%3]})}
  /* le tracteur, garé au bord de la côte, et sa botte */
  if(D.tractor!=null){const tx=D.tractor*T;
    M.tractor={x:tx,y:yP,bx:tx-80};
    const ad={kind:'secret',style:'tractor',x:tx+46,y:yP,open:0,t:0,used:false,q:["Sur le siège du tracteur, une botte entamée. Le conducteur fait la sieste dans le foin, je parie. Je me sers."]};
    M.tdoor=ad;Lv.acts.push(ad);
    Lv.g[rP-3][D.tractor]='t';Lv.g[rP-3][D.tractor+1]='t';Lv.g[rP-2][D.tractor-3]='t';Lv.g[rP-2][D.tractor-2]='t';
    M.stat.push({x0:tx,x1:tx+156,y:yP-120},{x0:tx-120,x1:tx-40,y:yP-80});Lv.avoid.push(tx-80,tx,tx+80,tx+160)}
  /* les troncs des arbres coupent le vent : on s'abrite juste à leur gauche */
  for(const d of Lv.decor)if(d.t==='tree')M.stat.push({x0:d.x-20,x1:d.x+20,y:-9999});
  /* éoliennes au loin, saules des berges, canards */
  M.bg=(D.bgTurbines||[]).map((o,k)=>({x:o.x,z:o.z,y:o.x>vx0?yP:yG,h:380,R:150,w:.5+(k%3)*.09,ph:k*1.7})).sort((p,q)=>q.z-p.z);
  {const R=mulberry(91);
    for(const z of[3.5,10,17,26])M.trees.push({x:M.xL-60-R()*150,z,h:170+R()*90,seed:Math.floor(R()*999)});
    for(const z of[5,12.5,21,30])M.trees.push({x:M.xR+50+R()*170,z,h:170+R()*90,seed:Math.floor(R()*999)});
    M.trees.sort((p,q)=>q.z-p.z);
    for(const x of[M.xL+150,M.xL+620,M.xL+1100,M.xL+1580])M.ducks.push({x,z0:R()*28,ph:R()*6})}
}
function vPathOf(V,th){const s=Math.max(0,Math.sin(th));return{x:V.x0+V.a*(1-Math.cos(th)),y:V.y0+(V.y1-V.y0)*th/Math.PI-V.b*Math.pow(s,V.p)}}
function vThOf(V,x){return Math.acos(clamp((V.x0+V.a-x)/V.a,-1,1))}
function bladeAng(tb){return tb.ph+G.lt*tb.w}
function bladeHit(tb,cx,cy){
  const dx=cx-tb.x,dy=cy-tb.hy;if(dx*dx+dy*dy>(tb.R+24)*(tb.R+24))return false;if(dx*dx+dy*dy<22*22)return true;
  const a0=bladeAng(tb);
  for(let k=0;k<3;k++){const a=a0+k*2.0944,ux=Math.sin(a),uy=-Math.cos(a),pr=dx*ux+dy*uy;if(pr<tb.R*.08||pr>tb.R+6)continue;
    const pe=Math.abs(dx*uy-dy*ux),hw=pr<tb.R*.3?11:11-6*(pr-tb.R*.3)/(tb.R*.7);if(pe<hw+8)return true}
  return false;
}
function laneDoorOpen(ln){return ln.ev.n===ln.n&&ln.ev.t>.35}

/* ---------- à chaque image, avant la physique ---------- */
function meuseStep(dt){
  const M=L.meuse;if(!M)return;
  const t=G.lt,pcx=P.x+P.w/2,pfy=P.y+P.h;
  M.shelters.length=0;for(const s of M.stat)M.shelters.push(s);
  for(const ln of M.lanes){
    for(let c=ln.c;c<ln.c+BARGE.beam;c++)for(let r=M.rD-2;r<=M.rD;r++)L.g[r][c]='.';
    ln.U=t*ln.v+ln.ph;ln.n=Math.floor(ln.U/ln.C);ln.zl=ln.U-ln.n*ln.C;ln.in=ln.zl<ln.len;
    if(ln.ev.n===ln.n){ln.ev.t+=dt;marinierStep(ln)}
    if(!ln.in)continue;
    for(let c=ln.c;c<ln.c+BARGE.beam;c++)L.g[M.rD][c]='t';
    for(const s of ln.parts)if(ln.zl>=s.z0&&ln.zl<s.z1){for(let c=ln.c+s.c0;c<ln.c+s.c1;c++)L.g[M.rD-s.h][c]='t';M.shelters.push({x0:(ln.c+s.c0)*T,x1:(ln.c+s.c1)*T,y:(M.rD-s.h)*T})}
    if(!M.said.barge&&!P.dead&&P.onGround&&pcx>ln.x0&&pcx<ln.x1&&!G.sim){M.said.barge=1;say("Passager clandestin d'une péniche qui descend la Meuse… vers nous. Le règlement ne prévoit pas ce cas.",3.6)}
  }
  if(M.door)M.door.locked=!laneDoorOpen(M.door.lane);
  // meules à rats : on s'approche trop, ils sortent
  for(const b of M.bales){b.shake=Math.max(0,b.shake-dt*2.5);
    if(b.armed&&!P.dead&&!G.cut&&Math.abs(pcx-b.x)<150&&Math.abs(pfy-M.yG)<100){b.armed=false;b.shake=1;const d=Math.sign(pcx-b.x)||1;
      // deux rats qui foncent tout droit vers Raymond, l'un derrière l'autre, et ne reviennent pas
      for(let k=0;k<2;k++)L.rats.push({kind:'rat',fromBale:true,runner:true,dir:d,x:b.x-15+d*(20-k*34),y:M.yG-18,w:30,h:16,vx:d*230,vy:-260-k*140,onGround:false,t:k*.4,sq:.2,base:230});
      if(!G.sim){SFX.squeak();setTimeout(()=>SFX.squeak(),160);puff(b.x,M.yG-50,12,true);if(!M.said.bale){M.said.bale=1;say("Des rats dans la meule ! Même à l'arrière, ils réquisitionnent le foin.",3.4)}}}}
  // une bille qui tombe dans la Meuse
  if(L.marbles)for(let i=L.marbles.length-1;i>=0;i--){const m=L.marbles[i],mx=m.x+m.w/2;if(mx>M.xL&&mx<M.xR&&m.y>M.yW){if(!G.sim){for(let k=0;k<6;k++)parts.push({type:'drop',x:mx,y:M.yW,vx:(rnd()-.5)*80,vy:-80-rnd()*120,life:0,max:.5,sz:0});tone(900,.06,'sine',.05,500)}L.marbles.splice(i,1)}else if(m.onGround&&!m.mz&&mx>M.xL&&mx<M.xR&&Math.abs(m.y+m.h-M.yD)<4)meuseMarble(m)}
  // le foin emporté par le tourbillon
  for(const h of M.hay){h.th+=h.sp*dt*(h.th<1.2?1.7:1);h.rot+=h.vr*dt;if(h.th>Math.PI)h.th-=Math.PI}
  // le tracteur
  if(M.tractor&&!M.said.tractor&&!P.dead&&P.onGround&&Math.abs(pcx-(M.tractor.x+70))<230&&Math.abs(pfy-M.tractor.y)<30&&!G.sim){M.said.tractor=1;say("Un tracteur. Une charrette sans cheval, qui sent le pétrole. Le génie agricole ne recule devant rien.",3.8)}
}
/* moyettes de blé fauché : des gerbes dressées les unes contre les autres */
function drawSheaf(g,x,b,seed){
  const R=mulberry(seed*31),n=4+Math.floor(R()*3);g.save();g.translate(x,b-1);
  g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(6,0,30,5,0,0,7);g.fill();
  for(let k=0;k<n;k++){const a=(k-(n-1)/2)*.2+(R()-.5)*.06,h=54+R()*10;g.save();g.rotate(a);
    g.strokeStyle=k%2?'#b8913a':'#caa24a';g.lineWidth=2;for(let j=-4;j<=4;j++){g.beginPath();g.moveTo(j*1.6,0);g.quadraticCurveTo(j*1.2,-h*.5,j*2.4,-h);g.stroke()}
    g.fillStyle='#8a5a2a';g.fillRect(-6,-h*.55,12,3);
    g.fillStyle=k%2?'#d8b456':'#e6c46a';for(let j=-3;j<=3;j++){g.save();g.translate(j*3,-h-4);g.rotate(j*.18);g.beginPath();g.ellipse(0,0,2.2,6,0,0,7);g.fill();g.restore()}
    g.restore()}

}
/* le marinier sort, râle, regarde le ciel… et rentre sans fermer la porte */
function marinierZ(ln,bow){const cz=bow+BARGE.cab.z0;return{cz,z:Math.max(0,cz-1.4),xd:(ln.c+BARGE.cab.c0)*T+23,xo:ln.x0+30}}
function marinierStep(ln){
  const ev=ln.ev;if(G.sim)return;
  const once=(k,c,f)=>{if(!ev[k]&&c){ev[k]=1;f()}};
  mzSet();const bow=ln.n*ln.C-ln.U,m=marinierZ(ln,bow),hd=mp(m.xo,L.meuse.yD-96,m.z);
  once('b1',ev.t>.95,()=>{bubble(hd[0],hd[1],"Qui c'est qui me bombarde ?!",'#2a3a5a');tone(220,.18,'sawtooth',.04,160)});
  once('b2',ev.t>2.3,()=>bubble(hd[0],hd[1],'Un pigeon ! En novembre !','#2a3a5a'));
  once('b3',ev.t>3.5,()=>noise(.15,900,.12,'bandpass'));
  once('q',ev.t>4.6&&!L.meuse.door.used,()=>say("Il a laissé la porte ouverte. Un marinier, ça ne ferme jamais rien : ça vit dehors.",3.6));
}
/* une bille tombe sur le pont d'une péniche */
function meuseMarble(m){
  const M=L.meuse;if(!M||m.mz)return;m.mz=true;const mx=m.x+m.w/2;
  for(const ln of M.lanes){if(!ln.in||mx<ln.x0||mx>ln.x1)continue;
    if(ln.secret){if(ln.zl<BARGE.cab.z1-.8&&ln.ev.n!==ln.n)ln.ev={n:ln.n,t:0}}
    else if(!G.sim){mzSet();const cz=Math.max(0,BARGE.cab.z0-ln.zl),s=mp((ln.c+3.5)*T,M.yD-96,cz);bubble(s[0],s[1],ln.i===0?'Ouaf ! Ouaf !':'Hé ! Ho !','#6a5a48')}
    break}
}
/* abri contre la rafale : se tenir devant ou juste à gauche d'une meule, d'une cargaison, d'une timonerie */
function meuseShelter(dir){
  const M=L.meuse,cx=P.x+P.w/2,fy=P.y+P.h;
  for(const s of M.shelters){if(fy<=s.y+3)continue;if(dir<0?(cx<s.x1&&cx>s.x0-3*T):(cx>s.x0&&cx<s.x1+3*T))return true}
  return false;
}
function splash(x,y){if(G.sim)return;for(let k=0;k<26;k++)parts.push({type:'drop',x:x+(rnd()-.5)*24,y:y-2,vx:(rnd()-.5)*260,vy:-180-rnd()*380,life:0,max:.7+rnd()*.5,sz:rnd()*2});parts.push({type:'ring',x,y,life:0,max:.45});noise(.5,700,.4,'lowpass');noise(.25,2600,.2,'bandpass',.05)}

/* ---------- après la physique : tourbillon, pales, noyade ---------- */
function meuseAfterMove(dt){
  const M=L.meuse,V=M.vt;
  if(P.ride){
    const R=P.ride;R.t+=dt;
    for(const c of L.rats)if(c.chase){c.chase=false;c.runner=true;c.dir=Math.sign(c.vx)||1;c.base=200}
    for(const c of L.rats)c.charge=0;
    const fl=R.th>=M.thF0&&R.th<=M.thF1;let v;
    if(fl){const d=(keys.has('right')?1:0)-(keys.has('left')?1:0);v=d>0?235:d<0?-95:80;if(d)P.facing=d;
      if(!M.said.float&&!G.sim){M.said.float=1;say("Je vole sans battre des ailes ! Entre des moulins qui coupent tout. ← → pour choisir le moment.",3.6)}}
    else v=R.th<M.thF0?360:300;
    const a=vPathOf(V,R.th),b=vPathOf(V,R.th+.001),dl=Math.hypot(b.x-a.x,b.y-a.y)/.001||1;
    R.th+=v*dt/dl;if(fl&&R.th<M.thF0)R.th=M.thF0;
    if(R.th>=Math.PI){P.ride=null;P.vx=150;P.vy=-60;P.spin=0;P.facing=1;P.lift=0;return null}
    const q=vPathOf(V,R.th);let x=q.x-P.w/2,y=q.y-P.h/2+Math.sin(R.t*5)*(fl?3.5:1);
    if(R.k<1){R.k=Math.min(1,R.k+dt*3);const e=R.k*R.k*(3-2*R.k);x=lerp(R.sx,x,e);y=lerp(R.sy,y,e)}
    P.x=x;P.y=y;P.vx=P.vy=0;P.onGround=false;P.onMover=null;P.flaps=0;P.gliding=false;P.jumping=false;P.lift=1;P.stam=STAM_MAX;P.torn=false;
    // monté de force : il tourne sur lui-même pendant l'ascension, se stabilise là-haut
    P.spin=R.th<M.thF0?Math.min(1,R.th/M.thF0)*Math.PI*4:0;
    if(!G.sim&&rnd()<dt*14)parts.push({type:'straw',x:P.x+P.w/2+(rnd()-.5)*40,y:P.y+P.h/2+(rnd()-.5)*30,vx:-60-rnd()*80,vy:-40+rnd()*60,life:0,max:.6,rot:rnd()*6,vr:8,len:5});
    const cx=P.x+P.w/2,cy=P.y+P.h/2;
    for(const tb of M.turbines)if(bladeHit(tb,cx,cy))return'blade';
    return null;
  }
  if(P.dead)return null;
  const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
  // les pales tournent aussi pour ceux qui sautent trop haut sur le plateau
  for(const tb of M.turbines)if(bladeHit(tb,pcx,pcy))return'blade';
  // la meule qui se délite : le tourbillon emporte Raymond
  if(Math.abs(pcx-V.x0)<44&&P.y+P.h>V.base-440&&P.y+P.h<=V.base+2){
    P.ride={th:0,t:0,k:0,sx:P.x,sy:P.y};
    if(!G.sim){SFX.flap();noise(1.2,500,.3,'bandpass');puff(pcx,P.y+P.h,12,true);if(!M.said.ride){M.said.ride=1;say("Le vent m'arrache ! Je n'ai rien demandé !",2.6)}}
    return null}
  // la Meuse
  if(pcx>M.xL&&pcx<M.xR&&P.y+P.h>M.yW+8){splash(pcx,M.yW);if(S.infinite){resetPlayer();return null}return'drown'}
  return null;
}

function drawRotor(g,hx,hy,R,ang,s,col,hi){

  if(hi){g.globalAlpha=.13;g.fillStyle=col;for(const d of[-.07,-.14])for(let k=0;k<3;k++){g.save();g.rotate(ang+d+k*2.0944);blade();g.fill();g.restore()}g.globalAlpha=1}
  for(let k=0;k<3;k++){g.save();g.rotate(ang+k*2.0944);g.fillStyle=col;blade();g.fill();
    if(hi){g.save();blade();g.clip();g.fillStyle='rgba(60,70,80,.16)';g.fillRect(0,-R,10*s,R);g.fillStyle='#c8302a';g.fillRect(-15*s,-R*.97,30*s,R*.05);g.fillRect(-15*s,-R*.87,30*s,R*.05);g.restore();
      g.strokeStyle='rgba(40,40,50,.25)';g.lineWidth=1;blade();g.stroke()}
    g.restore()}
  g.fillStyle=col;g.beginPath();g.arc(0,0,9*s,0,7);g.fill();g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.arc(2*s,2*s,6*s,0,7);g.fill();
  g.restore();
}
