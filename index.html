.tc{position:fixed;display:none;align-items:center;justify-content:center;

#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;

function parseLevel(i){
  const def=LEVELS[i],th=THEMES[def.theme];
  const rows=Array.from({length:ROWS},()=>'');
  for(const seg of def.segs){
    const lines=seg.split('\n').map(s=>s.trim()).filter(s=>s.length);
    const w=Math.max(...lines.map(l=>l.length));
    const pad=ROWS-lines.length;
    for(let r=0;r<ROWS;r++){const l=r<pad?'':lines[r-pad];rows[r]+=l.padEnd(w,'.')}
  }
  const wT=rows[0].length;
  const g=rows.map(r=>r.split(''));
  for(let r=0;r<ROWS;r++){g[r][0]='W';g[r][wT-1]='W'}
  const L={def,i,w:wT,wpx:wT*T,g,th,corn:[],medal:null,cps:[],exit:null,rats:[],moths:[],movers:[],hints:[],quips:[],decor:[],lights:[],mark:new Set(),
    chaser:null,triggerX:Infinity,spawn:null,dome:null,avoid:[],updrafts:[],bolts:[],bells:[]};
  let hi=0,qi=0,si=0,mi=0;
  const movers=[];
  for(let c=0;c<wT;c++)for(let r=0;r<ROWS;r++){
    const ch=g[r][c],x=c*T,y=r*T,cx=x+T/2,cy=y+T/2;
    let clear=true;
    switch(ch){
      case'S':L.spawn={x:cx,y:y+T};L.avoid.push(cx);break;
      case'o':L.corn.push({x:cx,y:cy,taken:false,ph:c*.7+r});break;
      case'*':L.medal={x:cx,y:cy,taken:false};break;
      case'C':L.cps.push({x:cx,y:y+T,on:false});L.avoid.push(cx);break;
      case'E':L.exit={x:x-6,y:y-T,w:T+12,h:2*T};L.avoid.push(cx,cx+60,cx-60);break;
      case'k':if(th.walker!=='none')L.rats.push({kind:th.walker,x:cx-15,y:y+T-16,w:30,h:16,vx:th.walker==='goose'?110:th.walker==='hedgehog'?60:95,vy:0,onGround:false,t:(c*.37)%9,sq:1+(c%3)});break;
      case'r':if(th.walker!=='none'){const pk=th.walker==='boar'?'piglet':th.walker;L.rats.push({kind:pk,x:cx-11,y:y+T-12,w:22,h:12,vx:th.walker==='boar'?95:th.walker==='goose'?110:95,vy:0,onGround:false,t:(c*.53)%9,sq:2.5})}break;
      case'm':L.moths.push({kind:th.flyer,cx,cy,axis:'h',amp:95,sp:2.3+(mi%3)*.25,t:mi*1.3,x:cx,y:cy,fl:0});mi++;break;
      case'n':L.moths.push({kind:th.flyer,cx,cy,axis:'v',amp:72,sp:2.1+(mi%3)*.25,t:mi*1.3,x:cx,y:cy,fl:0});mi++;break;
      case'M':movers.push({c,r,axis:'h',w:2,kind:'dolly'});break;
      case'N':movers.push({c,r,axis:'h',w:5,kind:'truck'});break;
      case'V':movers.push({c,r,axis:'v',w:2,kind:'lift'});break;
      case'U':L.updrafts.push({x:x,w:2*T,top:0,bottom:y+T});break;
      case'!':L.bolts.push({x:cx,ph:L.bolts.length*.95,flash:0});break;
      case'T':L.triggerX=x;break;
      case'K':L.chaser={type:'cat',home:{x:cx-22,y:y+T-26},x:cx-22,y:y+T-26,w:44,h:26,vx:0,vy:0,state:'sleep',wakeT:0,onGround:true,t:0,f:1,meowT:2,rrT:0};L.avoid.push(cx);break;
      case'Q':L.chaser={type:'drone',home:{x:cx-18,y:cy-9},x:cx-18,y:cy-9,w:36,h:18,vx:0,vy:0,state:'sleep',t:0,f:1,meowT:2};break;
      case'Z':L.chaser={type:'buse',home:{x:cx-24,y:cy-14},x:cx-24,y:cy-14,w:48,h:26,vx:0,vy:0,state:'sleep',t:0,f:1,meowT:2,swoop:0,phase:'hover',pt:0};break;
      case'h':L.hints.push({x:cx,y:y+T,i:hi++});L.avoid.push(cx);break;
      case'q':L.quips.push({x:cx,i:qi++,fired:false});break;
      case'l':L.decor.push({t:th.outdoor?'lantern':'lamp',x:cx,y:cy});L.lights.push({x:cx,y:cy+14,r:250,i:.95,warm:1});break;
      case'g':L.decor.push({t:th.outdoor?'board':'sign',x:cx,y:cy,text:def.signs[si++]||''});break;
      case'u':L.dome={x:cx,floor:y+2*T};L.avoid.push(cx,cx-60,cx+60,cx-120);break;
      case'w':{let fr=r+1;while(fr<ROWS&&g[fr][c]!=='#')fr++;L.decor.push({t:'mammoth',x:cx,y:cy,floor:fr*T})}L.avoid.push(cx,cx-200,cx-100,cx+100,cx+200);break;
      case'c':L.decor.push({t:'clock',x:cx,y:cy});break;
      case'y':L.decor.push({t:'stove',x:cx,y:y+2*T});L.lights.push({x:cx,y:y+2*T-40,r:170,i:.8,warm:2});L.avoid.push(cx);break;
      case'b':L.decor.push({t:'bowl',x:cx,y:y+T});L.avoid.push(cx);break;
      case'j':{const b={t:'bell',x:cx,y:cy,ring:0,ph:0};L.decor.push(b);L.bells.push(b);L.lights.push({x:cx,y:cy+40,r:160,i:.5});break}
      case'i':L.decor.push({t:'statue',x:cx,y:y+T});break;
      case'|':L.mark.add(c+','+r);break;
      default:clear=false;
    }
    if(clear)g[r][c]='.';
  }
  for(const m of movers){
    const pw=m.w*T;
    if(m.axis==='h'){
      let a=m.c-3,b=m.c+3;
      for(let c=m.c-1;c>=0;c--)if(L.mark.has(c+','+m.r)){a=c+1;break}
      for(let c=m.c+1;c<wT;c++)if(L.mark.has(c+','+m.r)){b=c-m.w;break}
      L.movers.push({axis:'h',kind:m.kind,x:m.c*T,y:m.r*T,w:pw,h:14,a0:a*T,a1:b*T,t:0,dx:0,dy:0,speed:m.kind==='truck'?115:72});
    }else{
      let a=m.r-3,b=m.r;
      for(let r=m.r-1;r>=0;r--)if(L.mark.has(m.c+','+r)){a=r+1;break}
      for(let r=m.r+1;r<ROWS;r++)if(L.mark.has(m.c+','+r)){b=r-1;break}
      L.movers.push({axis:'v',kind:m.kind,x:m.c*T,y:m.r*T,w:pw,h:14,a0:b*T,a1:a*T,t:0,dx:0,dy:0,speed:60});
    }
  }
  for(const m of L.movers){const span=Math.abs(m.a1-m.a0);const u=(m.axis==='h'?m.x-m.a0:m.a0-m.y)/Math.max(1,span);m.t=clamp(u,0,1)*span/m.speed}
  if(def.garlands)for(let x=200;x<L.wpx-200;x+=520){L.decor.push({t:'garland',x,y:130,w:400});for(let k=1;k<8;k+=2)L.lights.push({x:x+k*50,y:150+Math.sin(k/8*Math.PI)*40,r:110,i:.55,warm:1})}
  if(def.flyers)def.flyers.forEach((o,i)=>{const m=L.moths[i];if(!m||!o)return;if(o.dy){m.cy+=o.dy;m.y=m.cy}if(o.amp)m.amp=o.amp;if(o.sp)m.sp=o.sp});
  for(const c of L.rats)c.base=Math.abs(c.vx);
  return L;
}

/* ---------- grille et collisions ---------- */
let L=null;
const SOLID='#XWD';
function tile(c,r){if(c<0||c>=L.w)return'W';if(r<0||r>=ROWS)return'.';return L.g[r][c]}
function isSolid(c,r){return SOLID.includes(tile(c,r))}
function owTop(ch){return(ch==='='||ch==='B')?0:ch==='p'?14:-1}
function groundAt(c,r){const ch=tile(c,r);return SOLID.includes(ch)||owTop(ch)>=0}
function moveX(e,dx){
  if(!dx)return false;e.x+=dx;
  const r0=Math.floor(e.y/T),r1=Math.floor((e.y+e.h-.01)/T);
  if(dx>0){const c=Math.floor((e.x+e.w-.001)/T);for(let r=r0;r<=r1;r++)if(isSolid(c,r)){e.x=c*T-e.w;e.vx=0;return true}}
  else{const c=Math.floor(e.x/T);for(let r=r0;r<=r1;r++)if(isSolid(c,r)){e.x=(c+1)*T;e.vx=0;return true}}
  return false;
}
function moveY(e,dy){
  const prevB=e.y+e.h;e.y+=dy;
  const c0=Math.floor(e.x/T),c1=Math.floor((e.x+e.w-.01)/T);
  if(dy>0){
    const b=e.y+e.h,r=Math.floor(b/T);
    for(let c=c0;c<=c1;c++){
      const ch=tile(c,r);
      if(SOLID.includes(ch)){e.y=r*T-e.h;e.vy=0;e.onGround=true;return true}
      const o=owTop(ch);
      if(o>=0){const top=r*T+o;if(prevB<=top+.5&&b>=top){e.y=top-e.h;e.vy=0;e.onGround=true;return true}}
    }
  }else if(dy<0){
    const r=Math.floor(e.y/T);
    for(let c=c0;c<=c1;c++)if(isSolid(c,r)){e.y=(r+1)*T;e.vy=0;return true}
  }
  return false;
}

const layerCache={};
function damask(g,x,y,s){
  g.beginPath();g.moveTo(x,y-14*s);g.quadraticCurveTo(x+7*s,y-3*s,x,y+12*s);g.quadraticCurveTo(x-7*s,y-3*s,x,y-14*s);g.fill();
  g.lineWidth=1.6*s;
  for(const sx of[-1,1]){g.beginPath();g.moveTo(x,y+4*s);g.bezierCurveTo(x+sx*11*s,y-4*s,x+sx*18*s,y+6*s,x+sx*11*s,y+12*s);g.bezierCurveTo(x+sx*7*s,y+8*s,x+sx*9*s,y+5*s,x+sx*12*s,y+5*s);g.stroke();
    g.beginPath();g.moveTo(x,y-8*s);g.bezierCurveTo(x+sx*8*s,y-16*s,x+sx*14*s,y-12*s,x+sx*12*s,y-6*s);g.stroke()}
  g.beginPath();g.arc(x,y-19*s,2*s,0,7);g.arc(x,y+17*s,2*s,0,7);g.fill();
}
function butterfly(g,x,y,s,R){
  const cols=['#c9772f','#3f6fa8','#d9c25a','#8a3a5a','#5a9a7a','#e0e0d0','#b8402f'];
  const c=cols[Math.floor(R()*cols.length)],c2=cols[Math.floor(R()*cols.length)];
  g.fillStyle=c;g.beginPath();g.ellipse(x-5*s,y-3*s,6*s,4.5*s,-.5,0,7);g.ellipse(x+5*s,y-3*s,6*s,4.5*s,.5,0,7);g.fill();
  g.fillStyle=c2;g.beginPath();g.ellipse(x-4*s,y+4*s,4*s,3*s,.4,0,7);g.ellipse(x+4*s,y+4*s,4*s,3*s,-.4,0,7);g.fill();
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x-6*s,y-3*s,1.5*s,0,7);g.arc(x+6*s,y-3*s,1.5*s,0,7);g.fill();
  g.fillStyle='#1a1410';g.fillRect(x-.8*s,y-6*s,1.6*s,12*s);

function cobweb(g,x,y,s){
  g.strokeStyle='rgba(220,215,200,.2)';g.lineWidth=.8;
  const ang=k=>Math.PI*.05+k*Math.PI*.18;
  for(let k=0;k<6;k++){const a=ang(k);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s);g.stroke()}
  for(let r=s*.25;r<s;r+=s*.22){g.beginPath();for(let k=0;k<5;k++){const a=ang(k),a2=ang(k+1);const x1=x+Math.cos(a)*r,y1=y+Math.sin(a)*r,x2=x+Math.cos(a2)*r,y2=y+Math.sin(a2)*r;if(k===0)g.moveTo(x1,y1);g.quadraticCurveTo((x1+x2)/2-Math.cos((a+a2)/2)*r*.12,(y1+y2)/2-Math.sin((a+a2)/2)*r*.12,x2,y2)}g.stroke()}
}

function matCols(ch,th){
  switch(ch){
    case'#':return[th.floor,th.floorTop,shade(th.floor,-.3)];
    case'W':return th.outdoor?[shade(th.floor,-.35),shade(th.floorTop,-.2),shade(th.floor,-.5)]:['#241a14','#33251c','#1a120d'];
    case'X':return MAT.X[th.x];
    case'D':return MAT.D[th.d];
    case'=':return MAT['='][th.shelf];
    case'B':return['#d6caae','#ece2cb','#a99c80'];
  }
  return null;
}

  const c=mk(wpx*RS,hpx*RS),g=c.getContext('2d');g.scale(RS,RS);g.translate(0,PAD);
  if(!th.outdoor){
    for(let x=60;x<L.wpx;x+=180+R()*260){if(R()<.6)cobweb(g,x,-4,40+R()*40);else{g.strokeStyle='rgba(120,100,80,.5)';g.lineWidth=1.5;g.beginPath();g.moveTo(x,-10);g.quadraticCurveTo(x+30,60+R()*40,x+70,-10);g.stroke()}}
    for(let r=11;r<ROWS;r++)for(let cc=0;cc<L.w;cc++)if(L.g[r][cc]==='#'&&!isSolid(cc,r-1)){g.fillStyle=shade(th.wains,-.1);g.fillRect(cc*T+DX,r*T+DY-9,T,9);g.fillStyle=shade(th.wains,.25);g.fillRect(cc*T+DX,r*T+DY-9,T,1.5)}
  }
  const list=th.props;let x=80+R()*120,pi=Math.floor(R()*list.length);
  while(x<L.wpx-120){
    const p=PROPS[list[pi%list.length]],w=p.w;
    const c0=Math.floor(x/T),c1=Math.floor((x+w)/T);let ok=true;
    for(let cc=c0;cc<=c1;cc++)if(tile(cc,13)!=='#'||isSolid(cc,12))ok=false;
    for(const a of L.avoid)if(a>x-50&&a<x+w+50)ok=false;
    if(ok){g.save();p.d(g,x+DX,13*T+DY,R);g.restore();pi++;x+=w+70+R()*200}else x+=40;
  }
  g.save();g.globalCompositeOperation='source-atop';g.fillStyle=rgba(th.fog,th.outdoor?.22:.28);g.fillRect(0,-PAD,wpx,hpx);g.restore();
  const sh=mk(wpx,hpx),sg=sh.getContext('2d');sg.translate(0,PAD);sg.fillStyle='#000';
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<L.w;cc++){const ch=L.g[r][cc];if(SOLID.includes(ch))sg.fillRect(cc*T+10,r*T+12,T,T);else if(ch==='='||ch==='B')sg.fillRect(cc*T+10,r*T+12,T,12)}
  g.save();g.globalAlpha=th.outdoor?.38:.5;g.filter='blur(7px)';g.drawImage(sh,0,-PAD);g.restore();
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<L.w;cc++){
    const ch=L.g[r][cc],x=cc*T,y=r*T,mc=matCols(ch,th);if(!mc)continue;
    if(ch==='='||ch==='B'){faceTop(g,x,y,mc[1]);if(tile(cc+1,r)!==ch)faceSide(g,x,y,12,mc[2]);continue}
    if(!isSolid(cc,r-1))faceTop(g,x,y,mc[1]);
    if(!isSolid(cc+1,r))faceSide(g,x,y,T,mc[2]);
  }
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<L.w;cc++)drawTileFront(g,L.g[r][cc],cc*T,r*T,cc,r,th);
  // arête nette sous chaque face avant : rendu plus « carré »
  g.fillStyle='rgba(0,0,0,.35)';
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<L.w;cc++){const ch=L.g[r][cc];if(SOLID.includes(ch)&&!isSolid(cc,r+1)&&r<ROWS-1)g.fillRect(cc*T,r*T+T-1.5,T,1.5)}
  g.save();g.globalCompositeOperation='source-atop';g.globalAlpha=.3;g.fillStyle=g.createPattern(paperC,'repeat');g.fillRect(0,-PAD,wpx,hpx);g.restore();
  return c;
}
function h01(a,b){return Math.abs((a*73856093)^(b*19349663))%1000/1000}
function drawFloor(g,x,y,cc,r,th,mc,topOpen){
  g.fillStyle=mc[0];g.fillRect(x,y,T,T);
  const t=th.type;
  if(t==='parquet'){
    g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=1;
    for(let k=0;k<4;k++){const yy=y+k*10+.5;g.beginPath();g.moveTo(x,yy);g.lineTo(x+T,yy);g.stroke();const j=((cc*37+r*11+k*23)%5)*8+4;g.beginPath();g.moveTo(x+j+.5,yy);g.lineTo(x+j+.5,yy+10);g.stroke();
      g.fillStyle='rgba(255,220,170,'+(((cc*7+k*3+r)%4)*.02)+')';g.fillRect(x,yy+1,T,9)}
  }else if(t==='stone'||t==='platform'){
    g.strokeStyle='rgba(0,0,0,.22)';g.lineWidth=1.2;
    for(let k=0;k<2;k++){const yy=y+k*20;g.strokeRect(x+((r+k)%2?-20:0)+.5,yy+.5,T,20);g.strokeRect(x+((r+k)%2?20:0)+.5,yy+.5,T,20)}
    if(t==='platform'&&topOpen){g.fillStyle='#d9b84a';g.fillRect(x,y+5,T,4)}
  }else if(t==='tomette'){
    for(let k=0;k<2;k++)for(let j=0;j<2;j++){g.fillStyle=shade(th.floor,((cc*3+r*5+k*7+j*11)%5-2)*.05);g.fillRect(x+j*20+1,y+k*20+1,18,18)}
  }else if(t==='earth'){
    g.fillStyle='rgba(0,0,0,.14)';for(let k=0;k<3;k++)g.fillRect(x,y+8+k*12+((cc+k)%3),T,2);
    for(let k=0;k<3;k++){const sx=x+h01(cc*3+k,r)*34,sy=y+6+h01(cc,r*5+k)*30;g.fillStyle='rgba(150,135,110,.35)';g.beginPath();g.ellipse(sx,sy,3+k,2,0,0,7);g.fill()}
    if(h01(cc,r)<.25){g.strokeStyle='rgba(30,20,10,.45)';g.lineWidth=1;g.beginPath();g.moveTo(x+10,y);g.quadraticCurveTo(x+16,y+14,x+8,y+26);g.stroke()}
  }else if(t==='zinc'){
    if(topOpen){g.fillStyle=mc[0];g.fillRect(x,y,T,T);g.fillStyle='rgba(255,255,255,.12)';for(let k=4;k<T;k+=10)g.fillRect(x+k,y,2,T);g.fillStyle='#3a4048';g.fillRect(x,y+T-4,T,4)}
    else{g.fillStyle=shade(th.floor,-.15);g.fillRect(x,y,T,T);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(x,y+19,T,1);g.fillRect(x+((r%2)?20:0),y,1,20);g.fillRect(x+((r%2)?0:20),y+20,1,20);
      if(h01(cc,r)<.3){const lit=h01(r,cc)<.4;g.fillStyle=lit?'rgba(255,205,120,.75)':'rgba(15,18,28,.8)';g.fillRect(x+12,y+8,14,22);g.fillStyle=shade(th.floor,-.35);g.fillRect(x+10,y+30,18,3)}}
  }else if(t==='gravel'){
    for(let k=0;k<10;k++){g.fillStyle=k%2?'rgba(255,240,210,.12)':'rgba(0,0,0,.12)';g.fillRect(x+h01(cc*7+k,r)*38,y+h01(cc,r*3+k)*38,2,2)}
  }else if(t==='asphalt'||t==='deck'){
    if(topOpen){g.fillStyle=t==='deck'?'#8a8e96':'#9a968e';g.fillRect(x,y,T,7);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x,y+7,T,1.5)}
    g.fillStyle='rgba(255,255,255,.05)';for(let k=0;k<6;k++)g.fillRect(x+h01(cc*5+k,r)*38,y+10+h01(cc,r*7+k)*28,2,1);
    if(t==='deck'){g.fillStyle='rgba(0,0,0,.25)';for(let k=0;k<2;k++)for(let j=0;j<2;j++){g.beginPath();g.arc(x+8+j*24,y+14+k*16,1.6,0,7);g.fill()}g.fillRect(x+T-1,y,1,T)}
    else if(h01(cc,r)<.3){g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1;g.beginPath();g.moveTo(x+6,y+12);g.lineTo(x+16,y+22);g.lineTo(x+12,y+34);g.stroke()}
  }else if(t==='cobble'){
    for(let k=0;k<3;k++)for(let j=0;j<3;j++){g.fillStyle=shade(th.floor,(h01(cc*3+j,r*3+k)-.5)*.18);rr(g,x+j*13+((k%2)?6:0)-3,y+k*13+1,12,11,4);g.fill()}
  }else if(t==='plank'){
    g.fillStyle='rgba(0,0,0,.25)';for(let k=0;k<4;k++)g.fillRect(x+k*10,y,1,T);g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x+5,y+6,1.2,0,7);g.arc(x+25,y+6,1.2,0,7);g.fill();
  }
  if(topOpen){
    if(t==='earth'){g.fillStyle=th.floorTop;g.fillRect(x,y,T,6);g.strokeStyle=th.floorTop;g.lineWidth=1.4;for(let k=0;k<8;k++){const gx=x+k*5+2;g.beginPath();g.moveTo(gx,y+4);g.lineTo(gx+(k%2?2:-1),y-4-(k%3)*2);g.stroke()}
      if(th.props.includes('poppies')&&h01(cc,r)<.35){g.fillStyle='#c8302a';g.beginPath();g.arc(x+h01(r,cc)*34+3,y-5,3,0,7);g.fill()}}
    else if(t!=='zinc'&&t!=='asphalt'&&t!=='deck'){g.fillStyle=mc[1];g.fillRect(x,y,T,4);g.fillStyle='rgba(255,240,210,.32)';g.fillRect(x,y,T,1);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(x,y+4,T,1.5)}
  }
  if(r>=13&&th.type!=='zinc'){g.fillStyle='rgba(0,0,0,'+(r===14?.32:.12)+')';g.fillRect(x,y,T,T)}

function drawBlock(g,ch,x,y,cc,r,th,mc){
  const kind=ch==='X'?th.x:th.d;
  g.fillStyle=mc[0];g.fillRect(x,y,T,T);
  const below=tile(cc,r+1)===ch,above=tile(cc,r-1)===ch,left=tile(cc-1,r)===ch,right=tile(cc+1,r)===ch;
  switch(kind){
    case'carton':{
      g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x,y,T,2);g.fillRect(x,y+T-2,T,2);g.fillRect(x,y,2,T);g.fillRect(x+T-2,y,2,T);
      g.fillStyle='rgba(230,210,160,.55)';g.fillRect(x+16,y,8,T);
      const v=(cc*31+r*17)%7;g.save();g.translate(x+T/2,y+T/2);
      if(v===0){g.rotate(-.18);g.fillStyle='rgba(160,40,30,.75)';g.font='bold 8px '+F_DISP;g.textAlign='center';g.fillText('FRAGILE',0,3)}
      else if(v===2){g.fillStyle='rgba(30,20,10,.6)';g.font='9px '+F_DISP;g.textAlign='center';g.fillText('↑ HAUT ↑',0,13)}
      else if(v===4){g.fillStyle='rgba(30,20,10,.55)';g.font='italic 10px '+F_BODY;g.textAlign='center';g.fillText('n° '+(10+cc%80),-1,-8)}
      else if(v===6){g.fillStyle='#e9dfc7';g.fillRect(-14,4,12,9)}
      g.restore();break}
    case'sandbag':case'hay':{
      for(let k=0;k<2;k++){const yy=y+k*20,off=((r+k)%2)?-10:10;for(let j=-1;j<2;j++){g.fillStyle=shade(mc[0],(h01(cc*3+j,r*2+k)-.5)*.16);rr(g,x+j*20+off+2,yy+2,18,17,kind==='hay'?3:7);g.fill();g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+j*20+off+2,yy+16,18,2)}}
      if(kind==='hay'){g.strokeStyle='rgba(120,80,20,.45)';g.lineWidth=1;for(let k=0;k<6;k++){g.beginPath();g.moveTo(x+k*7,y+2);g.lineTo(x+k*7+4,y+T-2);g.stroke()}g.fillStyle='#8a3a2a';g.fillRect(x,y+12,T,2);g.fillRect(x,y+28,T,2)}
      break}
    case'brick':{
      for(let k=0;k<4;k++){const yy=y+k*10;for(let j=-1;j<3;j++){g.fillStyle=shade(mc[0],(h01(cc*4+j,r*4+k)-.5)*.2);g.fillRect(x+j*20+((k%2)?10:0)+1,yy+1,18,8)}}
      if(!above){g.fillStyle='#4a4a4e';g.fillRect(x-2,y,T+4,5);g.fillStyle='#a85a3a';if(cc%2===0){g.fillRect(x+8,y-12,8,12);g.fillRect(x+22,y-9,8,9)}}
      break}
    case'luggage':{
      g.fillStyle=shade(mc[0],(h01(cc,r)-.5)*.3);rr(g,x+2,y+3,T-4,T-6,4);g.fill();g.fillStyle='#c9a35a';g.fillRect(x+16,y,8,4);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+2,y+18,T-4,2);g.fillStyle='#e9dfc7';g.fillRect(x+6,y+8,8,6);break}
    case'bench':{
      g.fillStyle='#1e2a24';g.fillRect(x,y,T,T);g.fillStyle=mc[1];for(let k=0;k<4;k++)g.fillRect(x,y+2+k*10,T,6);break}
    case'barrier':{
      g.fillStyle=mc[0];g.fillRect(x,y,T,T);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x,y+T*.55,T,2);
      if(!above){g.fillStyle='#c8302a';for(let k=0;k<2;k++)g.fillRect(x+k*20+((cc%2)?10:0),y+6,10,6)}break}
    case'crate':{
      g.strokeStyle='#4a321a';g.lineWidth=3;g.strokeRect(x+2,y+2,T-4,T-4);g.beginPath();g.moveTo(x+3,y+3);g.lineTo(x+T-3,y+T-3);g.stroke();break}
    case'tomb':{
      g.fillStyle=mc[0];g.fillRect(x,y,T,T);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+12,y+12,16,1.5);g.fillRect(x+10,y+18,20,1.5);g.fillRect(x+14,y+24,12,1.5);
      if(!above){g.fillStyle=mc[1];g.beginPath();g.ellipse(x+T/2,y,T/2,10,0,Math.PI,0);g.fill();g.fillStyle='#2a2a2e';g.fillRect(x+19,y-16,2,12);g.fillRect(x+15,y-12,10,2)}
      g.fillStyle='rgba(90,110,60,.35)';g.fillRect(x,y+T-6,T,6);break}
    case'drape':{
      for(let k=0;k<T;k+=2){const v=Math.sin((x+k)*.18)*.5+Math.sin((x+k)*.07)*.5;g.fillStyle=v>0?'rgba(255,255,255,'+(v*.12)+')':'rgba(60,50,30,'+(-v*.14)+')';g.fillRect(x+k,y,2,T)}
      if(!below){g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.moveTo(x,y+T-6);for(let k=0;k<=T;k+=8)g.quadraticCurveTo(x+k+4,y+T+3,x+k+8,y+T-4);g.lineTo(x+T,y+T);g.lineTo(x,y+T);g.closePath();g.fill()}
      break}
    case'hedge':{
      for(let k=0;k<7;k++){g.fillStyle=shade(mc[0],(h01(cc*7+k,r)-.5)*.3);g.beginPath();g.arc(x+h01(cc,k*3+r)*T,y+h01(k,cc+r)*T,7,0,7);g.fill()}
      if(!above){g.fillStyle=mc[1];g.fillRect(x,y,T,5)}break}
    case'stall':{
      g.fillStyle='#8a5a3a';g.fillRect(x,y,T,T);g.fillStyle='rgba(0,0,0,.25)';for(let k=0;k<4;k++)g.fillRect(x,y+k*10+8,T,1.5);
      if(!above){for(let k=0;k<4;k++){g.fillStyle=k%2?'#efe6d0':'#c8302a';g.fillRect(x+k*10,y,10,10)}g.fillStyle='rgba(0,0,0,.2)';for(let k=0;k<4;k++){g.beginPath();g.arc(x+k*10+5,y+10,5,0,Math.PI);g.fill()}
        if(cc%2===0){g.fillStyle='#a8322d';g.beginPath();g.arc(x+12,y+22,5,0,7);g.fill();g.fillStyle='#7a3a8a';g.beginPath();g.arc(x+26,y+24,4,0,7);g.fill()}}
      break}
    case'vault':{
      g.fillStyle='rgba(0,0,0,.12)';g.fillRect(x,y+19,T,1);g.fillRect(x+((r%2)?20:0),y,1,20);g.fillRect(x+((r%2)?0:20),y+20,1,20);
      if(!above&&!left){g.fillStyle=mc[1];poly(g,[x,y,x+T*1.5,y-30,x+T*3,y]);g.fill();g.fillStyle='#2a2a2e';g.fillRect(x+T*1.5-2,y-46,4,16);g.fillRect(x+T*1.5-8,y-40,16,3)}
      if(!below&&!left){g.fillStyle='#1e1e22';rr(g,x+T*1.5-12,y+T-34,24,34,8);g.fill()}
      break}
  }
}
function drawSpikes(g,ch,x,y,cc,r,th){
  const up=ch==='^',k=th.spike;const by=up?y+T-8:y;
  if(k==='pins'){
    g.fillStyle='#8a6a48';g.fillRect(x,by,T,8);
    const heads=['#b8302a','#efe6d3','#1d1a22','#b8302a','#d9a441'];
    for(let i=0;i<3;i++){const px=x+8+i*12,len=22+((cc+i*3+r)%3)*3;g.strokeStyle='#cfd3d6';g.lineWidth=1.4;g.beginPath();g.moveTo(px,up?by:by+8);g.lineTo(px,up?by-len:by+8+len);g.stroke();g.fillStyle=heads[(cc+i+r)%5];g.beginPath();g.arc(px,up?by-len:by+8+len,3.4,0,7);g.fill()}
  }else if(k==='wire'){
    const top=up?y+10:y,bot=up?y+T:y+30;
    if(up){g.fillStyle='#5a4632';g.fillRect(x+18,y+6,4,T-6)}
    g.strokeStyle='#7a7a72';g.lineWidth=1.2;
    for(let i=0;i<3;i++){g.beginPath();g.ellipse(x+7+i*13,(top+bot)/2,8,(bot-top)/2-2,0,0,7);g.stroke()}
    g.strokeStyle='#5a5a54';for(let i=0;i<8;i++){const bx=x+h01(cc*8+i,r)*T,byy=top+h01(r*8+i,cc)*(bot-top);g.beginPath();g.moveTo(bx-2,byy-2);g.lineTo(bx+2,byy+2);g.moveTo(bx+2,byy-2);g.lineTo(bx-2,byy+2);g.stroke()}
  }else if(k==='spikes'){
    g.fillStyle='#8a8e96';g.fillRect(x,by,T,5);g.strokeStyle='#c8ccd4';g.lineWidth=1.3;
    for(let i=0;i<9;i++){const px=x+3+i*4.3,a=(i-4)*.07;g.beginPath();g.moveTo(px,up?by:by+5);g.lineTo(px+Math.sin(a)*22*(up?1:-1),up?by-22:by+27);g.stroke()}
  }else if(k==='glass'){
    for(let i=0;i<5;i++){const px=x+4+i*8,h=8+((cc+i*5+r)%4)*4;g.fillStyle=i%2?'rgba(170,210,190,.75)':'rgba(200,225,235,.7)';poly(g,[px-4,y+T,px+(i%2?3:-2),y+T-h-6,px+5,y+T]);g.fill()}
    g.fillStyle='rgba(255,255,255,.5)';g.fillRect(x+12,y+T-12,1,6);
  }else if(k==='pickets'){
    g.fillStyle='#2a2a2e';g.fillRect(x,y+T-6,T,3);g.fillRect(x,y+T-22,T,2);
    for(let i=0;i<4;i++){const px=x+5+i*10;g.fillRect(px-1,y+8,3,T-8);poly(g,[px-4,y+10,px+.5,y+1,px+5,y+10]);g.fill()}
  }else if(k==='nails'){
    g.fillStyle='#6a4a2a';g.fillRect(x,by,T,8);g.strokeStyle='#9a9ea6';g.lineWidth=1.6;
    for(let i=0;i<4;i++){const px=x+6+i*9;g.beginPath();g.moveTo(px,up?by:by+8);g.lineTo(px+(i%2?1:-1),up?by-20:by+28);g.stroke()}
  }
}
function drawTileFront(g,ch,x,y,cc,r,th){
  const mc=matCols(ch,th);
  const topOpen=!isSolid(cc,r-1);
  if(ch==='#')drawFloor(g,x,y,cc,r,th,mc,topOpen);
  else if(ch==='W'){g.fillStyle=mc[0];g.fillRect(x,y,T,T);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x+8,y,2,T);g.fillRect(x+28,y,2,T)}
  else if(ch==='X'||ch==='D')drawBlock(g,ch,x,y,cc,r,th,mc);
  else if(ch==='='){
    g.fillStyle=mc[0];g.fillRect(x,y,T,12);g.fillStyle='rgba(255,230,190,.25)';g.fillRect(x,y,T,1.5);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x,y+10,T,2);
    const s=th.shelf;
    if(s==='duck'){g.fillStyle='rgba(0,0,0,.3)';for(let k=5;k<T;k+=8)g.fillRect(x+k,y,2,12)}
    else if(s==='gutter'){g.fillStyle='rgba(255,255,255,.18)';g.fillRect(x,y+3,T,2)}
    else if(s==='girder'){g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1.5;g.beginPath();for(let k=0;k<T;k+=10){g.moveTo(x+k,y+2);g.lineTo(x+k+5,y+10);g.lineTo(x+k+10,y+2)}g.stroke();g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.arc(x+5,y+6,1.3,0,7);g.arc(x+35,y+6,1.3,0,7);g.fill()}
    else if(s==='table'){if(tile(cc-1,r)!=='='||tile(cc+1,r)!=='='){g.fillStyle=mc[2];const lx=tile(cc-1,r)!=='='?x+6:x+T-10;g.fillRect(lx,y+12,4,28)}}

/* décors */
function drawDecor(g,d,t){

    g.fillStyle='#24452f';rr(g,d.x-w/2,d.y-14,w,26,3);g.fill();g.strokeStyle='#e9dfc7';g.lineWidth=1;rr(g,d.x-w/2+3,d.y-11,w-6,20,2);g.stroke();
    g.fillStyle='#e9dfc7';g.textAlign='center';g.fillText(d.text,d.x,d.y+4);

    g.fillStyle='#4a3a2a';g.fillRect(d.x-w/2+10,d.y+6,4,2*T-6);g.fillRect(d.x+w/2-14,d.y+6,4,2*T-6);
    g.fillStyle='#e9dfc7';rr(g,d.x-w/2,d.y-14,w,24,2);g.fill();g.strokeStyle='#a8322d';g.lineWidth=2;rr(g,d.x-w/2+3,d.y-11,w-6,18,2);g.stroke();
    g.fillStyle='#2a2420';g.textAlign='center';g.fillText(d.text,d.x,d.y+2);
  }else if(d.t==='mammoth'){

  }else if(d.t==='clock'){
    const x=d.x,y=d.y;g.fillStyle='#5a3a22';rr(g,x-30,y-30,60,140,8);g.fill();
    g.fillStyle='#efe6d0';g.beginPath();g.arc(x,y,22,0,7);g.fill();g.strokeStyle='#2a2420';g.lineWidth=1.5;g.stroke();
    g.fillStyle='#2a2420';for(let k=0;k<12;k++){const a=k*Math.PI/6;g.fillRect(x+Math.cos(a)*17-1,y+Math.sin(a)*17-1,2,2)}
    g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(t*.05)*12,y+Math.sin(t*.05)*12);g.moveTo(x,y);g.lineTo(x+Math.cos(t*.6)*16,y+Math.sin(t*.6)*16);g.stroke();
    const sw=Math.sin(t*3)*.35;g.save();g.translate(x,y+30);g.rotate(sw);g.strokeStyle='#c9a35a';g.lineWidth=2;g.beginPath();g.moveTo(0,0);g.lineTo(0,58);g.stroke();g.fillStyle='#d9b45a';g.beginPath();g.arc(0,62,8,0,7);g.fill();g.restore();
    if(Math.sin(t*3)*Math.sin((t-.016)*3)<0)G.tickSnd=true;
  }else if(d.t==='stove'){
    const x=d.x,y=d.y;g.fillStyle='#22201f';rr(g,x-26,y-70,52,70,6);g.fill();g.fillRect(x-6,-30,12,y-30);
    const f=.7+Math.sin(t*9)*.15+Math.sin(t*23)*.08;g.fillStyle='rgba(255,'+(110+f*60|0)+',40,'+f+')';rr(g,x-14,y-44,28,18,4);g.fill();
    g.fillStyle='#3a3836';g.fillRect(x-30,y-74,60,6);
    g.fillStyle='#5a5a5a';rr(g,x-14,y-86,28,12,3);g.fill();g.fillStyle='rgba(220,220,220,.15)';for(let k=0;k<3;k++){const ph=(t*.4+k/3)%1;g.globalAlpha=1-ph;g.beginPath();g.arc(x+Math.sin(ph*6+k)*6,y-92-ph*50,4+ph*8,0,7);g.fill()}g.globalAlpha=1;
  }else if(d.t==='bowl'){
    const x=d.x,y=d.y;g.fillStyle='#a8322d';g.beginPath();g.moveTo(x-16,y-12);g.lineTo(x+16,y-12);g.lineTo(x+12,y);g.lineTo(x-12,y);g.closePath();g.fill();
    g.fillStyle='#6a3a1a';g.beginPath();g.ellipse(x,y-12,15,3,0,0,7);g.fill();
    g.fillStyle='#e9dfc7';g.font='7px '+F_DISP;g.textAlign='center';g.fillText('BIJOU',x,y-3);
  }else if(d.t==='bell'){
    const sw=Math.sin(t*2.2+d.ph)*.18*(1+d.ring*2);g.save();g.translate(d.x,d.y-100);
    g.fillStyle='#3a2a1a';g.fillRect(-60,-8,120,12);g.rotate(sw);
    const gr=g.createLinearGradient(-40,0,40,0);gr.addColorStop(0,'#6a4a1a');gr.addColorStop(.4,'#c9a24a');gr.addColorStop(1,'#5a3a14');g.fillStyle=gr;
    g.beginPath();g.moveTo(-14,10);g.quadraticCurveTo(-22,40,-34,90);g.lineTo(34,90);g.quadraticCurveTo(22,40,14,10);g.closePath();g.fill();
    g.fillStyle='#3a2a14';g.fillRect(-36,86,72,6);g.beginPath();g.arc(0,96,7,0,7);g.fill();g.restore();
  }else if(d.t==='statue'){
    drawStatue(g,d.x,d.y,t);
  }else if(d.t==='garland'){
    g.strokeStyle='rgba(40,30,30,.7)';g.lineWidth=1.2;g.beginPath();for(let k=0;k<=20;k++){const xx=d.x+k*d.w/20;g.lineTo(xx,d.y+Math.sin(k/20*Math.PI)*40)}g.stroke();
    for(let k=1;k<20;k+=2){const xx=d.x+k*d.w/20,yy=d.y+Math.sin(k/20*Math.PI)*40;g.fillStyle=['#c8302a','#e0b030','#3a6aa8','#e9dfc7'][k%4];g.beginPath();g.ellipse(xx,yy+8,6,8,0,0,7);g.fill();g.fillStyle='rgba(255,220,150,.3)';g.beginPath();g.arc(xx,yy+8,12,0,7);g.fill()}
  }
}

const G={state:'loading',t:0,li:0,levelDeaths:0,corn:0,cornTotal:0,medal:false,quip:null,hintI:-1,hintA:0,lastHint:null,fade:1,shake:0,menuSel:0,click:null,boxes:[],

const P={x:0,y:0,w:24,h:28,vx:0,vy:0,onGround:false,onMover:null,coyote:0,jumpBuf:0,flaps:0,facing:1,jumping:false,gliding:false,flapT:0,sx:1,sy:1,dead:false,deadT:0,wake:0,cp:null,spin:0,lift:0};

function say(text,dur){G.quip={text,t:0,dur:dur||3.8}}
function bubble(x,y,text,col){G.bubbles.push({x,y,text,t:0,max:1.2+text.length*.035,col:col||'#a8322d',rot:(rnd()-.5)*.25})}
function wear(){return S.run.wear||0}
function loadLayers(i){
  const key=i+':'+RS;
  if(!layerCache[key]){const tmp=parseLevel(i);const prev=L;L=tmp;layerCache[key]={far:buildFar(tmp),mid:buildMid(tmp),windows:tmp.windows,turbines:tmp.turbines};L=prev}
  return layerCache[key];
}
function computeRS(){RS=Math.min(2,Math.max(1,Math.round(scale*dpr*2)/2))}
function songKey(i){const d=LEVELS[i];return's'+(d.w+1)+'-'+(i%4+1)}
function startLevel(i){
  computeRS();
  G.li=i;L=parseLevel(i);const lay=loadLayers(i);L.far=lay.far;L.mid=lay.mid;L.windows=lay.windows;L.turbines=lay.turbines;L.tiles=buildTiles(L);
  G.levelDeaths=0;G.corn=0;G.cornTotal=L.corn.length;G.medal=false;G.chase=false;G.bubbles=[];G.flash=0;G.flashT=3+rnd()*4;G.lt=0;

      L.carton={x:L.armoire.x-6,y:L.dome.floor-218,vx:0,vy:0,rot:0,vr:0,state:'hold'};

function resetPlayer(){

function puff(x,y,n,straw){
  for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,s=60+rnd()*260;parts.push({type:straw?'straw':'feather',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,life:0,max:.9+rnd()*1.1,rot:rnd()*6,vr:(rnd()-.5)*14,len:4+rnd()*7})}
}
function die(kind,tiles){
  if(P.dead)return;
  if(G.sim){P.dead=true;return}
  P.dead=true;P.deadT=1.25;G.levelDeaths++;
  // chaque chute abîme Raymond d'un cran ; au-delà du 5e état, il perd la tête
  if((S.run.wear||0)>=MAX_WEAR&&!S.infinite)G.gameOverPending=true;
  else S.run.wear=Math.min(MAX_WEAR,(S.run.wear||0)+1);
  save();
  G.shake=10;SFX.death();
  const cx=P.x+P.w/2,cy=P.y+P.h/2;
  puff(cx,cy,30,true);puff(cx,cy,10,false);parts.push({type:'ring',x:cx,y:cy,life:0,max:.45});

  if(tiles&&tiles.length){for(const[c,r]of tiles)L.g[r][c]='p';L.tiles=buildTiles(L)}
  const spec=DEATH_Q[kind];say(spec&&rnd()<.65?pick(spec):pick(DEATH_Q.any),3.6);
}
function winLevel(){if(G.sim){G.simWin=true;return}G.state='exiting';G.exitT=0;SFX.win();loopsOff()}

/* ---------- scène d'ouverture : nuit d'orage, voleur, armoire, carton ---------- */
function cutFlash(v,thunder){G.flash=Math.max(G.flash,v);if(!G.sim)setTimeout(()=>SFX.thunder(thunder),thunder>1?120:600)}
function stepCut(dt){
  const C=G.cut,dg=domeGeom(L.dome),k=L.carton,A=L.armoire,th=C.thief,BD=L.backDoor;C.t+=dt;
  for(let i=0;i<C.flashes.length;i++)if(C.flashes[i]!==null&&C.t>=C.flashes[i]){C.flashes[i]=null;cutFlash(.75,.6)}
  if(C.blink>0)C.blink-=dt;
  const once=(key,cond,fn)=>{if(!C.ev[key]&&cond){C.ev[key]=1;fn()}};
  // le voleur
  th.t+=dt;
  if(th.state==='out'&&C.t>1.4){th.state='walk';th.t=0}
  if(th.state==='walk'){th.x-=200*dt;if(th.x<=A.x+58){th.x=A.x+58;th.state='open';th.t=0}}
  else if(th.state==='open'){A.door=Math.min(1,th.t*2.5);A.shake=Math.sin(th.t*30)*.03*Math.min(1,th.t*2);if(th.t>.9&&k.state==='hold'){k.state='fall';k.vx=-270;k.vy=-60;k.vr=-3;if(!G.sim)SFX.whistle()}if(th.t>1.5){th.state='oops';th.t=0;bubble(th.x,L.dome.floor-140,'!','#2a2420')}}
  else if(th.state==='oops'){A.shake*=.9;if(th.t>1.0){th.state='look';th.t=0}}
  else if(th.state==='look'){
    // il regarde la cloche, puis à droite, puis à gauche
    th.head=th.t<.7?1:th.t<1.3?-1:th.t<1.9?1:-1;th.f=-1;
    once('dots',th.t>.4,()=>bubble(th.x,L.dome.floor-140,'…','#2a2420'));
    if(th.t>2.5){th.state='sneak';th.t=0;th.head=1;bubble(th.x,L.dome.floor-140,'Ni vu, ni connu…','#2a2420')}}
  else if(th.state==='sneak'){
    th.x-=62*dt;th.f=-1;
    // coups d'œil par-dessus l'épaule
    const c=th.t%1.6;th.head=c>1.1&&c<1.45?-1:1;
    if(th.x<=BD.x+40){BD.open=Math.min(1,BD.open+dt*3)}
    if(th.x<=BD.x+4){th.state='exit';th.t=0;if(!G.sim)SFX.squeak()}}
  else if(th.state==='exit'){th.x-=50*dt;th.alpha=Math.max(0,1-th.t*2.2);if(th.t>.6){BD.open=Math.max(0,BD.open-dt*2.5)}if(th.t>1.1&&BD.open<=0){th.state='gone';th.t=0;if(!G.sim)SFX.land()}}
  else if(th.state==='gone'){}
  // le carton
  if(k.state==='fall'){k.vy+=2600*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.rot+=k.vr*dt;
    if(k.y+20>=dg.domeTop&&Math.abs(k.x-L.dome.x)<60){
      k.state='fly';k.vx=-160;k.vy=-300;k.vr=-6;L.dome.broken=true;if(!G.sim)SFX.crash();G.shake=18;
      for(let i=0;i<46;i++){const a=-Math.PI*rnd(),s=120+rnd()*380;parts.push({type:'glass',x:L.dome.x+(rnd()-.5)*50,y:dg.domeTop+30+rnd()*40,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:40,rot:rnd()*6,vr:(rnd()-.5)*20,sz:2+rnd()*5,floor:L.dome.floor-2})}
      C.ray='fly';P.vx=120;P.vy=-430;
    }else if(k.y+20>=L.dome.floor){k.y=L.dome.floor-20;k.state='rest'}}
  if(k.state==='fly'){k.vy+=2600*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.rot+=k.vr*dt;if(k.x<L.dome.x-120){k.x=L.dome.x-120;k.vx=-k.vx*.3}
    if(k.y+20>=L.dome.floor){k.y=L.dome.floor-20;k.state='rest';k.rot=-.1;if(!G.sim)SFX.land();G.shake=6}}
  // Raymond : immobile tant que le voleur est là, se réveille pendant sa fuite
  if(C.ray==='fly'){P.vy+=GRAV*dt;moveX(P,P.vx*dt);P.onGround=false;moveY(P,P.vy*dt);P.spin+=dt*13;
    if(P.onGround){C.ray='lie';C.lieT=0;P.vx=0;P.spin=Math.PI;if(!G.sim)SFX.land();puff(P.x+P.w/2,P.y+P.h,12,true)}}
  else if(C.ray==='lie'){C.lieT+=dt;
    const sneaking=th.state==='sneak'||th.state==='exit'||th.state==='gone';
    once('w1',sneaking&&th.t>1.2&&th.state==='sneak',()=>{cutFlash(.7,.7);C.blink=.15;P.sx=1.06;P.sy=.94});
    once('w2',(th.state==='sneak'&&th.t>3.3)||th.state==='exit'||th.state==='gone',()=>{cutFlash(.8,.85);C.blink=1.1;bubble(P.x+P.w/2,P.y-14,'Rrrou… ?','#6a5a48')});
    if(th.state==='gone'&&th.t>1.0)once('w3',true,()=>{cutFlash(1,1.2);jolt()});
  }
  else if(C.ray==='jolt'){C.jt+=dt;P.spin=Math.PI*(1+Math.min(1,C.jt/.35));if(C.jt>.35)P.spin=0;
    if(C.jt>1.0&&!C.b2){C.b2=1;bubble(P.x+P.w/2,P.y-14,'Tous aux abris !','#a8322d')}
    if(C.jt>2.6&&!C.b3){C.b3=1;P.facing=1;bubble(P.x+P.w/2,P.y-14,'Matricule 7413, au rapport !','#a8322d')}
    if(C.jt>4.4)endCut()}
}
function jolt(){const C=G.cut;if(!C)return;if(C.ray!=='lie'){C.ray='lie';P.spin=Math.PI}C.ray='jolt';C.jt=0;P.vy=-200;bubble(P.x+P.w/2,P.y-14,'Tir de barrage !','#a8322d')}
function endCut(){G.cut=null;G.cutSeen=true;P.spin=0;P.cp={x:L.spawn.x,y:L.spawn.y};say(L.def.start,5)}
function skipCut(){
  L.dome.broken=true;if(L.backDoor)L.backDoor.open=0;L.carton={x:L.dome.x-62,y:L.dome.floor-20,rot:-.1,state:'rest'};L.armoire.door=1;L.armoire.shake=0;
  P.x=L.dome.x+60-P.w/2;P.y=L.dome.floor-P.h;P.vx=P.vy=0;endCut();
}

/* ---------- mise à jour du jeu ---------- */
const TOMB_LINES=["Vasseur… Marguerite ? Ici ? Sous une pierre ? Elle a dix-neuf ans, je l'ai vue au bal du 14 Juillet.",
  "Garnier. Elle a épousé le fils Garnier. Et ces dates… 1989 ? Ça n'existe pas, 1989.",
  "Je ne comprends rien. Mais j'ai une lettre pour elle, et le règlement ne prévoit pas les tombes."];
function stepTomb(dt){
  const S2=G.tombSeq;S2.t+=dt;P.vx=0;P.vy=Math.min(MAXFALL,P.vy+GRAV*dt);P.onGround=false;moveY(P,P.vy*dt);
  const k=Math.floor(S2.t/4.2);
  if(k!==S2.i&&k<TOMB_LINES.length){S2.i=k;say(TOMB_LINES[k],4.1)}
  if(S2.t>4.2*TOMB_LINES.length+.3){G.tombSeq=null;G.quip=null;winLevel()}
}
function stepPlay(dt){
  if(G.tombSeq){stepTomb(dt);return}
  G.lt+=dt;
  for(const m of L.movers){
    const px=m.x,py=m.y;m.t+=dt;const span=Math.abs(m.a1-m.a0)||1;
    let u=(m.t*m.speed/span)%2;u=u>1?2-u:u;u=u*u*(3-2*u);
    if(m.axis==='h')m.x=m.a0+(m.a1-m.a0)*u;else m.y=m.a0+(m.a1-m.a0)*u;
    m.dx=m.x-px;m.dy=m.y-py;
  }
  const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
  // volants : trajets réguliers, toujours identiques
  for(const m of L.moths){
    m.t+=dt;const px=m.x;
    if(m.axis==='h'){m.x=m.cx+Math.sin(m.t*m.sp)*m.amp;m.y=m.cy+Math.sin(m.t*m.sp*2)*10}
    else{m.x=m.cx+Math.sin(m.t*m.sp*2)*8;m.y=m.cy+Math.sin(m.t*m.sp)*m.amp}
    m.dir=m.x>=px?1:-1;
    m.near=!P.dead&&!G.cut&&Math.hypot(pcx-m.x,pcy-m.y)<200;
  }
  for(const c of L.rats){
    c.t+=dt;c.vy=Math.min(MAXFALL,c.vy+GRAV*dt);
    if(c.kind==='rat'){
      // le rat voit le pigeon devant lui : il fonce

      const la=dir>0?K.x+K.w+34:K.x-34,cl=Math.floor(la/T);

}

function handleSelect(){

  if(pressed.has('right'))G.sel=s===20?21:s<20?Math.min(19,s+1):s;
  if(pressed.has('up'))G.sel=s>=20?(s===20?16:19):Math.max(0,s-4);
  if(pressed.has('down'))G.sel=s>=16&&s<20?(s%4<2?20:21):s<16?s+4:s;

    if(li===20){startIntro();return}
    if(li===21){G.state='intro';G.cards=ENDING;G.card=0;G.cardT=0;G.fade=1;G.cardsDone=()=>openSelect();setSong('s5-4');return}

}

  ctx.fillStyle='#2a2420';ctx.textAlign='center';ctx.font='18px '+F_DISP;ctx.fillText('COMMUNE DE VILLEMAREUIL',0,-26+sw);
  ctx.font='30px '+F_DISP;ctx.fillText('110e ANNIVERSAIRE DE LA BATAILLE DE VERDUN',0,12+sw);
  ctx.font='24px '+F_DISP;ctx.fillStyle='#a8322d';ctx.fillText('1916 – 2026',0,42+sw);
  ctx.strokeStyle='#4a3a2a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-380,-70+sw);ctx.lineTo(-420,-200);ctx.moveTo(380,-70+sw);ctx.lineTo(420,-200);ctx.stroke();
  ctx.restore();
}
function renderCards(t){
  const c=G.cards[G.card];const fl=.94+rnd()*.06;
  ctx.fillStyle='#0b0a0c';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.globalAlpha=fl*Math.min(1,G.cardT*2.2);
  ctx.strokeStyle='#d9cfb4';ctx.lineWidth=2;ctx.strokeRect(70,46,W-140,H-92);ctx.lineWidth=1;ctx.strokeRect(80,56,W-160,H-112);
  for(const[x,y,sx,sy]of[[80,56,1,1],[W-80,56,-1,1],[80,H-56,1,-1],[W-80,H-56,-1,-1]]){ctx.beginPath();ctx.moveTo(x,y+sy*30);ctx.quadraticCurveTo(x+sx*4,y+sy*4,x+sx*30,y);ctx.moveTo(x+sx*8,y+sy*18);ctx.arc(x+sx*14,y+sy*14,5,0,7);ctx.stroke()}
  ctx.fillStyle='#ece3cc';ctx.textAlign='center';
  if(c.pic==='finale'){ctx.restore();ctx.save();drawFinaleCard(G.cardT)}
  else if(c.pic==='tomb')drawTombCard(t);
  else if(c.pic==='banner')drawBannerCard(t);
  else{
    let y=c.pic?150:H/2-20;
    if(c.pic==='dome'){drawDome(ctx,W/2,250,.62,t);y=330}
    if(c.pic==='headless'){drawHeadlessCard(G.cardT);y=372}
    ctx.fillStyle='#ece3cc';
    if(c.title){ctx.font='34px '+F_DISP;ctx.fillText(c.title,W/2,c.pic?y:y-50);y+=c.pic?38:0}
    if(c.t){ctx.font='italic 25px '+F_BODY;const lines=wrap(ctx,c.t,680);const y0=c.pic?y:H/2-(lines.length-1)*17+(c.title?14:0);lines.forEach((l,k)=>ctx.fillText(l,W/2,y0+k*34))}
  }
  ctx.restore();
  if(c.pic!=='finale')for(let k=0;k<2;k++){if(rnd()<.3){ctx.fillStyle='rgba(230,220,200,'+(rnd()*.1)+')';ctx.fillRect(rnd()*W,0,1+rnd(),H)}}
  if(G.cardT>.8&&c.pic!=='finale'){ctx.font='italic 14px '+F_BODY;ctx.fillStyle='rgba(233,223,199,'+(.4+Math.sin(t*3)*.2)+')';ctx.textAlign='right';ctx.fillText('appuyer pour continuer · Échap pour passer',W-90,H-22)}
}
function handleCards(dt){
  G.cardT+=dt;
  if(pressed.has('esc')){finishCards();return}
  if((pressed.has('ok')||pressed.has('jump')||G.click)&&G.cardT>(G.cards[G.card].minT||.35)){G.card++;G.cardT=0;SFX.page();if(G.card>=G.cards.length)finishCards()}
}
function finishCards(){const f=G.cardsDone;G.cardsDone=null;f&&f()}
/* lettre de Lucien */
function tokens(text){return text.split(' ').map(w=>{const s=/^~.*~[.,]?$/.test(w);return{w:w.replace(/~/g,''),s}})}
function renderLetter(t){
  const LE=G.LE,def=LEVELS[LE.li],fx=def.letter.fx;
  ctx.fillStyle='#1a120c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.22;ctx.fillStyle=ctx.createPattern(paperC,'repeat');ctx.fillRect(0,0,W,H);ctx.restore();
  for(let k=0;k<12;k++){ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(0,k*48,W,2)}
  const gl=ctx.createRadialGradient(W*.45,H*.35,40,W*.45,H*.35,560);gl.addColorStop(0,'rgba(255,200,120,.22)');gl.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2-10,200);ctx.rotate(-.025);
  const pw=620,ph=280,verso=fx==='verso';
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(-pw/2+10,-ph/2+12,pw,ph);
  const pg=ctx.createRadialGradient(0,0,80,0,0,380);pg.addColorStop(0,verso?'#e2d5b2':'#eadfc2');pg.addColorStop(1,verso?'#bca878':'#c9b386');ctx.fillStyle=pg;
  ctx.beginPath();ctx.moveTo(-pw/2,-ph/2);for(let x=-pw/2;x<=pw/2;x+=15)ctx.lineTo(x,-ph/2+((x*13)%4)-1);ctx.lineTo(pw/2,ph/2);for(let x=pw/2;x>=-pw/2;x-=15)ctx.lineTo(x,ph/2+((x*7)%4)-1);ctx.closePath();ctx.fill();
  ctx.save();ctx.clip();ctx.globalAlpha=.35;ctx.fillStyle=ctx.createPattern(paperC,'repeat');ctx.fillRect(-pw/2,-ph/2,pw,ph);ctx.restore();
  if(verso){ctx.save();ctx.scale(-1,1);ctx.globalAlpha=.1;ctx.fillStyle='#2a2f5a';ctx.font='26px '+F_HAND;for(let k=0;k<5;k++)ctx.fillText('Marguerite, je t\'écris pour te dire',-pw/2+40,-ph/2+60+k*40);ctx.restore();
    ctx.fillStyle='rgba(60,60,70,.55)';ctx.font='italic 13px '+F_BODY;ctx.textAlign='right';ctx.fillText('(au dos, au crayon, à demi effacé par la pluie)',pw/2-30,ph/2-14);ctx.textAlign='left';
    ctx.fillStyle='rgba(90,110,140,.12)';for(let k=0;k<7;k++){ctx.beginPath();ctx.ellipse(-pw/2+60+k*80,-ph/2+40+((k*53)%180),18,30,0,0,7);ctx.fill()}}
  ctx.strokeStyle='rgba(120,90,50,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-ph/2);ctx.lineTo(0,ph/2);ctx.moveTo(-pw/2,0);ctx.lineTo(pw/2,0);ctx.stroke();
  ctx.strokeStyle='rgba(60,70,120,.12)';ctx.lineWidth=1;for(let y=-ph/2+70;y<ph/2-20;y+=40){ctx.beginPath();ctx.moveTo(-pw/2+30,y);ctx.lineTo(pw/2-30,y);ctx.stroke()}
  const ink=verso?'#4a4a56':'#2a2f5a';
  ctx.fillStyle=ink;ctx.strokeStyle=ink;ctx.textAlign='left';
  let y=-ph/2+52;
  const head=def.letter.date||'';
  ctx.font='26px '+F_HAND;
  let budget=Math.floor(LE.chars);
  if(head){ctx.textAlign='right';ctx.fillText(head.slice(0,budget),pw/2-40,y);budget-=head.length;ctx.textAlign='left';y+=44}
  const toks=tokens((LE.li===0?'':'… ')+def.letter.text);
  ctx.font='29px '+F_HAND;
  let x=-pw/2+44,ci=0;const maxX=pw/2-40,sp=ctx.measureText(' ').width;
  for(const tk of toks){
    if(budget<=0)break;
    const full=ctx.measureText(tk.w).width;
    if(x+full>maxX){x=-pw/2+44;y+=40}
    const s=tk.w.slice(0,Math.max(0,budget));
    if(fx==='shaky'){let xx=x;for(const ch of s){const j=Math.sin(ci*7.3+t*14)*1.6;ctx.fillText(ch,xx+j*.5,y+j);xx+=ctx.measureText(ch).width;ci++}}
    else ctx.fillText(s,x,y);
    if(tk.s&&budget>=tk.w.length){ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-2,y-9);ctx.lineTo(x+full+2,y-11);ctx.moveTo(x-1,y-6);ctx.lineTo(x+full+1,y-8);ctx.stroke()}
    budget-=tk.w.length+1;x+=full+sp;
  }
  if(fx==='blot'&&LE.done){ctx.fillStyle='rgba(42,47,90,.5)';ctx.beginPath();for(let k=0;k<=20;k++){const a=k/20*Math.PI*2,r=26+Math.sin(k*3.7)*7;ctx.lineTo(70+Math.cos(a)*r,-30+Math.sin(a)*r*.8)}ctx.fill();ctx.fillStyle='rgba(42,47,90,.18)';ctx.beginPath();ctx.arc(70,-30,48,0,7);ctx.fill()}
  ctx.restore();
  if(LE.done){
    const a=Math.min(1,LE.after*1.6);
    ctx.save();ctx.globalAlpha=a;
    drawRaymond(ctx,128,H-44,{f:1,t,walk:0,wear:wear(),size:1.6});
    ctx.font='italic 20px '+F_BODY;ctx.fillStyle='#ece3cc';ctx.textAlign='left';
    if(def.letter.silent){ctx.fillStyle='rgba(233,223,199,.55)';ctx.fillText('Raymond ne dit rien.',190,H-115)}
    else{const lines=wrap(ctx,def.letter.comment,620);lines.forEach((l,k)=>ctx.fillText(l,190,H-140+k*25))}
    ctx.font='14px '+F_DISP;ctx.fillStyle='#d9a441';
    ctx.fillText(`PAILLE RAMASSÉE ${LE.corn} / ${LE.cornTotal}   ·   MÉDAILLE ${LE.medal?'TROUVÉE':'NON TROUVÉE'}   ·   CHUTES : ${LE.deaths}`,190,H-36);
    if(LE.after>.8){ctx.font='italic 15px '+F_BODY;ctx.fillStyle='rgba(233,223,199,'+(.45+Math.sin(t*3)*.2)+')';ctx.textAlign='right';ctx.fillText('appuyer pour continuer ▸',W-24,H-12)}
    ctx.restore();
  }else{
    ctx.font='italic 15px '+F_BODY;ctx.fillStyle='rgba(233,223,199,.45)';ctx.textAlign='right';ctx.fillText('Raymond lit le courrier. Ce n\'est pas réglementaire.',W-24,H-16);
  }
}
function handleLetter(dt){
  const LE=G.LE,def=LEVELS[LE.li];
  const total=(def.letter.date||'').length+tokens((LE.li===0?'':'… ')+def.letter.text).reduce((s,t)=>s+t.w.length+1,0);
  const go=pressed.has('ok')||pressed.has('jump')||G.click;
  if(!LE.done){const before=Math.floor(LE.chars);LE.chars+=dt*30;if(Math.floor(LE.chars)!==before&&Math.floor(LE.chars)%3===0)noise(.03,2600,.04,'highpass');if(go)LE.chars=total;if(LE.chars>=total){LE.done=true;LE.after=0}}
  else{LE.after+=dt;if(go&&LE.after>.5)afterLetter(LE.li)}
}
function afterLetter(li){
  G.cutSeen=true;
  if(li===19){S.finished=true;save();G.state='intro';G.cards=ENDING;G.card=0;G.cardT=0;G.fade=1;G.cardsDone=()=>goTitle();setSong('s5-4');return}
  if(li%4===3){
    const w=LEVELS[li].w;
    const cards=WORLD_CARDS[w+1].slice();
    G.state='intro';G.cards=cards;G.card=0;G.cardT=0;G.fade=1;G.cardsDone=()=>startLevel(li+1);setSong('title');return;
  }
  startLevel(li+1);
}

/* =========================================================
   ENTRÉES ET BOUCLE PRINCIPALE
   ========================================================= */
const keys=new Set(),pressed=new Set();
const KMAP={ArrowLeft:['left'],KeyA:['left'],ArrowRight:['right'],KeyD:['right'],ArrowUp:['jump','up'],KeyW:['jump','up'],KeyZ:['jump','up'],Space:['jump','ok'],ArrowDown:['down'],KeyS:['down'],Enter:['ok'],NumpadEnter:['ok'],Escape:['esc'],KeyP:['esc'],Backspace:['back']};
addEventListener('keydown',e=>{
  ensureAudio();
  const a=KMAP[e.code];
  if(a){for(const k of a){if(!keys.has(k))pressed.add(k);keys.add(k)}e.preventDefault()}
  const k=(e.key||'').toLowerCase();
  if(!e.repeat){if(k==='m')toggleMute();if(k==='r')pressed.add('restart')}
});
addEventListener('keyup',e=>{const a=KMAP[e.code];if(a)for(const k of a)keys.delete(k)});
addEventListener('blur',()=>keys.clear());
function toLogical(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-offX)/scale,y:(ev.clientY-r.top-offY)/scale}}
cv.addEventListener('pointerdown',e=>{ensureAudio();cv.focus();G.click=toLogical(e)});
function bindTouch(id,act){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();ensureAudio();if(!keys.has(act))pressed.add(act);keys.add(act);el.classList.add('down');if(act==='jump')pressed.add('ok')};
  const off=e=>{e.preventDefault();keys.delete(act);el.classList.remove('down')};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bindTouch('tl','left');bindTouch('tr','right');bindTouch('tj','jump');
document.getElementById('tp').addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();pressed.add('esc')});
let touchUI=false;
function showTouch(){if(touchUI)return;touchUI=true;for(const id of['tl','tr','tj','tp'])document.getElementById(id).classList.add('on')}
if(matchMedia('(pointer: coarse)').matches)showTouch();
addEventListener('touchstart',showTouch,{passive:true});

let last=performance.now(),acc=0;
const STEP=1/120;
function update(dt){
  G.t+=dt;
  if(G.fade>0)G.fade=Math.max(0,G.fade-dt*2.2);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  if(G.quip){G.quip.t+=dt;if(G.quip.t>G.quip.dur)G.quip=null}
  if(G.state!=='play')loopsOff();
  switch(G.state){
    case'title':handleMenu();break;
    case'pause':if(pressed.has('esc')){G.state='play';break}handleMenu();break;
    case'select':handleSelect();break;
    case'intro':handleCards(dt);break;
    case'levelend':handleLetter(dt);break;
    case'play':{
      if(pressed.has('esc')){G.state='pause';G.menuSel=0;break}
      if(G.cut&&(pressed.has('ok')||pressed.has('restart')||G.click)&&G.cut.t>1)skipCut();
      if(pressed.has('restart')&&!P.dead&&!G.cut){resetPlayer();P.wake=.3;respawnChaserOnly()}
      if(pressed.has('jump')&&!G.cut)P.jumpBuf=.12;
      acc+=dt;let n=0;while(acc>=STEP&&n<12){stepPlay(STEP);acc-=STEP;n++;if(G.state!=='play')break}
      if(acc>STEP)acc=0;
      if(G.state==='play'){animalSounds(dt);updateCamera(dt)}
      updateParticles(dt);
      if(G.tickSnd){G.tickSnd=false;SFX.tick()}
      break}
    case'exiting':{
      G.exitT+=dt;updateParticles(dt);
      if(G.exitT>1.1){
        const li=G.li;S.unlocked=Math.min(19,Math.max(S.unlocked,li+1));
        if(G.medal)S.run.medals[li]=true;
        const b=S.best[li]||{corn:0,medal:false,deaths:9999};S.best[li]={corn:Math.max(b.corn,G.corn),medal:b.medal||G.medal,deaths:Math.min(b.deaths,G.levelDeaths)};save();
        G.LE={li,chars:0,done:false,after:0,corn:G.corn,cornTotal:G.cornTotal,medal:G.medal,deaths:G.levelDeaths};G.state='levelend';G.fade=1;SFX.page();setSong('title');
      }
      break}
  }
  pressed.clear();G.click=null;
}
function respawnChaserOnly(){const K=L.chaser;if(!K)return;if(K.type==='cat'||P.cp.x<L.triggerX){K.state='sleep';K.x=K.home.x;K.y=K.home.y;K.vx=K.vy=0;G.chase=false;setSong(songKey(G.li))}else{K.x=P.x-460;K.y=P.y-220}}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b0a0c';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  const t=G.t;
  switch(G.state){
    case'loading':ctx.fillStyle='#110e14';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(233,223,199,.6)';ctx.font='italic 20px Georgia, serif';ctx.textAlign='center';ctx.fillText('On rembourre Raymond…',W/2,H/2);break;
    case'title':renderTitle(t);renderGrain();break;
    case'select':renderSelect(t);renderGrain();break;
    case'intro':renderCards(t);renderGrain();break;
    case'levelend':renderLetter(t);renderGrain();break;
    case'play':case'pause':case'exiting':{
      const sx=(rnd()-.5)*G.shake,sy=(rnd()-.5)*G.shake;
      const cx=Math.round(cam.x+sx),cy=Math.round(cam.y+sy);
      renderWorld(L,cx,cy,t);
      const extra=[{x:P.x+P.w/2,y:P.y+P.h/2,r:190,i:.8}];
      for(const cp of L.cps)if(cp.on)extra.push({x:cp.x,y:cp.y-46,r:150,i:.75,warm:1,flick:1});
      if(L.exit)extra.push({x:L.exit.x+26,y:L.exit.y+40,r:230,i:1,warm:L.def.exit==='door'||L.def.exit==='bunker'?1:0});
      if(L.medal&&!L.medal.taken)extra.push({x:L.medal.x,y:L.medal.y,r:70,i:.5});
      if(L.dome)extra.push({x:L.dome.x,y:L.dome.floor-90,r:170,i:.7,warm:1});
      if(G.cut&&G.cut.thief.state!=='out'&&G.cut.thief.state!=='gone')extra.push({x:G.cut.thief.x-40,y:L.dome.floor-60,r:200,i:.85,warm:1});
      for(const b of L.bolts)if(b.state==='strike')extra.push({x:b.x,y:13*T-60,r:260,i:1});
      renderLighting(L,cx,cy,t,extra);
      renderWeather(L.th,cx,t);
      drawForeground(cx,L.def.seed,L.th);
      renderGrain();
      if(!G.cut)renderHUD();else drawQuip(66);
      if(G.cut){ctx.fillStyle='rgba(0,0,0,.88)';ctx.fillRect(0,0,W,46);ctx.fillRect(0,H-46,W,46);if(G.cut.t>1){ctx.font='italic 14px '+F_BODY;ctx.fillStyle='rgba(233,223,199,.45)';ctx.textAlign='right';ctx.fillText('appuyer pour passer',W-20,H-18)}}
      if(G.state==='pause'){ctx.fillStyle='rgba(10,8,14,.74)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#efe5cc';ctx.font='44px '+F_DISP;ctx.textAlign='center';ctx.fillText('Pause',W/2,140);ctx.font='italic 17px '+F_BODY;ctx.fillStyle='rgba(233,223,199,.6)';ctx.fillText('Raymond en profite pour se gratter. Il ne sent rien.',W/2,172);drawMenu(W/2,236,48)}
      if(G.state==='exiting'){ctx.fillStyle='rgba(11,10,12,'+Math.min(1,G.exitT/1.1)+')';ctx.fillRect(0,0,W,H)}
      break}
  }
  if(G.fade>0){ctx.fillStyle='rgba(11,10,12,'+G.fade+')';ctx.fillRect(0,0,W,H)}
  ctx.restore();
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{update(dt);render()}catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
async function boot(){
  try{await Promise.race([Promise.all([document.fonts.load('30px "IM Fell English SC"'),document.fonts.load('italic 20px "IM Fell English"'),document.fonts.load('20px "IM Fell English"'),document.fonts.load('30px "La Belle Aurore"')]),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  ensureTitleLv();G.state='title';G.fade=1;setSong('title');
}
window.__apl={G,P,S,startLevel,stepPlay,get L(){return L},keys,pressed,cam,compileSong,LEVELS};
boot();requestAnimationFrame(frame);
