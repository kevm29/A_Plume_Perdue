<title>À Plume Perdue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Diorama de papier découpé, éclairé à la bougie : un seul univers sombre, couleurs explicites */
:root{
  --nuit:#110e14;
  --papier:#e9dfc7;
  --paille:#d9a441;
  --cire:#a8322d;
  --encre:#2a2f5a;
  --f-titre:"IM Fell English SC", Georgia, serif;
  --f-texte:"IM Fell English", Georgia, serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--nuit);color:var(--papier);overflow:hidden}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;display:block;outline:none}
.tc{position:fixed;display:none;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(233,223,199,.13);border:2px solid rgba(233,223,199,.35);
  color:var(--papier);font:24px/1 var(--f-titre);touch-action:none}
.tc.on{display:flex}
.tc:active,.tc.down{background:rgba(217,164,65,.35)}
#tl{left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:68px;height:68px}
#tr{left:calc(100px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:68px;height:68px}
#tj{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:86px;height:86px;font-size:15px}
#tp{right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));width:44px;height:44px;font-size:16px}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
  background:var(--nuit);font:22px/1.4 var(--f-texte);font-style:italic;padding-inline:max(16px,env(safe-area-inset-left,0px))}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>

<canvas id="c" tabindex="0" aria-label="À Plume Perdue, jeu de plateforme"></canvas>
<div class="tc" id="tl" aria-label="Gauche">◀</div>

<script>
'use strict';
/* =========================================================
   À PLUME PERDUE — Monde 1 : Le Musée en déménagement
   ========================================================= */
const W=960,H=540,T=40,ROWS=15,DX=10,DY=-8,PAD=24;
const PF_FAR=0.3,PF_MID=0.6;
const F_DISP='"IM Fell English SC", "Iowan Old Style", Georgia, serif';
const F_BODY='"IM Fell English", "Iowan Old Style", Georgia, serif';
const F_HAND='"La Belle Aurore", "Segoe Script", "Bradley Hand", cursive';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let dpr=1,scale=1,offX=0,offY=0,RS=1;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const w=innerWidth,h=innerHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cv.style.width=w+'px';cv.style.height=h+'px';
  scale=Math.min(w/W,h/H);offX=(w-W*scale)/2;offY=(h-H*scale)/2;
}
addEventListener('resize',resize);resize();

/* ---------- utilitaires ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=Math.random;
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function shade(h,a){let[r,g,b]=hexRgb(h);if(a<0){r*=1+a;g*=1+a;b*=1+a}else{r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a}return`rgb(${r|0},${g|0},${b|0})`}
function rgba(h,a){const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function poly(g,pts){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath()}
function wrap(g,text,maxW){const out=[];for(const para of text.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line)}return out}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function makeNoise(size,alpha,seed,fibers){
  const c=mk(size,size),g=c.getContext('2d'),id=g.createImageData(size,size),R=mulberry(seed);
  for(let i=0;i<id.data.length;i+=4){const v=R()*255|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=R()*alpha|0}
  g.putImageData(id,0,0);
  if(fibers){g.lineWidth=.6;for(let i=0;i<fibers;i++){g.strokeStyle=R()<.5?'rgba(0,0,0,.10)':'rgba(255,255,255,.10)';g.beginPath();const x=R()*size,y=R()*size;g.moveTo(x,y);g.quadraticCurveTo(x+(R()-.5)*14,y+(R()-.5)*14,x+(R()-.5)*26,y+(R()-.5)*26);g.stroke()}}
  return c;
}
const grainC=makeNoise(256,34,7,0);
const paperC=makeNoise(160,46,3,60);
let grainPat=null;

/* ---------- sauvegarde ---------- */
const SAVE_KEY='a-plume-perdue-v1';
let S={unlocked:0,best:{},muted:false,deaths:0};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* =========================================================
   AUDIO — un morceau par lieu, avec variations et silences
   ========================================================= */
let AC=null,master,mGain,sGain,noiseBuf,tick=0,nextTick=0,loopN=0,CUR=null,curName='';
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midi(n){const m=/([A-G])([#b]?)(\d)/.exec(n);return 12*(+m[3]+1)+NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const CHORDS={Am:[57,60,64],Dm:[50,53,57],E:[52,56,59],F:[53,57,60],C:[48,52,55],G:[55,59,62],A:[57,61,64],Gm:[55,58,62],Bb:[58,62,65],Ab:[56,60,63],Eb:[51,55,58],Fm:[53,56,60],Em:[52,55,59],B:[59,63,66],D:[50,54,57]};
const SONGS={
  // berceuse de boîte à musique, pour les menus et les lettres
  title:{tempo:78,bpb:3,lead:['box'],bass:'soft',gap:3,
    prog:'Am Dm E Am Am C G C Dm Am E E Am E Am Am',
    mel:'A4:1 C5:1 E5:1 D5:2 C5:1 B4:1 G#4:1 B4:1 A4:3 C5:1 E5:1 A5:1 G5:2 F5:1 E5:1 D5:1 B4:1 C5:3 F5:1 E5:1 D5:1 C5:1 B4:1 A4:1 G#4:1 B4:1 E5:1 D5:2 r:1 C5:1 B4:1 A4:1 B4:1 G#4:1 E4:1 A4:3 r:3'},
  // valse musette : boîte à musique puis accordéon
  vitrine:{tempo:124,bpb:3,lead:['box','accord'],bass:'waltz',gap:2,
    prog:'Am Am Dm E Am F E Am C G Am E F Dm E Am',
    mel:'E5:1.5 D5:.5 C5:1 B4:1 C5:1 A4:1 F5:1.5 E5:.5 D5:1 B4:2 G#4:1 A4:1 C5:1 E5:1 F5:1 E5:1 C5:1 D5:1.5 B4:.5 G#4:1 A4:3 G5:1.5 E5:.5 C5:1 D5:1 B4:1 G4:1 C5:1.5 B4:.5 A4:1 G#4:1 B4:1 E5:1 A5:1.5 G5:.5 F5:1 E5:1 D5:1 F5:1 E5:1 D5:1 B4:1 A4:3'},
  // menuet de clavecin poussiéreux
  insectes:{tempo:100,bpb:3,lead:['harpsi','box'],bass:'alberti',gap:2,
    prog:'Dm A Dm A Gm Dm A Dm F C Dm A Bb Gm A Dm',
    mel:'D5:1 F5:.5 E5:.5 D5:1 C#5:1 E5:1 A4:1 F5:1 A5:.5 G5:.5 F5:1 E5:2 r:1 Bb4:1 D5:1 G5:1 F5:1 E5:.5 D5:.5 A4:1 E5:1 C#5:1 A4:1 D5:2 r:1 A5:1 G5:.5 F5:.5 C5:1 E5:1 G5:1 C5:1 F5:.5 E5:.5 D5:1 A4:1 C#5:2 E5:1 D5:1 F5:1 Bb5:1 G5:1 F5:.5 E5:.5 D5:1 C#5:1 E5:1 C#5:1 D5:3'},
  // marche pompeuse de fanfare municipale
  mammouth:{tempo:92,bpb:4,lead:['clar','box'],bass:'oompah',gap:2,
    prog:'C G C G F C G C Ab Eb Fm G C F G C',
    mel:'C5:1.5 G4:.5 C5:1 E5:1 D5:2 B4:2 E5:1.5 D5:.5 C5:1 G5:1 G5:3 r:1 A5:1.5 G5:.5 F5:1 C5:1 E5:1.5 D5:.5 C5:1 G4:1 B4:1 D5:1 G5:1 F5:1 E5:2 C5:2 Eb5:1.5 C5:.5 Ab4:2 G5:1.5 Eb5:.5 Bb4:2 Ab5:1 G5:1 F5:1 Eb5:1 D5:2 G4:2 C5:1 E5:1 G5:1 C6:1 A5:2 F5:2 G5:1 F5:1 D5:1 B4:1 C5:3 r:1'},
  // pizzicati sur la pointe des pattes
  loge:{tempo:108,bpb:4,lead:['pizz','harpsi'],bass:'walk',gap:2,
    prog:'Em Em Am B Em C Am Em Em Am D B Em Am B Em',
    mel:'E4:.5 r:.5 G4:.5 r:.5 A4:.5 r:.5 B4:1 r:.5 C5:.5 B4:.5 r:.5 A4:1 r:1 A4:.5 r:.5 C5:.5 r:.5 D5:.5 r:.5 E5:1 D#5:.5 E5:.5 F#5:.5 r:.5 B4:2 E5:.5 r:.5 D5:.5 r:.5 B4:.5 r:.5 G4:1 r:.5 E4:.5 G4:.5 C5:.5 B4:2 A4:.5 C5:.5 r:.5 A4:.5 B4:.5 D#5:.5 r:.5 F#4:.5 E4:2 r:2 E5:.5 r:.5 G5:.5 r:.5 A5:.5 r:.5 B5:1 r:.5 C6:.5 B5:.5 r:.5 A5:1 r:1 F#5:.5 r:.5 A5:.5 r:.5 G5:.5 F#5:.5 E5:1 D#5:.5 r:.5 B4:.5 r:.5 D#5:1 r:1 E5:.5 G5:.5 B5:.5 G5:.5 E5:.5 r:.5 B4:1 C5:.5 r:.5 A4:.5 r:.5 F#4:.5 r:.5 D#4:1 E4:.5 r:.5 B3:.5 r:.5 E4:1 r:1 r:4'},
  // galop de poursuite
  chase:{tempo:172,bpb:4,lead:['box','harpsi'],bass:'gallop',gap:0,
    prog:'Em B Em B Am Em B Em',
    mel:'E5:.5 B4:.5 E5:.5 G5:.5 B5:1 G5:1 F#5:.5 D#5:.5 F#5:.5 A5:.5 B5:1 F#5:1 G5:.5 F#5:.5 E5:.5 D5:.5 E5:.5 G5:.5 B5:1 A5:.5 G5:.5 F#5:.5 E5:.5 D#5:2 C6:.5 B5:.5 A5:.5 E5:.5 C5:1 E5:1 B5:.5 A5:.5 G5:.5 E5:.5 B4:1 E5:1 F#5:.5 G5:.5 A5:.5 F#5:.5 D#5:.5 F#5:.5 B4:1 E5:2 r:2'}
};
const COMPILED={};
for(const k in SONGS){const s=SONGS[k],prog=s.prog.split(' '),melT={};let tk=0;
  for(const tok of s.mel.trim().split(/\s+/)){const[n,b]=tok.split(':');if(n!=='r')melT[tk]={m:midi(n),d:+b};tk+=Math.round(+b*2)}
  COMPILED[k]=Object.assign({},s,{prog,melT,melLen:tk,len:(prog.length+s.gap)*s.bpb*2})}
function voice(ch){return ch.map(m=>{while(m<55)m+=12;while(m>67)m-=12;return m}).sort((a,b)=>a-b)}
function setSong(name){if(curName===name)return;curName=name;CUR=COMPILED[name];tick=0;loopN=0;if(AC)nextTick=AC.currentTime+.08}
function ensureAudio(){
  try{
    if(!AC){
      AC=new(window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=S.muted?0:.9;master.connect(AC.destination);
      mGain=AC.createGain();mGain.gain.value=.11;mGain.connect(master);
      sGain=AC.createGain();sGain.gain.value=.5;sGain.connect(master);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      nextTick=AC.currentTime+.1;setInterval(sched,50);
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
function env(g,t,v,a,hold,rel){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);if(hold)g.gain.setValueAtTime(v,t+a+hold);g.gain.exponentialRampToValueAtTime(.0008,t+a+(hold||0)+rel)}
function osc(type,f,t,stop,dest,gain){const o=AC.createOscillator();o.type=type;o.frequency.value=f;if(gain!=null){const g=AC.createGain();g.gain.value=gain;o.connect(g);g.connect(dest)}else o.connect(dest);o.start(t);o.stop(stop);return o}
function accordion(t,ms,dur,vol){
  const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1000;g.connect(lp);lp.connect(mGain);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.03);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.linearRampToValueAtTime(.0001,t+dur*.95);
  for(const m of ms)for(const det of[-7,7]){const o=osc('sawtooth',mtof(m),t,t+dur,g);o.detune.value=det}
}
const INST={
  box(t,m,dur,v){const g=AC.createGain();g.connect(mGain);env(g,t,v||.55,.006,0,Math.max(.7,dur*1.4));osc('sine',mtof(m),t,t+2.4,g);osc('sine',mtof(m)*4.007,t,t+2.4,g,.1)},
  accord(t,m,dur){accordion(t,[m-12],dur*.95,.11)},
  harpsi(t,m,dur,v){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;g.connect(lp);lp.connect(mGain);env(g,t,v||.28,.003,0,.45+dur*.25);osc('triangle',mtof(m),t,t+1.4,g);osc('square',mtof(m)*2,t,t+1.4,g,.1)},
  clar(t,m,dur,v){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;g.connect(lp);lp.connect(mGain);env(g,t,v||.16,.04,Math.max(.01,dur*.8),.08);const o=osc('square',mtof(m),t,t+dur+.2,g);const lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=5;lg.gain.value=4;lf.connect(lg);lg.connect(o.frequency);lf.start(t);lf.stop(t+dur+.2)},
  pizz(t,m,dur,v){const g=AC.createGain();g.connect(mGain);env(g,t,v||.42,.003,0,.22);const o=osc('triangle',mtof(m),t,t+.4,g);o.frequency.setValueAtTime(mtof(m)*1.01,t);o.frequency.exponentialRampToValueAtTime(mtof(m),t+.05)},
  tuba(t,m,dur,v){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;g.connect(lp);lp.connect(mGain);env(g,t,v||.32,.02,dur*.5,.1);osc('square',mtof(m),t,t+dur+.2,g)},
  organ(t,ms,dur,v){const g=AC.createGain();g.connect(mGain);env(g,t,v||.05,.02,dur*.6,.1);for(const m of ms){osc('sine',mtof(m),t,t+dur+.2,g);osc('sine',mtof(m)*2,t,t+dur+.2,g,.35)}}
};
function playTick(s,tk,t,spb){
  const tpb=s.bpb*2,bar=Math.floor(tk/tpb),bt=tk%tpb;
  if(bar>=s.prog.length)return;
  const lead=s.lead[loopN%s.lead.length];
  const e=s.melT[tk];if(e)INST[lead](t,e.m,e.d*spb);
  const ch=CHORDS[s.prog[bar]],v=voice(ch),root=ch[0];
  switch(s.bass){
    case'soft':if(bt===0)INST.box(t,root-12,spb*3,.22);break;
    case'waltz':if(bt===0)accordion(t,[root-12],spb*.9,.14);else if(bt%2===0)accordion(t,v,spb*.55,.04);break;
    case'alberti':{const p=[v[0],v[2],v[1],v[2]];INST.harpsi(t,p[bt%4]-12,spb*.5,.12);break}
    case'oompah':if(bt===0)INST.tuba(t,root-12,spb*.7);else if(bt===4)INST.tuba(t,ch[2]-12,spb*.7);else if(bt===2||bt===6)INST.organ(t,v,spb*.4,.045);break;
    case'walk':if(bt%2===0){const p=[root-12,ch[2]-12,root,ch[2]-12];INST.pizz(t,p[(bt/2)%4],spb*.4,.3)}break;
    case'gallop':INST.tuba(t,bt%2===0?root-12:root,spb*.25,.2);if(bt===2||bt===6)INST.organ(t,v,spb*.3,.04);break;
  }
}
function sched(){
  if(!AC||!CUR)return;
  const spb=60/CUR.tempo;
  while(nextTick<AC.currentTime+.2){
    if(!S.muted)playTick(CUR,tick,nextTick,spb);
    nextTick+=spb/2;tick++;if(tick>=CUR.len){tick=0;loopN++}
  }
}
function tone(f,d,type,v,f2,delay){
  if(!AC||S.muted)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(sGain);o.start(t);o.stop(t+d+.03);
}
function noise(d,freq,v,type,delay,q){
  if(!AC||S.muted)return;const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q||1;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(sGain);s.start(t,rnd()*1.5);s.stop(t+d+.05);
}
/* miaulement par formants : « mi » qui monte, « aou » qui retombe */
function meow(v,low){
  if(!AC||S.muted)return;const t=AC.currentTime;v=v||1;
  const f0=(low?300:430)+rnd()*90,d=.62+rnd()*.25;
  const o=AC.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*1.55,t+d*.28);o.frequency.linearRampToValueAtTime(f0*1.3,t+d*.6);o.frequency.linearRampToValueAtTime(f0*.78,t+d);
  const vb=AC.createOscillator(),vg=AC.createGain();vb.frequency.value=6.5;vg.gain.value=14;vb.connect(vg);vg.connect(o.frequency);
  const f1=AC.createBiquadFilter();f1.type='bandpass';f1.Q.value=5;f1.frequency.setValueAtTime(650,t);f1.frequency.linearRampToValueAtTime(1700,t+d*.3);f1.frequency.linearRampToValueAtTime(800,t+d);
  const f2=AC.createBiquadFilter();f2.type='bandpass';f2.Q.value=7;f2.frequency.setValueAtTime(2500,t);f2.frequency.linearRampToValueAtTime(2900,t+d*.3);f2.frequency.linearRampToValueAtTime(1100,t+d);
  const g=AC.createGain(),g2=AC.createGain();g2.gain.value=.45;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.9*v,t+.07);g.gain.setValueAtTime(.9*v,t+d*.65);g.gain.exponentialRampToValueAtTime(.001,t+d+.08);
  o.connect(f1);o.connect(f2);f1.connect(g);f2.connect(g2);g2.connect(g);g.connect(sGain);
  o.start(t);vb.start(t);o.stop(t+d+.12);vb.stop(t+d+.12);
}
let purr=null;
function purrStart(){
  if(!AC||purr)return;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;

/* ---------- analyse d'un niveau ---------- */
function parseLevel(i){
  const def=LEVELS[i];
  const rows=Array.from({length:ROWS},()=>'');
  for(const seg of def.segs){
    const lines=seg.split('\n').map(s=>s.trim()).filter(s=>s.length);
    const w=Math.max(...lines.map(l=>l.length));
    const pad=ROWS-lines.length;
    for(let r=0;r<ROWS;r++){const l=r<pad?'':lines[r-pad];rows[r]+=l.padEnd(w,'.')}
  }
  const wT=rows[0].length;
  const g=rows.map(r=>r.split(''));
  for(let r=0;r<ROWS;r++){g[r][0]='W';g[r][wT-1]='W'}
  const L={def,i,w:wT,wpx:wT*T,g,th:THEMES[def.theme],corn:[],medal:null,cps:[],exit:null,rats:[],moths:[],movers:[],hints:[],quips:[],decor:[],lights:[],mark:new Set(),chaser:null,triggerX:Infinity,spawn:null,dome:null,avoid:[]};
  let hi=0,qi=0,si=0;
  const movers=[];
  for(let c=0;c<wT;c++)for(let r=0;r<ROWS;r++){
    const ch=g[r][c],x=c*T,y=r*T,cx=x+T/2,cy=y+T/2;
    let clear=true;
    switch(ch){
      case'S':L.spawn={x:cx,y:y+T};L.avoid.push(cx);break;
      case'o':L.corn.push({x:cx,y:cy,taken:false,ph:c*.7+r});break;
      case'*':L.medal={x:cx,y:cy,taken:false};break;
      case'C':L.cps.push({x:cx,y:y+T,on:false});L.avoid.push(cx);break;
      case'E':L.exit={x:x-6,y:y-T,w:T+12,h:2*T};L.avoid.push(cx,cx+60,cx-60);break;
      case'k':L.rats.push({x:cx-15,y:y+T-16,w:30,h:16,vx:95,vy:0,onGround:false,t:rnd()*9,sq:1+rnd()*2});break;
      case'm':L.moths.push({cx,cy,axis:'h',amp:90,t:rnd()*6,x:cx,y:cy,ox:0,oy:0,fl:0});break;
      case'n':L.moths.push({cx,cy,axis:'v',amp:70,t:rnd()*6,x:cx,y:cy,ox:0,oy:0,fl:0});break;
      case'M':movers.push({c,r,axis:'h'});break;
      case'V':movers.push({c,r,axis:'v'});break;
      case'T':L.triggerX=x;break;
      case'K':L.chaser={home:{x:cx-22,y:y+T-26},x:cx-22,y:y+T-26,w:44,h:26,vx:0,vy:0,state:'sleep',wakeT:0,onGround:true,t:0,f:1,meowT:2,rrT:0};L.avoid.push(cx);break;
      case'h':L.hints.push({x:cx,y:y+T,i:hi++});L.avoid.push(cx);break;
      case'q':L.quips.push({x:cx,i:qi++,fired:false});break;
      case'l':L.decor.push({t:'lamp',x:cx,y:cy});L.lights.push({x:cx,y:cy+14,r:250,i:.95,warm:1});break;
      case'g':L.decor.push({t:'sign',x:cx,y:cy,text:def.signs[si++]||''});break;
      case'u':L.dome={x:cx,floor:y+2*T};L.avoid.push(cx,cx-60,cx+60);break;
      case'w':L.decor.push({t:'mammoth',x:cx,y:cy});L.avoid.push(cx,cx-200,cx-100,cx+100,cx+200);break;
      case'c':L.decor.push({t:'clock',x:cx,y:cy});break;
      case'y':L.decor.push({t:'stove',x:cx,y:y+2*T});L.lights.push({x:cx,y:y+2*T-40,r:170,i:.8,warm:2});L.avoid.push(cx);break;
      case'b':L.decor.push({t:'bowl',x:cx,y:y+T});L.avoid.push(cx);break;
      case'|':L.mark.add(c+','+r);break;
      default:clear=false;
    }
    if(clear)g[r][c]='.';
  }
  for(const m of movers){
    if(m.axis==='h'){
      let a=m.c-3,b=m.c+3;
      for(let c=m.c-1;c>=0;c--)if(L.mark.has(c+','+m.r)){a=c+1;break}
      for(let c=m.c+1;c<wT;c++)if(L.mark.has(c+','+m.r)){b=c-2;break}
      L.movers.push({axis:'h',x:m.c*T,y:m.r*T,w:80,h:14,a0:a*T,a1:b*T,t:0,dx:0,dy:0,speed:72});
    }else{
      let a=m.r-3,b=m.r;
      for(let r=m.r-1;r>=0;r--)if(L.mark.has(m.c+','+r)){a=r+1;break}
      for(let r=m.r+1;r<ROWS;r++)if(L.mark.has(m.c+','+r)){b=r-1;break}
      L.movers.push({axis:'v',x:m.c*T,y:m.r*T,w:80,h:14,a0:b*T,a1:a*T,t:0,dx:0,dy:0,speed:60});
    }
  }
  for(const m of L.movers){const span=Math.abs(m.a1-m.a0);const u=(m.axis==='h'?m.x-m.a0:m.a0-m.y)/Math.max(1,span);m.t=clamp(u,0,1)*span/m.speed}
  return L;
}

/* =========================================================
   GRILLE ET COLLISIONS
   ========================================================= */
let L=null;
const SOLID='#XWD';
function tile(c,r){if(c<0||c>=L.w)return'W';if(r<0||r>=ROWS)return'.';return L.g[r][c]}
function isSolid(c,r){return SOLID.includes(tile(c,r))}
function owTop(ch){return(ch==='='||ch==='B')?0:ch==='p'?14:-1}
function groundAt(c,r){const ch=tile(c,r);return SOLID.includes(ch)||owTop(ch)>=0}
function moveX(e,dx){
  if(!dx)return false;e.x+=dx;
  const r0=Math.floor(e.y/T),r1=Math.floor((e.y+e.h-.01)/T);
  if(dx>0){const c=Math.floor((e.x+e.w-.001)/T);for(let r=r0;r<=r1;r++)if(isSolid(c,r)){e.x=c*T-e.w;e.vx=0;return true}}
  else{const c=Math.floor(e.x/T);for(let r=r0;r<=r1;r++)if(isSolid(c,r)){e.x=(c+1)*T;e.vx=0;return true}}
  return false;
}
function moveY(e,dy){
  const prevB=e.y+e.h;e.y+=dy;
  const c0=Math.floor(e.x/T),c1=Math.floor((e.x+e.w-.01)/T);
  if(dy>0){
    const b=e.y+e.h,r=Math.floor(b/T);
    for(let c=c0;c<=c1;c++){
      const ch=tile(c,r);
      if(SOLID.includes(ch)){e.y=r*T-e.h;e.vy=0;e.onGround=true;return true}
      const o=owTop(ch);
      if(o>=0){const top=r*T+o;if(prevB<=top+.5&&b>=top){e.y=top-e.h;e.vy=0;e.onGround=true;return true}}
    }
  }else if(dy<0){
    const r=Math.floor(e.y/T);
    for(let c=c0;c<=c1;c++)if(isSolid(c,r)){e.y=(r+1)*T;e.vy=0;return true}
  }
  return false;
}

const layerCache={};
function damask(g,x,y,s){
  g.beginPath();g.moveTo(x,y-14*s);g.quadraticCurveTo(x+7*s,y-3*s,x,y+12*s);g.quadraticCurveTo(x-7*s,y-3*s,x,y-14*s);g.fill();
  g.lineWidth=1.6*s;

function cobweb(g,x,y,s){
  g.strokeStyle='rgba(220,215,200,.22)';g.lineWidth=.8;
  const ang=k=>Math.PI*.05+k*Math.PI*.18;
  for(let k=0;k<6;k++){const a=ang(k);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s);g.stroke()}
  for(let r=s*.25;r<s;r+=s*.22){g.beginPath();for(let k=0;k<5;k++){const a=ang(k),a2=ang(k+1);const x1=x+Math.cos(a)*r,y1=y+Math.sin(a)*r,x2=x+Math.cos(a2)*r,y2=y+Math.sin(a2)*r;if(k===0)g.moveTo(x1,y1);g.quadraticCurveTo((x1+x2)/2-Math.cos((a+a2)/2)*r*.12,(y1+y2)/2-Math.sin((a+a2)/2)*r*.12,x2,y2)}g.stroke()}
}

/* =========================================================
   TUILES (précalculées avec les objets du fond)
   ========================================================= */
function faceTop(g,x,y,col){g.fillStyle=col;poly(g,[x,y,x+T,y,x+T+DX,y+DY,x+DX,y+DY]);g.fill()}
function faceSide(g,x,y,h,col){g.fillStyle=col;poly(g,[x+T,y,x+T+DX,y+DY,x+T+DX,y+h+DY,x+T,y+h]);g.fill()}
function matCols(ch,th){
  switch(ch){
    case'#':return[th.floor,th.floorTop,shade(th.floor,-.3)];
    case'W':return['#241a14','#33251c','#1a120d'];
    case'X':return['#a9824f','#c79d63','#7f6038'];
    case'D':return['#d3cab5','#ebe4d2','#aaa18c'];
    case'=':return['#7a5332','#9a6d44','#5a3c24'];
    case'B':return['#d6caae','#ece2cb','#a99c80'];
  }
  return null;
}
function buildTiles(L){
  const th=L.th,R=mulberry(L.def.seed+9);
  const wpx=L.wpx+DX+8,hpx=ROWS*T+PAD;
  const c=mk(wpx*RS,hpx*RS),g=c.getContext('2d');g.scale(RS,RS);g.translate(0,PAD);
  for(let x=60;x<L.wpx;x+=180+R()*260){if(R()<.6)cobweb(g,x,-4,40+R()*40);else{g.strokeStyle='rgba(120,100,80,.5)';g.lineWidth=1.5;g.beginPath();g.moveTo(x,-10);g.quadraticCurveTo(x+30,60+R()*40,x+70,-10);g.stroke()}}
  for(let r=11;r<ROWS;r++)for(let cc=0;cc<L.w;cc++)if(L.g[r][cc]==='#'&&!isSolid(cc,r-1)){g.fillStyle=shade(th.wains,-.1);g.fillRect(cc*T+DX,r*T+DY-9,T,9);g.fillStyle=shade(th.wains,.25);g.fillRect(cc*T+DX,r*T+DY-9,T,1.5)}
  const list=th.props;let x=80+R()*120,pi=Math.floor(R()*list.length);
  while(x<L.wpx-120){
    const p=PROPS[list[pi%list.length]],w=p.w;
    const c0=Math.floor(x/T),c1=Math.floor((x+w)/T);let ok=true;
    for(let cc=c0;cc<=c1;cc++)if(tile(cc,13)!=='#'||isSolid(cc,12))ok=false;
    for(const a of L.avoid)if(a>x-50&&a<x+w+50)ok=false;
    if(ok){g.save();p.d(g,x+DX,13*T+DY,R);g.restore();pi++;x+=w+70+R()*200}else x+=40;
  }
  g.save();g.globalCompositeOperation='source-atop';g.fillStyle=rgba(th.fog,.28);g.fillRect(0,-PAD,wpx,hpx);g.restore();
  const sh=mk(wpx,hpx),sg=sh.getContext('2d');sg.translate(0,PAD);sg.fillStyle='#000';
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<L.w;cc++){const ch=L.g[r][cc];if(SOLID.includes(ch))sg.fillRect(cc*T+10,r*T+12,T,T);else if(ch==='='||ch==='B')sg.fillRect(cc*T+10,r*T+12,T,12)}
  g.save();g.globalAlpha=.5;g.filter='blur(7px)';g.drawImage(sh,0,-PAD);g.restore();
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<L.w;cc++){
    const ch=L.g[r][cc],x=cc*T,y=r*T,mc=matCols(ch,th);if(!mc)continue;
    if(ch==='='||ch==='B'){faceTop(g,x,y,mc[1]);if(tile(cc+1,r)!==ch)faceSide(g,x,y,12,mc[2]);continue}
    if(!isSolid(cc,r-1)){faceTop(g,x,y,mc[1]);if(ch==='#'){g.fillStyle='rgba(0,0,0,.12)';for(let k=6;k<T;k+=10)g.fillRect(x+k+DX*.5,y+DY*.5,1,1)}}
    if(!isSolid(cc+1,r))faceSide(g,x,y,T,mc[2]);
  }
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<L.w;cc++)drawTileFront(g,L.g[r][cc],cc*T,r*T,cc,r,th);
  g.save();g.globalCompositeOperation='source-atop';g.globalAlpha=.5;g.fillStyle=g.createPattern(paperC,'repeat');g.fillRect(0,-PAD,wpx,hpx);g.restore();
  return c;
}
function drawTileFront(g,ch,x,y,cc,r,th){
  const mc=matCols(ch,th);
  const topOpen=!isSolid(cc,r-1);
  if(ch==='#'){
    g.fillStyle=mc[0];g.fillRect(x,y,T,T);
    if(th.type==='parquet'){
      g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=1;
      for(let k=0;k<4;k++){const yy=y+k*10+.5;g.beginPath();g.moveTo(x,yy);g.lineTo(x+T,yy);g.stroke();const j=((cc*37+r*11+k*23)%5)*8+4;g.beginPath();g.moveTo(x+j+.5,yy);g.lineTo(x+j+.5,yy+10);g.stroke();
        g.fillStyle='rgba(255,220,170,'+(((cc*7+k*3+r)%4)*.02)+')';g.fillRect(x,yy+1,T,9)}
    }else if(th.type==='stone'){
      g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1.2;
      for(let k=0;k<2;k++){const yy=y+k*20;g.strokeRect(x+((r+k)%2?-20:0)+.5,yy+.5,T,20);g.strokeRect(x+((r+k)%2?20:0)+.5,yy+.5,T,20)}
      g.fillStyle='rgba(255,255,255,.05)';for(let k=0;k<3;k++)g.fillRect(x+((cc*13+k*17+r*7)%34),y+((cc*7+k*11)%34),3,2);
    }else{
      for(let k=0;k<2;k++)for(let j=0;j<2;j++){g.fillStyle=shade(th.floor,((cc*3+r*5+k*7+j*11)%5-2)*.05);g.fillRect(x+j*20+1,y+k*20+1,18,18)}
    }
    if(topOpen){g.fillStyle=mc[1];g.fillRect(x,y,T,4);g.fillStyle='rgba(255,240,210,.35)';g.fillRect(x,y,T,1);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x,y+4,T,1.5)}
    if(r>=13){g.fillStyle='rgba(0,0,0,'+(r===14?.35:.15)+')';g.fillRect(x,y,T,T)}
  }else if(ch==='W'){
    g.fillStyle=mc[0];g.fillRect(x,y,T,T);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x+8,y,2,T);g.fillRect(x+28,y,2,T);
    g.fillStyle='rgba(255,255,255,.04)';g.fillRect(x+10,y,2,T);
  }else if(ch==='X'){
    g.fillStyle=mc[0];g.fillRect(x,y,T,T);
    g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x,y,T,2);g.fillRect(x,y+T-2,T,2);g.fillRect(x,y,2,T);g.fillRect(x+T-2,y,2,T);
    g.fillStyle='rgba(120,90,50,.25)';g.fillRect(x+4,y+6,T-8,1);g.fillRect(x+4,y+T-8,T-8,1);
    g.fillStyle='rgba(230,210,160,.55)';g.fillRect(x+16,y,8,T);
    const v=(cc*31+r*17)%7;
    g.save();g.translate(x+T/2,y+T/2);
    if(v===0){g.rotate(-.18);g.fillStyle='rgba(160,40,30,.75)';g.font='bold 8px '+F_DISP;g.textAlign='center';g.fillText('FRAGILE',0,3);}
    else if(v===2){g.fillStyle='rgba(30,20,10,.6)';g.font='9px '+F_DISP;g.textAlign='center';g.fillText('↑ HAUT ↑',0,13)}
    else if(v===4){g.fillStyle='rgba(30,20,10,.55)';g.font='italic 10px '+F_BODY;g.textAlign='center';g.fillText('n° '+(10+cc%80),-1,-8)}
    else if(v===5){g.rotate(.1);g.fillStyle='rgba(30,40,80,.55)';g.font='8px '+F_DISP;g.textAlign='center';g.fillText('SALLE '+(1+r%5),0,0)}
    else if(v===6){g.fillStyle='#e9dfc7';g.fillRect(-14,4,12,9);g.fillStyle='rgba(30,20,10,.5)';g.fillRect(-12,7,8,1);g.fillRect(-12,10,6,1)}
    g.restore();
  }else if(ch==='D'){
    g.fillStyle=mc[0];g.fillRect(x,y,T,T);
    for(let k=0;k<T;k+=2){const v=Math.sin((x+k)*.18)*.5+Math.sin((x+k)*.07)*.5;g.fillStyle=v>0?'rgba(255,255,255,'+(v*.12)+')':'rgba(60,50,30,'+(-v*.14)+')';g.fillRect(x+k,y,2,T)}
    if(tile(cc,r+1)!=='D'){g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.moveTo(x,y+T-6);for(let k=0;k<=T;k+=8)g.quadraticCurveTo(x+k+4,y+T+3,x+k+8,y+T-4);g.lineTo(x+T,y+T);g.lineTo(x,y+T);g.closePath();g.fill()}
  }else if(ch==='='){
    g.fillStyle=mc[0];g.fillRect(x,y,T,12);g.fillStyle='rgba(255,230,190,.25)';g.fillRect(x,y,T,1.5);
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x,y+10,T,2);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x+((cc*13)%30)+4,y+4,6,1);
    if(tile(cc-1,r)!=='='){g.fillStyle=mc[2];poly(g,[x+4,y+12,x+12,y+12,x+5,y+26]);g.fill()}
    if(tile(cc+1,r)!=='='){g.fillStyle=mc[2];poly(g,[x+T-12,y+12,x+T-4,y+12,x+T-5,y+26]);g.fill()}
  }else if(ch==='B'){
    g.fillStyle=mc[0];rr(g,x-1,y+1,T+2,11,5);g.fill();
    g.fillStyle='rgba(255,255,255,.3)';g.fillRect(x,y+2,T,2);
    g.fillStyle=mc[2];g.fillRect(x+T/2-1,y+3,2,8);
    if(tile(cc-1,r)!=='B'||tile(cc+1,r)!=='B'){const ex=tile(cc-1,r)!=='B'?x+2:x+T-2;g.fillStyle=mc[0];g.beginPath();g.arc(ex,y+3,6,0,7);g.arc(ex,y+10,6,0,7);g.fill()}
  }else if(ch==='^'||ch==='v'){
    const up=ch==='^';const by=up?y+T-8:y;
    g.fillStyle='#8a6a48';g.fillRect(x,by,T,8);g.fillStyle='rgba(0,0,0,.25)';for(let k=0;k<8;k++)g.fillRect(x+((cc*13+k*7)%38),by+((k*5)%7),2,1.5);
    const heads=['#b8302a','#efe6d3','#1d1a22','#b8302a','#d9a441'];
    for(let k=0;k<3;k++){
      const px=x+8+k*12,len=22+((cc+k*3+r)%3)*3;

/* ---------- scène d'ouverture : le carton tombe sur la cloche ---------- */
function stepCut(dt){
  const C=G.cut,dg=domeGeom(L.dome),k=L.carton;C.t+=dt;
  if(C.phase==='wait'&&C.t>1.1){C.phase='fall';k.state='fall';k.vy=0;SFX.whistle()}
  if(k.state==='fall'){k.vy+=2600*dt;k.y+=k.vy*dt;
    if(k.y+20>=dg.domeTop){
      k.state='fly';k.vx=-150;k.vy=-320;k.vr=-6;L.dome.broken=true;SFX.crash();G.shake=18;C.phase='fly';
      for(let i=0;i<46;i++){const a=-Math.PI*rnd(),s=120+rnd()*380;parts.push({type:'glass',x:L.dome.x+(rnd()-.5)*50,y:dg.domeTop+30+rnd()*40,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:30,rot:rnd()*6,vr:(rnd()-.5)*20,sz:2+rnd()*5,floor:L.dome.floor})}
      C.ray='fly';P.vx=120;P.vy=-430;
    }}
  if(k.state==='fly'){k.vy+=2600*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.rot+=k.vr*dt;if(k.x<64){k.x=64;k.vx=-k.vx*.3}
    if(k.y+20>=L.dome.floor){k.y=L.dome.floor-20;k.state='rest';k.rot=-.1;SFX.land();G.shake=6}}
  if(C.ray==='fly'){P.vy+=GRAV*dt;moveX(P,P.vx*dt);P.onGround=false;moveY(P,P.vy*dt);P.spin+=dt*13;
    if(P.onGround){C.ray='lie';C.lieT=0;P.vx=0;P.spin=Math.PI;SFX.land();puff(P.x+P.w/2,P.y+P.h,12,true)}}
  else if(C.ray==='lie'){C.lieT+=dt;
    if(C.lieT>1.0&&!C.q){C.q=1;bubble(P.x+P.w/2,P.y-10,'… ?','#2a2420')}

  else if(C.ray==='up'){C.upT+=dt;P.spin=Math.PI*(1+Math.min(1,C.upT/.3));if(C.upT>.35){G.cut=null;G.cutSeen=true;P.spin=0;P.cp={x:L.spawn.x,y:L.spawn.y};say(L.def.start,5)}}
}

/* ---------- mise à jour du jeu ---------- */
function stepPlay(dt){
  for(const m of L.movers){
    const px=m.x,py=m.y;m.t+=dt;const span=Math.abs(m.a1-m.a0)||1;
    let u=(m.t*m.speed/span)%2;u=u>1?2-u:u;u=u*u*(3-2*u);
    if(m.axis==='h')m.x=m.a0+(m.a1-m.a0)*u;else m.y=m.a0+(m.a1-m.a0)*u;
    m.dx=m.x-px;m.dy=m.y-py;
  }
  const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
  for(const m of L.moths){
    m.t+=dt;let bx,by;
    if(m.axis==='h'){bx=m.cx+Math.sin(m.t*2.4)*m.amp;by=m.cy+Math.cos(m.t*3.1)*16}else{bx=m.cx+Math.sin(m.t*1.4)*16;by=m.cy+Math.sin(m.t*2.2)*m.amp}
    const dx=pcx-m.x,dy=pcy-m.y,d=Math.hypot(dx,dy)||1;
    m.near=!P.dead&&!G.cut&&d<190;
    if(m.near){m.ox+=dx/d*95*dt;m.oy+=dy/d*95*dt}else{m.ox*=1-dt*1.3;m.oy*=1-dt*1.3}
    const ol=Math.hypot(m.ox,m.oy);if(ol>140){m.ox*=140/ol;m.oy*=140/ol}
    m.x=bx+m.ox+Math.sin(m.t*17)*2.5;m.y=by+m.oy+Math.cos(m.t*13)*2.5;
  }
  for(const c of L.rats){
    c.t+=dt;c.vy=Math.min(MAXFALL,c.vy+GRAV*dt);
    const spd=Math.abs(c.vx)||95;
    if(moveX(c,c.vx*dt))c.vx=-(c.lastDir||1)*spd;
    c.lastDir=Math.sign(c.vx)||c.lastDir||1;
    c.onGround=false;moveY(c,c.vy*dt);
    if(c.onGround){
      const dir=Math.sign(c.vx)||1,fx=dir>0?c.x+c.w+2:c.x-2,cf=Math.floor(fx/T),rf=Math.floor((c.y+c.h-2)/T);
      if(!groundAt(cf,rf+1)||tile(cf,rf)==='^'||L.mark.has(cf+','+rf)){c.vx=-c.vx;c.lastDir=Math.sign(c.vx)}
    }
  }
  const K=L.chaser;
  if(K){
    K.t+=dt;
    if(K.state==='wake'){K.wakeT-=dt;if(K.wakeT<=0)K.state='chase'}
    if(K.state==='chase'){
      const dist=pcx-(K.x+K.w/2),dir=Math.sign(dist)||1;
      const sp=clamp(205+(Math.abs(dist)-160)*.25,205,300);
      K.vx=lerp(K.vx,dir*sp,Math.min(1,dt*6));K.f=dir;
      K.vy=Math.min(MAXFALL,K.vy+GRAV*dt);
      moveX(K,K.vx*dt);
      K.onGround=false;moveY(K,K.vy*dt);
      if(K.onGround){
        const fx=dir>0?K.x+K.w+6:K.x-6,cf=Math.floor(fx/T),rf=Math.floor((K.y+K.h-2)/T);
        const la=dir>0?K.x+K.w+34:K.x-34,cl=Math.floor(la/T);
        const blocked=isSolid(cf,rf)||isSolid(cf,rf-1);
        const gap=!groundAt(cl,rf+1)&&!isSolid(cl,rf);
        const pins=tile(cl,rf)==='^'||tile(cf,rf)==='^';
        const above=P.y+P.h<K.y-20&&Math.abs(dist)<110;
        if(blocked||gap||pins||above)K.vy=-820;
      }
      if(K.y>ROWS*T+60){K.x=P.x-320;K.y=0;K.vy=0}
    }
  }
  if(G.cut){stepCut(dt);return}
  if(P.dead){P.deadT-=dt;if(P.deadT<=0)respawn();return}
  if(P.wake>0){P.wake-=dt;P.vy+=GRAV*dt;P.onGround=false;moveY(P,P.vy*dt);return}

function update(dt){
  G.t+=dt;

  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  if(G.quip){G.quip.t+=dt;if(G.quip.t>G.quip.dur)G.quip=null}
  if(G.state!=='play')purrSet(0);
  switch(G.state){
    case'title':handleMenu();break;
    case'pause':if(pressed.has('esc')){G.state='play';break}handleMenu();break;
    case'select':handleSelect();break;
    case'intro':handleCards(dt);break;
    case'levelend':handleLetter(dt);break;
    case'play':{
      if(pressed.has('esc')){G.state='pause';G.menuSel=0;break}
      if(G.cut&&(pressed.has('ok')||pressed.has('restart')||G.click)&&G.cut.t>.5)skipCut();
      if(pressed.has('restart')&&!P.dead&&!G.cut){resetPlayer();P.wake=.3;const K=L.chaser;if(K){K.state='sleep';K.x=K.home.x;K.y=K.home.y;G.chase=false;setSong(L.def.theme)}}
      if(pressed.has('jump')&&!G.cut)P.jumpBuf=.12;
      acc+=dt;let n=0;while(acc>=STEP&&n<12){stepPlay(STEP);acc-=STEP;n++;if(G.state!=='play')break}
      if(acc>STEP)acc=0;
      animalSounds(dt);updateParticles(dt);updateCamera(dt);
      if(G.tickSnd){G.tickSnd=false;SFX.tick()}
      break}
    case'exiting':{
      G.exitT+=dt;updateParticles(dt);
      if(G.exitT>1.1){
        const li=G.li;S.unlocked=Math.max(S.unlocked,li+1);
        const b=S.best[li]||{corn:0,medal:false,deaths:9999};S.best[li]={corn:Math.max(b.corn,G.corn),medal:b.medal||G.medal,deaths:Math.min(b.deaths,G.levelDeaths)};save();
        G.LE={li,chars:0,done:false,after:0,corn:G.corn,cornTotal:G.cornTotal,medal:G.medal,deaths:G.levelDeaths};G.state='levelend';G.fade=1;SFX.page();setSong('title');
      }

  }
  pressed.clear();G.click=null;
}

  switch(G.state){
    case'loading':ctx.fillStyle='#110e14';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(233,223,199,.6)';ctx.font='italic 20px Georgia, serif';ctx.textAlign='center';ctx.fillText('On rembourre Raymond…',W/2,H/2);break;
    case'title':renderTitle(t);renderGrain();break;
    case'select':renderSelect(t);renderGrain();break;
    case'intro':renderCards(t);renderGrain();break;
    case'levelend':renderLetter(t);renderGrain();break;
    case'play':case'pause':case'exiting':{
      const sx=(rnd()-.5)*G.shake,sy=(rnd()-.5)*G.shake;
      const cx=Math.round(cam.x+sx),cy=Math.round(cam.y+sy);
      renderWorld(L,cx,cy,t);
      const extra=[{x:P.x+P.w/2,y:P.y+P.h/2,r:190,i:.8}];
      for(const cp of L.cps)if(cp.on)extra.push({x:cp.x,y:cp.y-46,r:150,i:.75,warm:1,flick:1});
      if(L.exit)extra.push({x:L.exit.x+26,y:L.exit.y+40,r:230,i:1,warm:L.def.exit==='door'?1:0});
      if(L.medal&&!L.medal.taken)extra.push({x:L.medal.x,y:L.medal.y,r:70,i:.5});
      if(L.dome)extra.push({x:L.dome.x,y:L.dome.floor-90,r:170,i:.7,warm:1});
      renderLighting(L,cx,cy,t,extra);
      drawForeground(cx,L.def.seed);
      renderGrain();
      if(!G.cut)renderHUD();else drawQuip(66);
      if(G.cut){ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,0,W,46);ctx.fillRect(0,H-46,W,46);if(G.cut.t>.5){ctx.font='italic 14px '+F_BODY;ctx.fillStyle='rgba(233,223,199,.45)';ctx.textAlign='right';ctx.fillText('appuyer pour passer',W-20,H-18)}}
      if(G.state==='pause'){ctx.fillStyle='rgba(10,8,14,.72)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#efe5cc';ctx.font='44px '+F_DISP;ctx.textAlign='center';ctx.fillText('Pause',W/2,140);ctx.font='italic 17px '+F_BODY;ctx.fillStyle='rgba(233,223,199,.6)';ctx.fillText('Raymond en profite pour se gratter. Il ne sent rien.',W/2,172);drawMenu(W/2,236,48)}
      if(G.state==='exiting'){ctx.fillStyle='rgba(11,10,12,'+Math.min(1,G.exitT/1.1)+')';ctx.fillRect(0,0,W,H)}
      break}
  }
  if(G.fade>0){ctx.fillStyle='rgba(11,10,12,'+G.fade+')';ctx.fillRect(0,0,W,H)}
  ctx.restore();
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{update(dt);render()}catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
async function boot(){
  try{await Promise.race([Promise.all([document.fonts.load('30px "IM Fell English SC"'),document.fonts.load('italic 20px "IM Fell English"'),document.fonts.load('20px "IM Fell English"'),document.fonts.load('30px "La Belle Aurore"')]),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  ensureTitleLv();G.state='title';G.fade=1;setSong('title');
}
window.__apl={G,P,S,startLevel,stepPlay,get L(){return L},keys,pressed,cam,COMPILED};
boot();requestAnimationFrame(frame);
</script>
