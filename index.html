/* =========================================================
   2-3 · LA ZONE ROUGE — forêt de Verdun au début du soir
   ---------------------------------------------------------
   Trous d'obus pleins d'eau (repérés tout seuls : sol creusé sur deux cases, hors tranchée),
   obus non explosés (^) derrière des barbelés posés automatiquement autour de chaque champ d'obus,
   arbres tombés (X), restes de tranchée (zone 'trench'), sangliers qui chargent sans voir les trous,
   feuillage qui cache du drone, vieille souche (cachette, option stumpAt).
   ========================================================= */
THEMES.zonerouge={outdoor:true,far:'sky',horizon:'fields',sky:['#2c3a64','#a8706e','#f2b47a'],celestial:'sun',sunY:330,fog:'#b48c84',dark:.2,weather:'dusk',
  floor:'#4c3a28',floorTop:'#56763a',type:'earth',x:'log',d:'hedge',shelf:'branch',spike:'obus',walker:'boar',flyer:'bat',props:['stump','fern','molehill']};
MAT.X.log=['#5a4432','#7a6046','#3a2a1e'];

function zrPost(Lv){
  if(Lv.def.theme!=='zonerouge')return;
  const G0=gRow(Lv),Z={holes:[],wires:[],said:{}};Lv.zr=Z;
  // trous d'obus : deux cases creusées sous la surface (pas dans la tranchée)
  for(let c=1;c<Lv.w-1;c++){if(Lv.g[G0][c]!=='.'||Lv.g[G0+1][c]!=='.'||zoneOfL(Lv,c)==='trench')continue;let e=c;while(Lv.g[G0][e+1]==='.'&&Lv.g[G0+1][e+1]==='.')e++;
    for(let cc=c;cc<=e;cc++)for(let r=G0+2;r<Lv.g.length;r++)Lv.g[r][cc]='.';   // sans fond : l'eau descend jusqu'en bas
    Z.holes.push({x0:c*T,x1:(e+1)*T,top:G0*T,wy:G0*T+30,bot:Lv.g.length*T,seed:c});c=e}
  // barbelés autour de chaque champ d'obus (un trou d'une case, l'arbre, ne coupe pas le champ)
  for(let c=1;c<Lv.w-1;c++){if(Lv.g[G0-1][c]!=='^')continue;let e=c;while(Lv.g[G0-1][e+1]==='^'||(Lv.g[G0-1][e+1]==='.'&&Lv.g[G0-1][e+2]==='^'))e++;
    Z.wires.push({x0:c*T-14,x1:(e+1)*T+14,b:G0*T});c=e}
  if(Lv.def.stumpAt){const[c,r]=Lv.def.stumpAt;Lv.acts.push({kind:'secret',style:'stump',x:c*T+T/2,y:(r+1)*T,open:0,t:0,used:false,
    q:["Une vieille souche, creuse comme une cagna. Et dedans, de la paille bien sèche. Quelqu'un y a fait son nid avant moi."]});Lv.avoid.push(c*T)}
  // troncs couchés (blocs X) et rondins de la sape (X dans la tranchée) : dessinés comme des objets
  Z.logs=[];Z.rondins=[];{const seen=new Set();for(let r=0;r<Lv.g.length;r++)for(let c=0;c<Lv.w;c++){if(Lv.g[r][c]!=='X'||seen.has(c+','+r))continue;
    let e=c;while(Lv.g[r][e+1]==='X')e++;let b=r;while(b+1<Lv.g.length&&Lv.g[b+1][c]==='X'&&Lv.g[b+1][e]==='X')b++;
    for(let rr=r;rr<=b;rr++)for(let cc=c;cc<=e;cc++)seen.add(cc+','+rr);
    (zoneOfL(Lv,c)==='trench'?Z.rondins:Z.logs).push({x0:c*T,x1:(e+1)*T,top:r*T,bot:(b+1)*T,seed:c*7+r})}}
  // l'abri allemand du Mort-Homme : un long blockhaus, une rangée de lanternes ; la dernière clignote (cachette)
  if(Lv.def.blockhaus){const[c0,c1]=Lv.def.blockhaus,x0=c0*T,x1=(c1+1)*T,b=G0*T;Z.bh={x0,x1,b,lamps:[]};
    // la porte est à gauche (on la franchit à pied ; en sautant on passe devant) ; les lanternes suivent, toutes sur la même ligne ; la dernière clignote
    const ex=Lv.exit?Lv.exit.x+6:x0+80;for(let x=ex+110;x<x1-60;x+=78){const l={x,y:b-80,r:130,i:.75,warm:1};Z.bh.lamps.push(l);Lv.lights.push(l)}
    {const l={x:x1-26,y:b-80,r:130,i:.75,warm:1};Z.bh.lamps.push(l);Lv.lights.push(l)}
    if(Lv.def.exitByAct&&Lv.exit)Lv.acts.push({kind:'door',x:ex+T/2,y:b,open:0,t:0,used:false});
    const lb=Z.bh.lamps[Z.bh.lamps.length-1],a={kind:'secret',style:'lamp',ly:lb.y+4,x:lb.x,y:b,open:0,t:0,used:false,q:["Un nid de paille dans la lanterne : voilà pourquoi elle clignotait. Et le locataire s'en va !"]};Z.lampAct=a;Lv.acts.push(a);
    for(let x=x0;x<=x1;x+=40)Lv.avoid.push(x)}
  for(const h of Z.holes)Lv.avoid.push(h.x0-30,h.x1+30);
  for(const w of Z.wires)Lv.avoid.push(w.x0,(w.x0+w.x1)/2,w.x1);
}
function zrHole(x){for(const h of L.zr.holes)if(x>h.x0&&x<h.x1)return h;return null}

  for(const c of L.rats){if(c.dead)continue;const h=zrHole(c.x+c.w/2);if(h&&c.y+c.h>h.wy+4){c.dead=true;if(!G.sim){splash(c.x+c.w/2,h.wy);

  if(Z.decoy){const d=Z.decoy;d.t+=dt;if(d.t<.8){d.x-=40*dt;d.y-=50*dt}else{d.x-=Math.min(430,120+(d.t-.8)*700)*dt;d.y-=Math.max(0,30-d.t*8)*dt+Math.sin(d.t*5)*.6}

}

      g.fillStyle='#4a3e30';g.beginPath();g.moveTo(x,y0+h0);for(let k=0;k<=w0;k+=20)g.lineTo(x+k,y0+200+Math.sin(k*.02)*10+((k*7)%13));g.lineTo(x+w0,y0+h0);g.closePath();g.fill();

/* =========================================================
   3-1 · LE TRAIN — Raymond voyage sur le toit d'un train régional qui file vers Reims
   ---------------------------------------------------------
   Le train est immobile dans le monde : c'est le paysage qui défile (bandes en cache, décalées à chaque image).
   Pylônes caténaires (sauter), passerelle (rester au sol), voiture de voyageurs en coupe (bouteilles qui roulent
   au gré des secousses, voyageurs qui jettent des objets s'ils voient Raymond sauter devant eux, sac à dos rouge),
   voiture-bar (serveur qui frappe, paquet de chips), arrivée en gare et arrêt du train.
   ========================================================= */
THEMES.train={outdoor:true,far:'train',horizon:'train',sky:['#5f97cf','#b4d0e6','#f4dcae'],celestial:'none',fog:'#c8d4dc',dark:0,weather:'none',
  floor:'#5a5e66',floorTop:'#8a8e96',type:'zinc',x:'crate',d:'drape',shelf:'girder',spike:'elec',walker:'rat',flyer:'crow',props:[]};
const TRN={ROOF:7*T,FLOOR:12*T,BOT:13*T,RAIL:590,WIRE:60,VN:650,DEC:7.5};
const TR_LIV={body:'#e9e6de',band:'#2f4a72',band2:'#24395a',red:'#b8322c',roof:'#a9adb3',roof2:'#8a8e94',under:'#2c2e33',glass:'#20304a'};

/* ---------- après lecture du niveau ---------- */
function trainPost(Lv){
  if(Lv.def.theme!=='train')return;
  const D=Lv.def.train,R=mulberry(Lv.def.seed+3);
  const w3=D.wagons.find(w=>w.k==='seats'),w4=D.wagons.find(w=>w.k==='bar'),ws=D.wagons.filter(w=>w.k==='ext'),wl=D.wagons[D.wagons.length-1];
  const Tn={v:1,sFar:0,sMid:0,sNear:0,sBal:0,pyl:[],spawnT:3.2,warn:0,nextKind:'pylon',bridgeDone:false,w5:false,
    dir:1,joltT:3,bottles:[],proj:[],litter:[],pass:[],said:{},clickT:.4,door:{c:D.door,open:0,shut:true},
    waiter:{x:(D.counter[0]+3)*T,st:'idle',t:0,f:1,seen:false},w7:false,dt:0,stopped:false,stRem:0,
    zA:[0,(w3.c0-2)*T],zB:[(w4.c1+2)*T,(wl.c0-2)*T],b1:ws[4].c0*T,b2:ws[5].c0*T,loco:wl.c0*T,end:(wl.c1+1)*T,stAnchor:(wl.c0-29)*T,panto:(w3.c0+5)*T,ladder:(w4.c1+2)*T+T/2,
    in3:[(w3.c0+1)*T,w3.c1*T],in4:[(w4.c0+1)*T,w4.c1*T],cnt:[D.counter[0]*T,(D.counter[1]+1)*T]};
  Lv.train=Tn;
  // les sièges de la voiture 3 : un tous les deux pas, tournés vers l'avant
  D.seats.forEach((k,i)=>{const x=(w3.c0+2+i*2)*T+4;const pa={x,k,cool:0,shock:0,throwT:-1,ph:R()*6};Tn.pass.push(pa);
    if(k==='bagred'){pa.act={kind:'secret',style:'sac',x:x+30,y:TRN.FLOOR,open:0,t:0,used:false,
      q:["Un sac à dos rouge, sans personne. Dedans : un pull, un livre… et de la paille d'emballage. Réquisitionnée."]};Lv.acts.push(pa.act)}});
  for(const c of D.bottles)Tn.bottles.push({x:c*T,vx:(R()-.5)*120,rot:0,k:Tn.bottles.length%2?'can':'bottle'});
  // le paquet de chips : une cachette sans paille
  Lv.acts.push({kind:'secret',style:'chips',noStraw:true,x:D.chips*T,y:10*T,open:0,t:0,used:false,
    q:["Un paquet de chips. Pas un brin de paille dedans, mais ça craque comme le pain de guerre. Je le confisque."]});
  Tn.wheels=[];for(const w of D.wagons){const a=w.c0*T,b=(w.c1+1)*T;for(const bx of[a+70,b-70])Tn.wheels.push(bx-24,bx+24)}

const trIn=(Tn,r)=>{const pcx=P.x+P.w/2;return pcx>r[0]&&pcx<r[1]&&P.y>8*T-10}
function trainOnRoof(){return P.y+P.h<=TRN.ROOF+4}
function trainZone(x){const Tn=L.train;return x<Tn.zA[1]||(x>Tn.zB[0]&&x<Tn.zB[1])}

/* ---------- à chaque image ---------- */
function trainStep(dt){
  const Tn=L.train;if(!Tn)return;const pcx=P.x+P.w/2;
  // vitesse : ralentit jusqu'à l'arrêt à l'entrée en gare
  if(Tn.w7&&!Tn.stopped){Tn.dt+=dt;const u=Math.min(1,Tn.dt/TRN.DEC);Tn.v=(1-u)*(1-u);Tn.stRem=TRN.VN*TRN.DEC/3*Math.pow(1-u,3);
    if(u>=1){Tn.stopped=true;Tn.v=0;if(!G.sim){tone(150,.9,'sawtooth',.05,140);noise(.8,500,.15,'lowpass');say("Le train s'arrête. Le clocher n'est plus très loin : je finirai à tire-d'aile.",4)}}}
  const v=Tn.v;Tn.sFar+=v*22*dt;Tn.sMid+=v*170*dt;Tn.sNear+=v*TRN.VN*dt;Tn.sBal+=v*1150*dt;
  // le train vibre, les joints des rails claquent : ta-dam… ta-dam
  if(!G.sim){G.shake=Math.max(G.shake,.7*v);Tn.clickT-=dt*v;if(Tn.clickT<=0){Tn.clickT=.62;noise(.04,900,.12*v+.02,'bandpass',0,3);noise(.04,700,.1*v+.02,'bandpass',.13,3)}
    loopSet('wind',trainOnRoof()?.15*v:.03*v)}
  // les pylônes : sur les toits 1-2 et 5-6
  const roofish=P.y<9*T&&!P.dead;
  // aucun avertissement : un pylône (ou une passerelle) toutes les 2 à 5 secondes, à intervalles irréguliers
  if(pcx>Tn.b1&&!Tn.w5){Tn.w5=true;Tn.spawnT=Math.min(Tn.spawnT,2.5)}
  if(pcx>Tn.b2+3*T&&!Tn.bridgeDone){Tn.nextKind='bridge'}
  if(!Tn.w7&&roofish&&trainZone(pcx)){Tn.spawnT-=dt;
    if(Tn.spawnT<=0){const k=Tn.nextKind;Tn.pyl.push({k,x:Math.max(cam.x+W+70,pcx+560),said:false});if(k==='bridge')Tn.bridgeDone=true;
      Tn.spawnT=2+rnd()*3;Tn.nextKind=Tn.bridgeDone&&pcx>Tn.b2&&rnd()<.45?'bridge':'pylon'}}
  for(let i=Tn.pyl.length-1;i>=0;i--){const p=Tn.pyl[i];p.x-=TRN.VN*Math.max(v,.0)*dt;
    if(!p.said&&p.x<pcx-60&&!P.dead&&!P.carried&&trainOnRoof()&&!G.sim){p.said=true;
      if(p.k==='bridge'&&!Tn.said.bridge){Tn.said.bridge=1;say("Ce n'était pas un pylône : c'était un pont ! Heureusement que j'avais les pattes à plat.",3.8)}
      else if(p.k==='pylon'&&!Tn.said.pyl){Tn.said.pyl=1;say("Un pylône ! Ils ont planté les poteaux du télégraphe au milieu de la voie.",3.4)}}
    if(p.x<cam.x-420)Tn.pyl.splice(i,1)}
  // collisions avec un pylône ou une passerelle : Raymond est emporté
  if(!P.dead&&!P.carried){const hb={x:P.x+3,y:P.y+4,w:P.w-6,h:P.h-6};
    for(const p of Tn.pyl){
      const hit=p.k==='pylon'?(hb.x+hb.w>p.x-8&&hb.x<p.x+8&&hb.y<TRN.ROOF-16&&hb.y+hb.h>TRN.ROOF-31)
        :(hb.x+hb.w>p.x-62&&hb.x<p.x+62&&hb.y<TRN.ROOF-34&&hb.y+hb.h>TRN.ROOF-120);
      if(hit){P.carried={p,dx:P.x-p.x,y:Math.min(P.y,p.k==='pylon'?TRN.ROOF-30-P.h*.4:TRN.ROOF-34-P.h+4),k:p.k==='pylon'?'pylone':'passerelle'};P.vx=P.vy=0;
        if(!G.sim){G.shake=9;noise(.2,600,.5,'lowpass');tone(220,.15,'square',.08,90)}break}}
    if(!P.carried&&hb.y<TRN.WIRE+4&&hb.y+hb.h>TRN.WIRE-4&&(trainZone(pcx)||pcx>Tn.loco))G.trainHit='elec';}
  // secousses : tout ce qui roule part du même côté
  // à chaque secousse, tout ce qui roule part du même côté, chacun avec son élan ; puis ça ralentit
  Tn.joltT-=dt;if(Tn.joltT<=0){Tn.dir*=-1;Tn.joltT=1.8+rnd()*1.8;for(const b of Tn.bottles){const dw=Tn.dir>0?Tn.in3[1]-b.x:b.x-Tn.in3[0];b.vx=clamp(b.vx*.3+Tn.dir*(70+rnd()*110)*Math.max(v,.3)*clamp(dw/(10*T),.25,1),-170,170)}
    if(!G.sim&&(trIn(Tn,Tn.in3)||trIn(Tn,Tn.in4))){G.shake=Math.max(G.shake,3.5);noise(.12,400,.35,'lowpass')}}
  const [a3,b3]=Tn.in3;
  Tn.bottles.sort((p,q)=>p.x-q.x);for(let i=0;i+1<Tn.bottles.length;i++){const p=Tn.bottles[i],q=Tn.bottles[i+1];if(q.x-p.x<26){const m=(p.x+q.x)/2;p.x=m-13;q.x=m+13;const t2=p.vx;p.vx=q.vx*.8;q.vx=t2*.8}}
  for(const b of Tn.bottles){const f=40*dt;b.vx=Math.abs(b.vx)<=f?0:b.vx-Math.sign(b.vx)*f;b.x+=b.vx*dt;b.rot+=b.vx*dt/7;
    if(b.x<a3+8){b.x=a3+8;b.vx=Math.abs(b.vx)*.5}if(b.x>b3-8){b.x=b3-8;b.vx=-Math.abs(b.vx)*.5}
    if(!P.dead&&Math.abs(b.x-pcx)<12&&P.y+P.h>TRN.FLOOR-12&&P.y<TRN.FLOOR)G.trainHit='bouteille'}
  // les voyageurs : horrifiés s'ils voient Raymond sauter devant eux
  const inside3=trIn(Tn,Tn.in3);
  for(const pa of Tn.pass){pa.cool=Math.max(0,pa.cool-dt);pa.shock=Math.max(0,pa.shock-dt);
    if(pa.k==='empty'||pa.k==='sleep'||pa.k==='bagblue'||pa.k==='bagred')continue;
    const sees=inside3&&!P.dead&&!P.onGround&&P.y+P.h<TRN.FLOOR-34&&pcx>pa.x+18&&pcx<pa.x+86;

function garePost(Lv){

  const mv=(kind,w,h)=>{const m={axis:'g',kind,x:-9999,y:99999,w,h:14,vh:h,dx:0,dy:0,t:0,speed:0,a0:0,a1:0,on:false,dir:-1};Lv.movers.push(m);return m};
  const S2={van:mv('van',168,82),truck:mv('truck2',150,176),car:mv('car',116,90),vanT:2.5,warn:0,pass:[],pig:[],seeds:[],said:{},fled:false};
  Lv.gare=S2;
  S2.hang=[];for(let r=0;r<Lv.g.length;r++)for(let c=0;c<Lv.w;c++)if(Lv.g[r][c]==='v')S2.hang.push([c,r]);
  S2.lanes=[{m:S2.truck,k:'truck',c0:D.road[0]+2,c1:D.road[0]+7,st:'idle',t:0,d:.6},{m:S2.car,k:'car',c0:D.road[0]+11,c1:D.road[0]+15,st:'idle',t:0,d:1.8}];
  // les voyageurs du parvis
  const kinds=['valise','sac','costume','touriste','valise'];
  for(let i=0;i<5;i++)S2.pass.push({x:(125+i*7.3)*T,dir:i%2?-1:1,sp:55+R()*30,k:kinds[i],wave:0,cool:0,ph:R()*6});
  // les pigeons du square

  // la statue
  Lv.avoid.push(D.statue*T);
}
function gareVehicleSet(m,x,on){m.x=x;m.on=on;m.y=on?GR.FL-m.vh:99999;if(!on&&P.onMover===m){P.onMover=null;P.onGround=false}}
function gareStep(dt){
  const S2=L.gare;if(!S2)return;const D=L.def.gare,pcx=P.x+P.w/2,F=GR.FL;
  const hb={x:P.x+3,y:P.y+4,w:P.w-6,h:P.h-6};
  const hitVeh=(m,kind,lim)=>{if(!m.on||P.dead||P.onMover===m)return;let x0=m.x+6,x1=m.x+m.w-6;if(lim){x0=Math.max(x0,lim[0]);x1=Math.min(x1,lim[1])}if(x1<=x0)return;const b={x:x0,y:m.y+8,w:x1-x0,h:m.vh-8};if(overlap(hb,b))G.gareHit=kind};
  // la fourgonnette de ravitaillement : elle arrive de la droite à toute allure
  {const m=S2.van,[a,b]=D.vanZone,px=m.x;
    if(m.on){m.x-=430*dt;if(m.x+m.w<(D.camion[1]+1)*T-10)gareVehicleSet(m,-9999,false)}
    else if(pcx>a*T&&pcx<b*T&&!P.dead){S2.vanT-=dt;if(S2.vanT<1&&!S2.warn){S2.warn=1;if(!G.sim){tone(440,.12,'square',.06);tone(440,.12,'square',.06,null,.18)}}
      if(S2.vanT<=0){gareVehicleSet(m,Math.max(cam.x+W+30,pcx+260),true);S2.vanT=4.5+rnd()*2.5;S2.warn=0;if(!G.sim)noise(.6,500,.18,'lowpass')}}
    m.dx=m.on?m.x-px:0;hitVeh(m,'fourgonnette');
    if(m.on&&!S2.said.van&&!G.sim&&m.x<pcx-200&&!P.dead){S2.said.van=1;say("Une voiture sur le quai, à fond de train ! Ils ne respectent plus rien.",3.4)}}
  // la route : la circulation va et vient dans la profondeur (un camion arrive vers nous, une voiture s'éloigne)
  {const [r0,r1]=D.road,near=pcx>(r0-24)*T&&pcx<(r1+20)*T;
    for(const ln of S2.lanes){const m=ln.m;ln.t+=dt;
      const next=(st,d)=>{ln.st=st;ln.t=0;ln.d=d};
      if(ln.st==='idle'){if(near&&ln.t>ln.d){next('come',ln.k==='truck'?1.5:.4);if(!G.sim&&Math.abs(pcx-(ln.c0+3)*T)<900)noise(.9,ln.k==='truck'?200:380,.14,'lowpass')}}
      else if(ln.st==='come'&&ln.t>ln.d){next('at',ln.k==='truck'?1.3:.9);gareVehicleSet(m,(ln.c0+ln.c1+1)/2*T-m.w/2,true);if(!G.sim&&ln.k==='truck'){tone(180,.35,'sawtooth',.05,170)}}
      else if(ln.st==='at'&&ln.t>ln.d){next('leave',ln.k==='truck'?.45:1.4);gareVehicleSet(m,-9999,false)}
      else if(ln.st==='leave'&&ln.t>ln.d)next('idle',ln.k==='truck'?1.2+rnd()*1.6:1+rnd()*1.4);
      m.dx=0;if(ln.st==='at')hitVeh(m,'voiture')}}
  // les voyageurs à valise : ils vont et viennent ; si on les survole, ils battent des bras
  const [p0,p1]=[126*T,152*T];   // ils ne vont ni sur le cartel du parvis ni derrière l'immeuble d'angle
  for(const p of S2.pass){p.x+=p.dir*p.sp*dt;if(p.x<p0){p.x=p0;p.dir=1}if(p.x>p1){p.x=p1;p.dir=-1}p.wave=Math.max(0,p.wave-dt);p.cool=Math.max(0,p.cool-dt);
    if(P.dead)continue;
    const body={x:p.x-11,y:F-100,w:22,h:100},bag={x:p.x-p.dir*30-11,y:F-40,w:22,h:40};
    if(overlap(hb,body)||(p.k!=='sac'&&overlap(hb,bag)))G.gareHit='passant';
    if(Math.abs(pcx-p.x)<60&&P.y+P.h<F-60&&P.y+P.h>F-260&&p.cool<=0){p.wave=.9;p.cool=1.4;if(!G.sim){bubble(p.x,F-150,pick(["Hé ! Sale bête !","Pas sur moi !","Ouste !","Beurk !"]),'#2a3a5a');if(!S2.said.wave){S2.said.wave=1;setTimeout(()=>say("Ils battent des bras comme des sémaphores. Surtout, ne pas les toucher, ni eux ni leurs malles.",3.4),700)}}}
  }
  // les pigeons du square
  for(const o of S2.pig){o.t+=dt;o.cool=Math.max(0,o.cool-dt);o.spit=Math.max(0,(o.spit||0)-dt);
    if(o.st==='flee'){o.vy-=400*dt;o.y+=o.vy*dt;o.x+=o.f*160*dt;continue}
    const dx=pcx-o.x,near=Math.abs(dx);

    else if(o.k==='deplume'){// court vers Raymond, ne vole pas
      if(near<320&&P.y+P.h>F-120){o.st='run';o.f=Math.sign(dx)||1;o.x+=o.f*205*dt}else{o.st='walk';o.f=Math.sin(o.t*.5)>0?1:-1;o.x+=o.f*25*dt}
      o.x=clamp(o.x,o.home-7*T,o.home+7*T);if(near<160&&!S2.said.dep&&!G.sim){S2.said.dep=1;bubble(o.x,F-40,'Kroûû !','#6a4a4a')}}
    else{// le pigeon aux moignons : il boitille de gauche à droite et demande l'aumône ; inoffensif
      o.st='walk';o.f=Math.sin(o.t*.4)>0?1:-1;o.x+=o.f*16*dt;o.x=clamp(o.x,o.home-120,o.home+120);
      o.beg=Math.max(0,o.beg-dt);if(near<230&&o.beg<=0&&!G.sim){o.beg=2.8;bubble(o.x,F-44,pick(["Une graine, pour un ancien combattant ?","Pitié, camarade…","Rien qu'une miette…"]),'#6a5a48')}}
    if(!P.dead&&o.k!=='moignon'&&overlap(hb,{x:o.x-(o.k==='gros'?16:12),y:o.y-(o.k==='gros'?30:24),w:o.k==='gros'?32:24,h:o.k==='gros'?28:22}))G.gareHit=o.k==='gros'?'pigeonGros':'pigeonDeplume'}
  S2.pig=S2.pig.filter(o=>o.y>-200);
  if(S2.grace>0){S2.grace-=dt;G.gareHit=null}

    if(d<10){S2.seeds.splice(i,1);if(!G.sim)puff(tx,ty,4,false);if(!P.dead)G.gareHit='graine'}else if(P.dead)S2.seeds.splice(i,1)}
}
/* au retour sur un cartel : deux secondes de répit, et personne n'attend Raymond dessus */
function gareRespawn(){

function drawColbertFigure(g,cx,base){

  g.fillStyle=B1;g.beginPath();g.moveTo(1,0);g.lineTo(3,-30);g.lineTo(12,-30);g.lineTo(11,-3);g.lineTo(16,0);g.closePath();g.fill();

  // le manteau qui revient sur le devant, retenu par la main gauche

  g.strokeStyle=B1;g.lineWidth=1.3;g.beginPath();g.moveTo(10,-80);g.quadraticCurveTo(14,-60,10,-40);g.stroke();
  g.strokeStyle=B2;g.lineWidth=6;g.beginPath();g.moveTo(11,-84);g.quadraticCurveTo(10,-72,4,-68);g.stroke();g.lineCap='butt';

  g.fillStyle=B0;g.beginPath();g.ellipse(0,-102,13,15,0,0,7);g.fill();g.fillRect(-15,-100,30,12);   // le volume de la perruque, sans jour entre les boucles et le visage

/* une rue transversale qui s'enfonce entre deux immeubles : chaque côté prolonge l'immeuble voisin (même hauteur, même matière) */

  for(const[sd,F0]of[[-1,Lf],[1,Rf]]){const xn=sd<0?a:e,xf=vx+sd*46,nt=F0.top,ft=HZ-(b-nt)*sF,mh=F0.mh;

    g.fillStyle='#c8c2b4';poly(g,[xn,b,xf,HZ,xf-sd*8,HZ,xn-sd*30,b]);g.fill()}
  g.fillStyle=o.cobble?'#8a8478':'#6e7076';poly(g,[a+30,b,vx-38,HZ,vx+38,HZ,e-30,b]);g.fill();
  if(o.cobble){g.strokeStyle='rgba(0,0,0,.12)';g.lineWidth=1;for(let k=1;k<10;k++){const u=1-1/(1+k*.4),y=b+(HZ-b)*u,hw=(e-a-60)/2*(1-u)+38*u;g.beginPath();g.moveTo(vx-hw,y);g.lineTo(vx+hw,y);g.stroke()}}

/* ---------- la couche des façades (en cache) ---------- */

  const order=D.facades.filter(f=>f.k==='rue').concat(D.facades.filter(f=>f.k!=='rue'));for(const f of order){g.save();
    if(f.k==='rotonde')lgRotonde(g,f.c0,f.c1,R);else if(f.k==='hotel')lgHotelBrique(g,f.c0,f.c1,R);else if(f.k==='rue'){const i=D.facades.indexOf(f);lgRue(g,f.c0,f.c1,f,lgInfo(D.facades[i-1]),lgInfo(D.facades[i+1]))}else if(f.k==='gothique')lgGothique(g,f.c0,f.c1,R);else if(f.k==='coupole')lgCoupole(g,f.c0,f.c1,R);
    else if(f.k==='verre')lgVerre(g,f.c0,f.c1);else if(f.k==='moderne')lgModerne(g,f.c0,f.c1);else if(f.k==='blanc')lgBanqueBlanche(g,f.c0,f.c1,R);else if(f.k==='nouveau')lgArtNouveau(g,f.c0,f.c1,R);
    else if(f.k==='cl')lgCreditLyonnais(g,f.c0,f.c1,R);else if(f.k==='cathedrale')lgCathedrale(g,f.c0,f.c1,R);else lgImm(g,f,R);g.restore()}
  for(const[a,e,col]of Lv.def.awnSpans||[])lgAwning(g,a,e,col);
  Lv.lgRails=LG.rec;LG.rec=null;

  for(const tx of D.trees)LG.furn.push({k:'tree',x:tx*T});for(const lx of D.lamps)LG.furn.push({k:'lamp',x:lx*T});

  return c;
}

}

/* carte : Raymond perd la tête. Il tremble, la couture du cou lâche, la tête saute,
   retombe et roule ; le corps reste debout un instant, puis s'effondre sur le côté. */
function drawHeadlessCard(ct){
  const fx=W/2-60,fy=290,sz=3.4,gyb=fy;
  ctx.save();
  // sol et ombre
  ctx.fillStyle='rgba(233,223,199,.06)';ctx.fillRect(150,gyb,W-300,1.5);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(fx,gyb+3,58,8,0,0,7);ctx.fill();
  const POP=1.1,tt=ct-POP;
  // tremblement avant
  const shake=tt<0?Math.sin(ct*48)*Math.min(1,ct)*1.6:0;
  // le corps : debout, puis bascule sur le côté (pivot aux pattes)
  const fallT=tt-1.5,fall=fallT>0?Math.min(1,fallT/.55):0,fe=fall*fall*(3-2*fall);
  const bounce=fall>=1?Math.sin(Math.min(1,(fallT-.55)/.25)*Math.PI)*.06:0;
  if(tt<0)drawRaymond(ctx,fx+shake,gyb,{f:1,t:0,walk:0,wear:4,size:sz,eyeClosed:false});
  else{const rr2=-fe*Math.PI+bounce;drawRaymond(ctx,fx,gyb-26*sz*Math.pow(Math.sin(rr2/2),2),{f:1,t:0,walk:0,wear:4,size:sz,noHead:true,straw:Math.min(1.6,.4+tt*2),rot:rr2})}
  // fil qui lâche
  if(tt<0&&ct>.6){ctx.strokeStyle='rgba(233,223,199,'+(ct-.6)*1.6+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(fx+22*sz/3.4*3,gyb-23*sz);ctx.lineTo(fx+30*sz/3.4*3,gyb-27*sz);ctx.stroke()}
  // la tête
  if(tt>=0){
    const hx0=fx+9.5*sz,hy0=gyb-28*sz,groundY=gyb-6*sz;
    let hx,hy,rot;
    if(tt<.62){const u=tt;hx=hx0+210*u;hy=hy0-(620*u-1700*u*u/2)*1;rot=u*9}
    else{const u0=.62,x1=hx0+210*u0,y1=Math.min(groundY,hy0-(620*u0-1700*u0*u0/2));const r=tt-u0,d=1-Math.exp(-r*2.6);
      const by=Math.abs(Math.sin(Math.min(r,.6)/.6*Math.PI))*Math.max(0,.6-r)*40;
      hx=x1+120*d;hy=Math.min(groundY,lerp(y1,groundY,Math.min(1,r*6)))-by;rot=lerp(u0*9,Math.PI*4+.3,d)}
    // arrêt : la tête finit posée, l'œil-bouton vers nous
    ctx.fillStyle='rgba(0,0,0,'+(tt>.62?.35:.15)+')';ctx.beginPath();ctx.ellipse(hx,groundY+6*sz,20,4,0,0,7);ctx.fill();
    drawRaymondHead(ctx,hx,hy,{wear:4,size:sz,rot});
    // brins de paille éjectés
    const R=mulberry(9);ctx.lineCap='round';
    for(let k=0;k<22;k++){const a=-Math.PI/2+(R()-.5)*1.4,v=160+R()*260,life=Math.min(tt,1.2),px=fx+6.4*sz+Math.cos(a)*v*life,py=gyb-23*sz+Math.sin(a)*v*life+700*life*life,rr=R()*6+tt*R()*8;
      const yy=Math.min(py,gyb-1);ctx.save();ctx.translate(px,yy);ctx.rotate(yy>=gyb-1?.1*k:rr);ctx.strokeStyle=k%3?'#e0b04e':'#b8862e';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(4,0);ctx.stroke();ctx.restore()}
  }
  ctx.restore();
}

  const fa=Math.min(1,G.cardT*2.2),prev=G.card>0?G.cards[G.card-1]:null,keepPic=prev&&prev.pic&&prev.pic===c.pic;

    if(c.pic==='stats'){drawStatsCard(c.w,G.cardT);y=-999}
    ctx.globalAlpha=fl*fa;ctx.fillStyle='#ece3cc';
    if(c.title){ctx.font='34px '+F_DISP;ctx.fillText(c.title,W/2,c.pic?y:y-50);y+=c.pic?38:0}

let last=performance.now(),acc=0;
const STEP=1/120;
function update(dt){
  G.t+=dt;
  if(G.fade>0)G.fade=Math.max(0,G.fade-dt*2.2);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  if(G.quip&&!(G.state==='play'&&G.hintI>=0)){G.quip.t+=dt;if(G.quip.t>G.quip.dur){G.quip=null;if(G.quipQ&&G.quipQ.length){const f=G.quipQ.shift();say(f[1],f[2]||4,f[0])}}}
  if(G.state!=='play')loopsOff();
  switch(G.state){
    case'title':handleMenu();break;
    case'pause':if(pressed.has('esc')){G.state='play';break}handleMenu();break;
    case'select':handleSelect();break;
    case'confirm':handleConfirm();break;
    case'ach':handleAch();break;
    case'intro':handleCards(dt);break;
    case'levelend':handleLetter(dt);break;
    case'play':{
      if(pressed.has('esc')){G.state='pause';G.menuSel=0;break}
      if(G.click&&G.homeBox&&!G.cut){const b=G.homeBox;if(G.click.x>b.x&&G.click.x<b.x+b.w&&G.click.y>b.y&&G.click.y<b.y+b.h){askHome();break}}
      if(G.cut&&(pressed.has('ok')||pressed.has('restart')||G.click)&&G.cut.t>1)skipCut();
      if(pressed.has('restart')&&!P.dead&&!G.cut){resetPlayer();P.wake=.3;respawnChaserOnly()}
      if(pressed.has('jump')&&!G.cut)P.jumpBuf=.12;
      if(pressed.has('act')&&!G.cut)tryAct();
      acc+=dt;let n=0;while(acc>=STEP&&n<12){stepPlay(STEP);acc-=STEP;n++;if(G.state!=='play')break}
      if(acc>STEP)acc=0;
      if(G.state==='play'){animalSounds(dt);updateCamera(dt)}
      updateParticles(dt);
      if(G.tickSnd){G.tickSnd=false;SFX.tick()}
      break}
    case'exiting':{
      G.exitT+=dt;updateParticles(dt);
      if(G.exitT>1.1){
        const li=G.li;S.unlocked=Math.min(19,Math.max(S.unlocked,li+1));
        if(G.medal)S.run.medals[li]=true;
        const gt=gotOf(li);
        S.run.stats[li]={corn:gt.c.length,cornTotal:G.cornTotal,medal:gt.m,hasMedal:!!L.medal,secFound:gt.sec.length,secTotal:L.secretTotal||0,deaths:gt.d};S.run.stats[li].points=levelPoints(S.run.stats[li]);S.run.stats[li].max=levelMax(S.run.stats[li]);
        const b=S.best[li]||{corn:0,medal:false,deaths:9999,points:0};S.best[li]={corn:Math.max(b.corn,gt.c.length),medal:b.medal||gt.m,secret:Math.max(b.secret||0,gt.sec.length),deaths:Math.min(b.deaths,gt.d),points:Math.max(b.points||0,S.run.stats[li].points)};save();
        setSong('title');endOfLevel(li);
      }
      break}
  }
  pressed.clear();G.click=null;
}
